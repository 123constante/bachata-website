version: 2

# Weekly grouped dependency PRs so 90+ deps stop being bumped by hand. Minor +
# patch land in a single PR/week (existing e2e-smoke + architecture-guard +
# db-contract gates vet each before merge). MAJORS of the cache-tuned vendor
# chunks (vite.config.ts manualChunks) are ignored: this repo is acutely
# stale-chunk sensitive, so a chunk-affecting major must be a deliberate,
# tested bump - never an auto-PR that silently re-buckets a tuned chunk.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait before opening a PR for a brand-new release: cuts churn from
    # yanked/hot-fixed releases and the CI + Vercel load of each PR. Majors wait
    # longer. Version updates only -- security updates ignore cooldown.
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # Listed FIRST because a dependency joins the first group whose patterns
      # match. Supabase is carved out of the weekly batch because its minors
      # carry real first-load weight: 2.89.0 -> 2.111.0 in PR #187 added
      # 12.6 KB gzip to the vendor-supabase chunk and put home (/city/:slug)
      # 11.6 KB OVER its 245 KB budget. Batched with 52 other bumps that cost
      # is invisible; on its own PR bundle-budget names it AND BLOCKS - the
      # perf-budget bundle-budget job had continue-on-error dropped precisely
      # so this carve-out rests on a gate rather than on a printed warning.
      # Do not re-soften it without re-softening this comment too. Its own PR
      # means the fix (code-splitting realtime out of home's first-load graph
      # - home never uses it, only the event-page guest list does) can land
      # alongside the bump rather than blocking the whole batch.
      supabase:
        patterns:
          - "@supabase/*"
        update-types:
          - minor
          - patch
      minor-and-patch:
        exclude-patterns:
          - "@supabase/*"
        update-types:
          - minor
          - patch
    ignore:
      # --- MAJORS held: cache-tuned vendor chunks, plus the react-router family
      # IN LOCKSTEP. react-router-dom alone is not the family: majors are
      # ungrouped here (both groups declare minor+patch only), so an RR8 would
      # arrive as a lone react-router@8 PR against a pinned react-router-dom@7
      # - a split-version tree. Commit 3f0e491 hand-fixed exactly that class.
      # @types/react* ride with react/react-dom for the same reason: a
      # @types/react@19 PR against React 18 blows the 106-error typecheck
      # ratchet that pre-ship enforces.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: react-router
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@react-router/node"
        update-types: [version-update:semver-major]
      - dependency-name: "@react-router/dev"
        update-types: [version-update:semver-major]
      - dependency-name: "@vercel/react-router"
        update-types: [version-update:semver-major]
      - dependency-name: "@tanstack/react-query"
        update-types: [version-update:semver-major]
      - dependency-name: framer-motion
        update-types: [version-update:semver-major]
      - dependency-name: "@supabase/supabase-js"
        update-types: [version-update:semver-major]

      # @hookform/resolvers is pinned ~5.2.2 (PR #540). 5.4+ declare optional peers
      # (@typeschema/main -> valibot 0.39) that fail npm ERESOLVE against the valibot 1.x
      # pulled in by @react-router/dev, so the grouped PR (#544) failed its Vercel build.
      # Lift this ignore only once that peer chain resolves.
      - dependency-name: "@hookform/resolvers"
        versions: [">=5.3.0"]

      # MAJORS that fail npm ERESOLVE today (PRs #567, #569, 2026-10-06). Each needs a
      # deliberate migration, not an auto-PR:
      #   vitest 5: peer conflict against the current vite/vitest toolchain.
      #   date-fns 4: react-day-picker 8.x needs date-fns 2 or 3; lift this once the
      #   calendar picker is migrated to react-day-picker 9.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: date-fns
        update-types: [version-update:semver-major]

      # eslint 10 (PR #576, 2026-10-06) fails npm ERESOLVE: eslint-plugin-react-hooks@5.x
      # peers eslint ^9 at most, and @eslint/js@10 peers eslint ^10, so the two move
      # together. Lift both once eslint-plugin-react-hooks is bumped to a version whose
      # peer range includes eslint ^10 (7.1.x) as one deliberate, tested change.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]

      # tailwindcss 4 (PR #578, 2026-10-06): the PostCSS plugin moved to
      # @tailwindcss/postcss and the config model changed, so the build fails. Needs a
      # deliberate Tailwind 3 -> 4 migration, not an auto-PR.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

      # The UI layer became cache-tuned on 2026-08-14, when P1 of the
      # vendor-cost arc pinned it into vendor-ui + vendor-ui-modal to cut
      # first-load REQUEST count (Vercel edge requests were at 180% of
      # allowance). It belongs under the same rule as the chunks above and was
      # simply not covered by it before: a Radix major can split, rename or
      # merge subpackages, which drops them out of the name lists in
      # vite.config.ts and back into per-package chunks -- silently re-bucketing
      # a tuned chunk, which is the exact thing this ignore block exists to stop
      # arriving as an auto-PR. Only DIRECT dependencies are listed; Radix's
      # runtime helpers (@floating-ui/*, aria-hidden, react-remove-scroll,
      # use-sidecar, react-style-singleton, tslib) are transitive and ride with
      # whatever bumps them. lucide-react appears again below for its minors.
      - dependency-name: "@radix-ui/*"
        update-types: [version-update:semver-major]
      - dependency-name: sonner
        update-types: [version-update:semver-major]
      - dependency-name: class-variance-authority
        update-types: [version-update:semver-major]
      - dependency-name: lucide-react
        update-types: [version-update:semver-major]

      # --- 0.x deps: the MINOR is the breaking release ---
      # npm caret on 0.x resolves to >=0.y.z <0.(y+1).0, so 0.34 -> 0.35 IS a
      # breaking bump - but Dependabot labels it semver-minor and the major
      # gate above never sees it. sharp 0.34->0.35 and next-themes 0.3->0.4
      # already rode into PR #187's 53-package batch that way (both checked,
      # both benign). The ones queued behind them are not: vaul backs five
      # drawer call sites and lucide-react is repo-wide, and a regression in
      # either is caught by nothing here - the esbuild build is transpile-only
      # and e2e-smoke is an explicit 5-spec list. Patches still auto-batch;
      # minors become deliberate, tested bumps. A 0.x -> 1.0 is a major and is
      # deliberately NOT ignored: it arrives alone and clearly labelled.
      - dependency-name: vaul
        update-types: [version-update:semver-minor]
      - dependency-name: lucide-react
        update-types: [version-update:semver-minor]
      - dependency-name: next-themes
        update-types: [version-update:semver-minor]
      - dependency-name: sharp
        update-types: [version-update:semver-minor]
      - dependency-name: class-variance-authority
        update-types: [version-update:semver-minor]
      - dependency-name: "@tailwindcss/typography"
        update-types: [version-update:semver-minor]
      - dependency-name: eslint-plugin-react-refresh
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
