name: DB Contract Check

# Verifies database invariants:
#  1. The calendar_occurrences venue/city override contract
#     (migration 20260428120000_occurrence_venue_drift_fix_v1).
#  2. The per-occurrence editing RPCs and their constraints
#     (migration 20260429182000_test_per_occurrence_v1).
#  3. The event-program duration contract - events.start_time/end_time
#     must align (within 240 min) with meta_data.program span for standard
#     events (admin migration 20260429320000_event_program_duration_contract_v1).
#  4. The session-people display_name_override contract - Phase A.5 of the
#     unified profile model plan (admin migrations 20260430180000 /
#     20260430180100 / 20260430180200). No override may equal the canonical
#     render (would indicate snapshot-pattern regression).
#  5. The guest-entries contract - raffle + guest_list status/qr_token
#     invariants, 90-day retention purge running, no stale erasure tokens
#     (admin migrations 20260502120000 through 20260502160000).
#  6. The Program editor Phase 0 schema contract - Day/Section/Section-Room
#     tables populated and event_program_items.day_id / section_id NOT NULL
#     (admin migrations 20260504050000 / 20260504050001).
#  7. The Phase 1 v2 program-save idempotency contract - admin_save_program_v2
#     never produces duplicate-success rows for the same (event_id, token)
#     and surfaces failed_saves_last_24h above baseline (admin migration
#     20260505010000_admin_save_program_v2_v1).
#  8. The day-rollover consistency contract - sessions starting between
#     00:00 and 08:00 of the day after the event start belong to the prior
#     day. Mirror logic in admin (lib/programDayRollover.ts) and Website
#     (src/lib/programDayRollover.ts) MUST match the canonical fixtures.
#     (Phase 1F brief Sec.6.2.5; admin lib/programDayRollover.ts.)
#  9. The admin_list_occurrences_for_event_v1 null-venue tolerance contract -
#     draft events with no venue set must not cause a 55000 error in the admin
#     list-occurrences RPC (admin migration 20260510020000).
# 10. The replace_event_program canvas consistency contract - every event's
#     meta_data.program session count must match its event_program_items count.
#     Drift baseline is 0 after Phase F backfill (2026-05-07)
#     (admin migrations 20260510030000 / 20260510040000 / 20260510050000).
# 11. The Phase 2/3 security-hardening policy contract - the nine policies
#     applied by admin migration 20260511010000 (Admin read on
#     event_program_items / organiser_team_members; Public read on
#     calendar_occurrences; Service role all on those three; Insert for
#     published events only on event_views; Admin insert on event_attendees /
#     songs) must all remain present. Catches raw-SQL drift outside the
#     migration channel. Health-check RPC: check_security_phase2_3_policies_v1
#     (admin migration 20260511030000).
# 12. The Phase 1 FK-index contract - the five FK indexes added by admin
#     migration 20260512000000 (cities.country_code, djs.user_id,
#     event_attendees.dancer_id, event_raffle_draws.prior_draw_id,
#     guest_dancer_profiles.city_id) must remain present. Health-check RPC:
#     check_fk_indexes_v1 (admin migration 20260512030000).
# 13. The event_attendees FK-target contract - the dancer_id FK must
#     reference public.dancer_profiles, never the archived
#     dancers_archive_april2026 table. Health-check RPC:
#     check_event_attendees_fk_target_v1 (admin migrations 20260512020000 /
#     20260512030000).
# 14. The epp.display_name drift contract - no public routine body may
#     reference event_program_people.display_name (column dropped Phase A.5,
#     replaced by display_name_override + canonical resolution from
#     dancer_profiles). Health-check RPC: check_epp_display_name_drift_v1
#     (admin migration 20260505160000).
# 15. The epp.avatar_url drift contract - no public routine body may
#     reference event_program_people.avatar_url (column dropped Phase A.5,
#     resolved from canonical profile instead). Sibling of #14; added after
#     four live RPCs were found referencing the dropped column on
#     2026-05-09. Health-check RPC: check_epp_avatar_url_drift_v1
#     (admin migration 20260527040000).
# 16. The venue coords contract - venues with raw location data (postcode /
#     google_maps_link / google_maps_url) must have lat/lng populated, so
#     the public calendar's "near me" distance sort can place them. BEFORE
#     INSERT/UPDATE trigger pulls @lat,lng from URLs in-DB; an edge fn
#     (venue-resolve-coords) handles shortlinks + postcodes.io + Nominatim
#     for the cases the trigger can't. CHECK constraint is the floor.
#     Health-check RPC: check_venue_coords_contract_v1 (admin migrations
#     20260601040000 / 20260601040100 / 20260601040200).
# 17. The teacher / DJ event-program assignment integrity contract - every
#     person flagged as an active teacher or active DJ in person_roles
#     must appear at least once in event_program_people in the matching
#     capacity (profile_type or role). Drift means a canonical-role person
#     is being shown on /teachers or /djs without any event attribution.
#     Local-only at write time; soft-passes when the RPC is not yet on
#     prod and when baselines are unset. Health-check RPC:
#     check_teacher_dj_assignment_integrity_v1 (admin migration
#     20260513070000).
# 18. Migration authority arc-closeout -- Website/supabase/migrations/ must
#     not exist. Folder was deleted May 2026; its re-appearance indicates a
#     migration authority violation (admin commit b0c8c4f5 is canonical).
#     No Supabase credentials required -- pure filesystem guard.
# 19. The per-date program canonical-vs-JSON-shadow contract (ADR-007).
#     calendar_occurrences.override_payload.program[] is a trigger-maintained
#     mirror of the canonical join (event_program_items +
#     calendar_occurrence_session_overrides + calendar_occurrence_added_sessions).
#     Any drift means a write bypassed the canonical layer or the trigger
#     silently failed. Health-check RPC:
#     check_per_date_program_canonical_consistency_v1 (admin migrations
#     20260623020000 / 20260623030000 / 20260623060000).
# 20. The occurrence instance_start/end vs canonical program contract
#     (ADR-007 Phase 5). instance_start/end is a UTC mirror of the canonical
#     program shifted into the occurrence's local date via series timezone.
#     Drift means wrong sort order on the public calendar and bad ICS
#     exports. Health-check RPC:
#     check_occurrence_instance_time_canonical_v1 (admin migrations
#     20260623070000 / 20260623080000 / 20260623090000).
# 21. The analytics tracking RPC param-contract - record_event_view_v1 and
#     record_event_link_click_v1 must accept the EXACT parameter names the
#     frontend sends (src/modules/event-page/useRecordEventView.ts,
#     src/lib/eventLinkClicks.ts). A DB-side param rename silently 404s every
#     tracking call - this happened May 2026 (p_session_id -> p_viewer_session_id)
#     and froze event-view capture for 16 days. Calls use a bot UA so the RPC
#     bot-filter returns before any row is written.
# 22. The analytics tracking freshness heartbeat - event_views must receive
#     rows within 48h. A live site with traffic that records zero views in 48h
#     means capture has died (the May 2026 outage). Health-check RPC:
#     check_event_tracking_health_v1 (admin migration 20260715030000). Clicks
#     are reported but non-gating (legitimately low volume).
# 23. The search_public_v3 RPC contract -- multi-entity site search RPC backing
#     the /search?q=... page (driven by hashtag chips on event detail pages).
#     Verifies the RPC exists, returns the six expected section arrays
#     (events / organisers / teachers / djs / dancers / venues), handles empty
#     and bogus queries, respects city scope, and enforces the upcoming-only
#     default (p_include_past=false) and all-time flag (p_include_past=true).
#     Admin migrations: 20260720000000_search_public_v3 and
#     20260726000000_search_public_v3_upcoming.
#

# 24. The cancelled-occurrence passthrough contract - event_view_p5
#     (snapshot_compat shape) MUST surface cancelled calendar_occurrences
#     in occurrences[] with is_cancelled=true, and MUST pin
#     occurrence_effective to the explicitly-requested occurrence_id even
#     when cancelled. Until admin migration
#     20260531210000_get_event_page_snapshot_v2_include_cancelled, the RPC
#     silently filtered cancelled rows, leaving every Website-side
#     cancellation UI inert (DateBlock pill, DatesBlock badge,
#     ScheduleBlock chip, StickyTicketButton hide, EventActionBar disable,
#     EventCancelledBanner).
#
# Catches operator error from outside the app (e.g. raw SQL admin work)
# that could re-introduce regressions.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:

jobs:
  contract-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm install` (not `npm ci`) because the puppeteer-core +
        # @sparticuz/chromium transitive chain has a peer dep
        # (quickjs-wasi under degenerator) that npm 10's strict ci-mode
        # integrity check trips on. Those packages are build-time-only
        # (Vercel prerender) and never imported by these contract
        # scripts, which just need @supabase/supabase-js. Lenient
        # install matches what Vercel does and stops the per-push
        # CI-fail-email loop.
        run: npm install --no-audit --no-fund

      - name: Run migration-authority arc-closeout check
        # Pure filesystem -- no Supabase secrets needed.
        run: node scripts/check-migration-stamps.mjs

      # -- Precheck: validate Supabase secret SHAPE before any downstream
      #    contract step crashes inside @supabase/supabase-js with a cryptic
      #    "Invalid supabaseUrl" stack trace. From inception (2026-04-28)
      #    through 2026-05-13, the workflow failed 77 consecutive runs on
      #    "Run venue contract check" because VITE_SUPABASE_URL was malformed -
      #    every downstream contract was silently un-watched the entire time.
      #    This precheck makes the failure mode visible and actionable.
      - name: Precheck Supabase secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/precheck-supabase-secrets.mjs

      - name: Run venue contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-venue-contract.mjs

      - name: Run venue coords contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-venue-coords.mjs

      - name: Run per-occurrence RPC test suite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-per-occurrence-rpcs.mjs

      - name: Run event-program duration contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-event-program-duration.mjs

      - name: Run session-people display_name override contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-session-people-display-name-contract.mjs

      - name: Run epp.display_name drift check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-epp-display-name-drift.mjs

      - name: Run epp.avatar_url drift check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-epp-avatar-url-drift.mjs

      - name: Run guest-entries contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-guest-entries-contract.mjs

      - name: Run program editor Phase 0 schema contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-program-schema-contract.mjs

      - name: Run program save (Phase 1 v2) idempotency contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-program-save-idempotency-contract.mjs

      - name: Run day-rollover consistency contract check (Phase 1F)
        # No Supabase secrets needed - the gate is pure-JS fixture verification
        # against src/lib/programDayRollover.ts. Cross-repo gap noted in script
        # header: admin lib is manually mirrored here. See script for TODO.
        run: node scripts/check-day-rollover-consistency-v1.mjs

      - name: Run admin-list-occurrences null-venue tolerance contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-admin-list-occurrences-null-venue-contract.mjs

      - name: Run replace-event-program canvas consistency contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-replace-event-program-canvas-consistency.mjs

      - name: Run Phase 2/3 security-hardening policy contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-security-phase2-3-policies.mjs

      - name: Run Phase 1 FK-index contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-fk-indexes.mjs

      - name: Run event_attendees FK-target contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-event-attendees-fk-target.mjs

      - name: Run teacher/DJ event-program assignment integrity contract check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-teacher-dj-assignment-integrity.mjs

      # ADR-007 checks run even if earlier (pre-existing) gates failed -
      # they monitor an independent invariant and we need their signal
      # regardless of upstream noise.
      - name: Run per-date program canonical consistency contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-per-date-program-canonical.mjs

      - name: Run occurrence instance_time canonical contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-occurrence-instance-time-canonical.mjs

      - name: Run occurrence program format contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-occurrence-program-format.mjs

      - name: Run per-date program sync mutation contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-per-date-program-sync-mutation.mjs

      - name: Run latest-events (Just added feed) ordering contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-latest-events.mjs

      - name: Run tracking RPC param-contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-tracking-rpc-contract.mjs

      - name: Run tracking freshness heartbeat check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-tracking-freshness.mjs

      - name: Run search_public_v3 contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-search-public-v3.mjs

      - name: Run cancelled-occurrence passthrough contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-cancelled-occurrence-passthrough.mjs

      # 25. Occurrence instance_END canonical (Occurrence Date Integrity arc,
      #     2026-06-05). instance_end must equal the program-canonical latest
      #     session end re-anchored to the occurrence local date — sibling of the
      #     instance_time (start) check above. Catches the start+24h span class of
      #     bug that produced a spurious multi-day flag on the public event page.
      - name: Run occurrence instance_END canonical contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-occurrence-instance-end-canonical.mjs

      # 26. Program-day / day_id integrity (Occurrence Date Integrity arc). No
      #     event_program_item may be filed under a day whose event_date != the
      #     item's canonical rollover display-day. Misfiled days leaked template
      #     dates into re-anchored occurrence schedules ("FRI 8 / SAT 9" bug).
      - name: Run program-day / day_id integrity contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-program-day-integrity.mjs

      # 27. Occurrence integrity aggregator (Occurrence Integrity arc time-convergence,
      #     2026-06-05). One rollup over date-sync, instance start/end, program-day,
      #     per-date shadow, program format, and the NEW P5->legacy session-override
      #     mirror parity. Backstops #19/#20/#25/#26 and the new mirror invariant in a
      #     single gate that can't be forgotten. Mechanical drift is repairable via
      #     self_heal_occurrence_integrity_v1(); date direction is a human call.
      - name: Run occurrence integrity aggregator check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-occurrence-integrity.mjs

      # 28. Live series occurrence-horizon guardrail (2026-06-05). A live recurring
      #     series with no future occurrence silently disappears from the public
      #     calendar (get_calendar_events_v2 sources dates from event_occurrence_p5).
      #     This is how ~20 backfilled NULL-recurrence_rule series were quietly dying,
      #     incl. the reported "Bachata on Saturday" (admin migration 20260809120000
      #     set their rules). Hard-fails only on the unambiguous bug: an OPEN-ENDED
      #     rule (end.kind='none') with zero future dates = materialisation lapsed.
      #     NULL-rule / manual / finite series running low are reported, not gated.
      #     Health-check RPC: check_live_series_occurrence_horizon_v1 (admin migration
      #     20260809130000).
      - name: Run live series occurrence-horizon guardrail check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-series-occurrence-horizon.mjs

      # 29. P5 orphan-series guard (P5 <-> legacy orphan integrity arc, 2026-06-05). A LIVE
      #     event_series_p5 with legacy_event_id IS NULL is public-visible via
      #     get_calendar_events_v2 but INVISIBLE in the admin events list
      #     (admin_dashboard_events_list_v1 reads legacy public.events) -- the "BOS con SALSA! 2"
      #     class of bug: an event shows on the site yet can't be found/managed in admin. The two
      #     real cases (created pre the 20260604160000 auto-bridge) were rescued in admin migration
      #     20260809110000; ~517 E2E test-pollution orphans purged in 20260809200000. This guard
      #     keeps the gate at baseline 0 (E2E test names excluded). Health-check RPC:
      #     check_p5_orphan_series_v1 (admin migration 20260809210000).
      - name: Run P5 orphan-series guard check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-p5-orphan-series.mjs

      # 30. Festival Map RPC contract (2026-06-07). Anon-calls
      #     get_map_events_v1(london-gb, now, now+90d) and asserts the full
      #     MapEvent shape the homepage map + cards read (coords, cover, times,
      #     category flags, added/updated freshness), non-null identity/time
      #     fields, freshness_kind in {added,updated,null}, naive wall-clock
      #     start/end times (never tz-shifted) and >=1 row with coords (pins).
      #     The map silently empties if the RPC drifts or the v2 wrapper breaks.
      #     RPC: admin migration 20260810000000_get_map_events_v1.sql; consumer:
      #     src/hooks/useMapEvents.ts.
      - name: Run Festival Map RPC contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-map-events-rpc.mjs

      # 34. Organiser-link contract (P5 <-> event_entities), 2026-06-11. Every ACTIVE
      #     event whose organiser is set in event_series_p5.organiser_ids MUST have a
      #     matching event_entities role='organiser' row, because the public organiser
      #     page (src/pages/OrganiserProfile.tsx) + MoreEventsSection + FestivalDetail
      #     read event_entities EXCLUSIVELY. The editor-v2 save path
      #     (_cmd_series_upsert_p5) writes organisers ONLY to the P5 array, so organiser
      #     pages silently render "No upcoming events". anon cannot read event_series_p5
      #     (RLS event_series_p5_ss_select gated by FF_DB_SELF_SERVE_RLS, off in prod),
      #     so detection needs the anon-exec SECURITY DEFINER RPC
      #     check_organiser_link_contract_v1 (admin migration, pending). SOFT-PASSES
      #     until that RPC ships. Full write-through fix: docs/organiser-link-fix-plan.md.
      - name: Run organiser-link contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-organiser-link-contract.mjs
