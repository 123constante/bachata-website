      - name: Run series-materialisation horizon watchdog check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-series-materialisation.mjs

      # 55. People public-read contract (M3 Phase 0, 2026-07-18). The people
      #     surfaces — /teachers, /djs, /all-profiles, site search — had NO guard
      #     at all, and that gap is how the M3 plan came to specify a change that
      #     would have deleted three teachers from the live site. Phase A strips
      #     legacy COALESCE arms (COALESCE(avatar_url, photo_url) -> avatar_url)
      #     and was described as non-destructive; but on the three teacher RPCs
      #     that COALESCE is in the WHERE clause, so it gates ROW MEMBERSHIP, not
      #     display. Measured against prod: get_public_teachers_list_v1 would have
      #     gone 34 rows -> 31, 404ing three detail pages and orphaning their
      #     sitemap URLs. Every existing guard stayed green: check-search-public-v5
      #     probes v5 while production runs v4 and asserts shape only;
      #     check_dancer_profiles_legacy_col_drift_v1 was wired into nothing and
      #     went red on correct work; check:rpc-snapshots is an md5 of the body;
      #     and no E2E spec covers these routes. Asserts survivor violations,
      #     teacher-gate parity (with vs without the legacy arm — self-maintaining,
      #     no pinned count to rot), sidecar coverage, that admin_save_person_v1
      #     stays key-driven rather than role-driven (it used to DELETE a person's
      #     sidecar whenever the role was absent, while the READ emitted that same
      #     sidecar from row existence — 70 of 111 rows were one save from silent
      #     deletion), and search recall against search_public_v4, the LIVE path.
      #     All five failure modes verified reachable by re-introducing the bug
      #     against prod in a rolled-back transaction. Health-check RPC:
      #     check_people_public_read_contract_v1 (admin migration 20260718120000);
      #     survivor heal 20260718100000, writer fix 20260718110000.
      - name: Run people public-read contract check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-people-public-read-contract.mjs

      # 56. P5 slug-resolver parity (M2 caller-zero keystone, 2026-07-25). The
      #     keystone repointed the /event and /festival identity resolve
      #     (app/detailLoader.ts, app/routes/event.tsx, src/lib/seo/useEntitySlugOrId.ts,
      #     app/lib/ogCardRender.ts) off legacy `events` onto the pure-P5 resolver
      #     resolve_public_event_ref_v1, which reads the now-canonical
      #     event_series_p5.slug. This guard HOLDS that resolver byte-equal to the old
      #     legacy read for every anon-visible event until legacy `events` drops
      #     (Phase 1E #2 Stage E) - a slug that stops resolving, or resolves to the
      #     wrong id, silently 404s a live page. Asserts positive (every active event
      #     round-trips its slug), fidelity (the anon EXECUTE grant - the DEFINER guard
      #     calls the DEFINER resolver as OWNER, so a botched grant would pass here
      #     while the live anon site 403s), and non-vacuity (checked > 0). GATED at
      #     ok=true; soft-passes until admin migration 20260725110000 ships.
      #     Health-check RPC: check_slug_resolver_p5_parity_v1.
      - name: Run slug-resolver parity check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-slug-resolver-parity.mjs

      # 57. event_series_p5 slug presence (M2 caller-zero keystone, 2026-07-25).
      #     REPORT-ONLY sibling of #56. Flags any LIVE series with a NULL/empty slug -
      #     a writer the BEFORE-INSERT auto-populate trigger (admin migration
      #     20260725100000) did not cover, whose page cannot be reached by slug. Follows
      #     enforce-don't-repair sequencing: report first, soak, let runtime truth
      #     produce any missed-writer worklist, THEN promote slug to a hard NOT NULL /
      #     DEFERRABLE constraint (migration C). So this WARNS and stays green.
      #     NB #56 is NOT a backstop for the P5-native population:
      #     check_slug_resolver_p5_parity_v1 drives its loops FROM public.events, so a
      #     series with legacy_event_id IS NULL is never probed there and can never turn
      #     it red. For those rows - the shape every self-serve writer produces - this
      #     report-only step is the ONLY signal until migration C lands.
      #     Soft-passes until admin migration 20260725100000 ships. Health-check RPC:
      #     check_event_series_p5_slug_presence_v1.
      - name: Run event_series_p5 slug presence check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-slug-presence.mjs

      # 58. pg_proc materialised-cast lint (P5 wall-clock +1h regression guard,
      #     2026-07-26). materialised_start_utc / materialised_end_utc hold a NAIVE
      #     London wall clock stamped +00 (stash_local_as_utc STAMPS, does not
      #     convert), so the ONLY correct unstamp is `AT TIME ZONE 'UTC'`; any other
      #     zone re-applies the offset. In BST season search_public_v5 and the event
      #     page (_event_view_snapshot_compat_v1) both shipped a double cast
      #     (`... AT TIME ZONE tz ... AT TIME ZONE 'UTC'`) that reported 21:00 for a
      #     20:00 event; the client's WallClock brand renders whatever the RPC hands
      #     it, so nothing caught it. This is the SQL analogue of that brand lint:
      #     scans pg_proc.prosrc for `materialised_%_utc AT TIME ZONE <not 'UTC'>` and
      #     fails on any offender. Fixed by admin migrations 20260726010000 /
      #     20260726015000. Health-check RPC: check_no_materialised_utc_miscast_v1.
      - name: Run pg_proc materialised-cast lint
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-pgproc-materialised-cast.mjs

      # 59. Cross-surface start-time agreement (2026-07-26). The event page
      #     (event_view_p5 snapshot_compat) and search (search_public_v5) both READ
      #     event_occurrence_p5.materialised_start_utc; they must echo that stored wall
      #     clock as-is. The +1h double-cast (see #58) made both report 21:00 for a
      #     20:00 event, and no guard compared a surface to the canonical value, so it
      #     shipped live for 53 of 61 BST-season series. This asserts both readers
      #     equal the canonical materialised_start_utc (via the anon sampler
      #     _public_time_agreement_sample_v1) to the millisecond for the next-upcoming
      #     occurrence of a sample of live series. Calendar/map/venue-dto are NOT the
      #     reference: they re-derive from the program/default and can legitimately
      #     differ from a stale column (that is materialised drift, #43's job).
      - name: Run surface time-agreement check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-surface-time-agreement.mjs

      # 60. Event-page payload self-consistency (2026-07-26). event_view_p5
      #     (snapshot_compat) must never return a non-null occurrence_id with a null
      #     occurrence_effective - DateBlock renders "TBA" when occurrence_effective is
      #     null. A pinned NULL-materialised (or archived, or beyond-52-window)
      #     occurrence used to echo occurrence_id non-null + occurrence_effective null,
      #     which is what put "TBA" on the venue What's-On -> event page path. Fixed
      #     (admin 20260726015000: build occurrence_effective from a direct lookup with
      #     a NULL-materialised fallback). Asserts the invariant on a sample of live
      #     events, landing AND pinned. Calls event_view_p5 directly (no health RPC).
      - name: Run compat payload-consistency check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-compat-payload-consistency.mjs

      # 61. P5 occurrence materialise-leak guard (2026-07-26). A write path
      #     (_cmd_series_add_date_p5, the ad-hoc "add date" command) inserted
      #     event_occurrence_p5 rows with lifecycle_status='scheduled' but a NULL
      #     materialised_start_utc. search_public_v5 filters that column IS NOT
      #     NULL, so such an occurrence is INVISIBLE to site search while the
      #     calendar/map (which do not read it) render it fine — one leaked in a
      #     live series ("Bachata on Saturday") and went unfindable. The canonical
      #     materialised check (#43, check_occurrence_p5_materialised_canonical_v1)
      #     is STRUCTURALLY BLIND to this: it filters materialised_start_utc IS NOT
      #     NULL BEFORE counting, so an unmaterialised row scores as clean. This
      #     guard is scoped to the leak: live, non-festival, scheduled occurrences
      #     that ARE materialisable (the canonical resolver yields a headline) yet
      #     carry a NULL materialised_start_utc — so the 305-row dead orphan-series
      #     blob never counts and it stays green. Writer fixed in admin migration
      #     20260726020000. Health-check RPC: check_occurrence_p5_unmaterialised_v1
      #     (admin migration 20260726030000); live rows repaired via
      #     _recompute_occurrence_headline_time_from_sessions_v1.
      - name: Run P5 unmaterialised-occurrence guard check
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/check-p5-unmaterialised.mjs

      # ── Failure notification ────────────────────────────────────────────────────
      #
      # WHY THIS EXISTS. Every guard step above carries `if: always()`, so the job
      # runs all of them and collapses the result into one red X. Until now nothing
      # announced that X. The precheck comment further up records what that costs:
      # from inception (2026-04-28) through 2026-05-13 this workflow failed 77
      # consecutive runs on a malformed VITE_SUPABASE_URL, and every downstream
      # contract was silently un-watched the entire time. The checks were wired; they
      # had no audience. A guard nobody hears is not a guard, and adding more of them
      # to this job without this step would just have grown the silent set.
      #
      # SCOPED TO `schedule` DELIBERATELY. push/pull_request failures already reach
      # the author through GitHub's default notification, and a per-push issue was
      # the "CI-fail-email loop" the install step above was softened to stop. It is
      # the unattended nightly run that has no audience.
      #
      # ONE ISSUE, REUSED. A guard that stays red for a week should produce a single
      # thread with a comment trail, not seven issues that train you to close them
      # unread. It auto-closes on the next green nightly.
      - name: Announce failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'db-contract-check';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Nightly `db-contract-check` failed.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'Open the run and read which step(s) are red. Each step names the',
              'health-check RPC it calls, and the comment above that step explains',
              'what regression it was added to catch.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'db-contract-check red', body, labels: [LABEL],
              });
            }

      - name: Close failure issue when green again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = 'db-contract-check';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }
