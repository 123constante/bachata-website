name: Synthetic SSR Monitor

# Loads the live production SSR entry points (/city/london-gb + a self-selected
# event page) in a real headless browser under the conditions that first broke
# them — a crawler User-Agent and a NON-London timezone (UTC) — and fails on a
# client-side RangeError, a hydration cascade, a tripped error boundary, or a
# non-2xx document. All three issues in the 2026-07-09 post-mortem were first
# reported by real crawlers/visitors; this would have caught them pre-user.
#
# Read-only GETs against prod. Separate from the local e2e gate
# (playwright.synthetic.config.ts, testDir tests/synthetic).

on:
  schedule:
    # Daily, and off the hour. Was 6-hourly; the saving is Vercel edge
    # requests, which is the meter that hit 100% on 2026-08-14. It is NOT a
    # Supabase saving, whatever the cost plan claimed: the UA here is
    # Googlebot, and middleware.ts returns early for a bare city path under a
    # search bot (`isBareCity && isSearchBot`) before any supabaseFetch, while
    # /event left the middleware `matcher` in Phase 5 -- so neither of this
    # suite's two navigations reaches the bot path at all. The cost is
    # detection latency: ~6h to ~24h for a prod SSR RangeError or hydration
    # cascade, the 2026-07-09 post-mortem class.
    - cron: '53 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (defaults to production)'
        required: false
        default: 'https://www.bachatacalendar.co.uk'
      test_notification:
        description: 'Fail deliberately, to prove the failure notification still works'
        type: boolean
        default: false
  pull_request:
    branches: [main, master]

concurrency:
  group: synthetic-ssr-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    # Production run (schedule + manual). Skipped on PRs — synthetic-preview covers those.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed by the "Announce failure" step below -- see
      # db-contract-check.yml's comment above its own permissions block.
      issues: write
    steps:
      # A deliberate failure, on demand -- proves the notify step below end to
      # end. Mirrors db-contract-check.yml's test_notification input.
      - name: Deliberate failure (notification self-test)
        if: inputs.test_notification
        run: |
          echo "test_notification=true - failing on purpose to exercise the notifier."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run synthetic SSR monitor
        env:
          CI: 'true'
          SYNTHETIC_BASE_URL: ${{ github.event.inputs.base_url || 'https://www.bachatacalendar.co.uk' }}
        run: npm run synthetic:ssr

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-ssr-traces
          path: test-results/
          retention-days: 7

      # Failure-notification pattern copied from db-contract-check.yml (see its
      # "Announce failure" step for the full cancelled()/schedule reasoning) --
      # WITHOUT the cancelled() clause db-contract-check.yml also carries.
      # This workflow (unlike db-contract-check.yml) has
      # `concurrency: cancel-in-progress: true` on the same ref, so an
      # ordinary workflow_dispatch overlapping an in-flight schedule tick
      # CANCELS the older run -- a benign preemption that reads as "failed" to
      # a bare `cancelled()` check, which would open a false-positive issue
      # for a run where nothing was actually broken. Scoped to schedule +
      # workflow_dispatch only -- PR runs already have a human in the loop via
      # the PR itself.
      - name: Announce failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'synthetic-ssr-monitor';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Synthetic SSR Monitor failed.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'Open the run and read which page failed -- /city/london-gb or the',
              'self-selected event page -- and whether it was a RangeError,',
              'hydration cascade, error boundary trip, or a non-2xx document.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'Synthetic SSR Monitor red', body, labels: [LABEL],
              });
            }

      - name: Close failure issue when green again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'synthetic-ssr-monitor';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }

  synthetic-preview:
    # Pre-merge run against the PR's Vercel preview: catches an SSR/hydration
    # regression before it ships. The preview is reached first-party via
    # previewProbe, and playwright.synthetic.config.ts attaches the protection-
    # bypass header to every request when the secret is present.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(node scripts/resolve-preview-url.mjs)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run synthetic SSR monitor (preview)
        env:
          CI: 'true'
          SYNTHETIC_BASE_URL: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run synthetic:ssr

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-ssr-traces-preview
          path: test-results/
          retention-days: 7
