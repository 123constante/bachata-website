name: Typecheck (WallClock brand gate)

# Enforces the WallClock/Instant branded-type boundary (src/lib/time/wallClock.ts).
# The production build is esbuild (transpile-only), so NOTHING else in CI runs
# tsc -- a `new Date(wallClock)` would ship silently and reintroduce the +1h-in-BST
# / wrong-calendar-day bug class. This job is that missing gate.
#
# It is MESSAGE-SCOPED, not a tsc-error-count ratchet: it fails only on
# diagnostics whose flattened text names the brand under an assignment/call/cast
# code (see scripts/check-wallclock-brand.mjs). So the repo's ~168 pre-existing,
# brand-unrelated tsc errors do NOT gate it, and regenerating the large generated
# types.ts (which re-baselines every count-based signal) never false-fails it.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Supersede the previous run on the same PR branch (a re-push or a bot rebase);
# main pushes, schedules and deployment events never cancel each other.
concurrency:
  group: typecheck-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wallclock-brand:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      # Docs-only PRs skip the heavy steps below; the job still runs, so the
      # required check keeps its name and reports success. Fail-safe: any error
      # means docs_only=false (scripts/ci/docs-only.mjs).
      - name: Detect docs-only PR
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
        run: node scripts/ci/docs-only.mjs --merge "$MERGE_SHA"

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        if: steps.changes.outputs.docs_only != 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      # Closes the hole the brand gate structurally cannot see: a type-checker
      # sees nothing through `rpc('<name>' as never/any)`, so a laundered RPC call
      # must stay typed (route through a typed boundary) or a
      # new Date(row.start_time) ships silently on an `any` row. Snapshot-ratcheted
      # against scripts/rpc-typing-allowlist.json; get_calendar_events_v2 is absent
      # from the allowlist, so it stays zero-tolerance.
      - name: RPC typing guard
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:rpc-typing

      # `react-router typegen` generates the ./+types/* route modules; without
      # them tsc reports ~13 spurious TS2307s. Harmless to this message-scoped
      # gate, but the npm script runs typegen first anyway so local and CI agree.
      - name: WallClock/Instant brand gate
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:wallclock-brand
