name: Bot PR for cloud branches

# Copied from bachata-admin (same file); the PR numbers below are that repo's.
# Cloud sessions (claude.ai/code) push with the OWNER's credential (the GitHub proxy swaps it
# in), so a PR they open is owner-authored and the owner cannot approve it. This job opens the
# PR AS THE BOT (secret BOT_PR_TOKEN) when a claude/** or ccr-* branch is pushed and has no open PR,
# EXCEPT review reports (claude/review-*) and "nothing to change" markers (claude/done-*): those
# are read from the branch and only piled up as superseded PRs (tests/botPrSkip.test.ts).
# A branch whose PR already merged gets no new one: a push after that merge (a main-merge racing the
# owner's merge) only ever opened empty duplicates (#547, #553, #554). New work goes on a new branch.
# A PAT-opened PR fires the normal pull_request checks. The cloud session pushes and never
# opens the PR itself; it may edit the body afterwards with `gh api -X PATCH`.
# The body comes from scripts/pr-body-stub.mjs, built from the checkers' own labels: a
# `## Verified on real data` and a `## Phone QA` section, every line set to TO FILL.
# real-data-verified and phone-qa-section report that as PENDING (a notice), not red, and
# no merge path accepts it. Sessions REPLACE the TO FILL lines; a second section is red
# ("appears 2 times"). If the generator fails the PR still opens with a minimal body.

on:
  push:
    branches: ["claude/**", "ccr-*"]

concurrency:
  group: bot-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-pr:
    # Owner click 2026-11-04: no PR for claude/review-* or claude/done-* (dash included).
    if: ${{ !github.event.deleted && !startsWith(github.ref_name, 'claude/review-') && !startsWith(github.ref_name, 'claude/done-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The default branch's scripts/ ONLY: this step's env holds BOT_PR_TOKEN, so it must
      # never run code from the pushed branch. Read-only; no credential is kept.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Open the PR as the bot if the branch has none
        env:
          BOT_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          [ -n "${BOT_TOKEN:-}" ] || { echo "::error::secret BOT_PR_TOKEN is not set"; exit 1; }
          api() { curl -sS -H "Authorization: Bearer $BOT_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          # scripts/lib/bot-pr-adopt.mjs decides: "open" = no open PR and none merged (go on);
          # anything else = done. An OWNER-authored open PR is replaced by a bot copy there
          # (title/body/labels carried over). An API error fails the step loudly.
          ADOPT_OUT=adopt.out node scripts/lib/bot-pr-adopt.mjs
          [ -f adopt.out ] || { echo "::error::adopt.out missing; bot-pr-adopt wrote no outcome"; exit 1; }
          [ "$(cat adopt.out)" = "open" ] || exit 0
          # One generator, pinned to both checkers by tests/prBodyStub.test.ts. The PR must
          # always open: on any generator failure fall back to the old minimal body, warned.
          if ! body="$(node scripts/pr-body-stub.mjs)" || [ -z "$body" ]; then
            echo "::warning::scripts/pr-body-stub.mjs failed; opening the PR with the minimal fallback body (no Verified on real data / Phone QA sections)."
            body="$(printf '%s\n\n%s' "Opened by the bot for cloud branch \`$BRANCH\` so the owner can approve it. The session fills in this description." "Raised by .github/workflows/bot-pr.yml.")"
          fi
          BODY="$body" node -e '
            const title = (process.env.SUBJECT || process.env.BRANCH).split("\n")[0].slice(0, 250);
            const body = process.env.BODY;
            require("fs").writeFileSync("pr.json", JSON.stringify({ title, head: process.env.BRANCH, base: process.env.BASE, body }));
          '
          code="$(api -o resp.json -w '%{http_code}' -X POST "https://api.github.com/repos/$REPO/pulls" --data @pr.json)"
          if [ "$code" = "201" ]; then node -e 'const p=require("./resp.json");console.log("Opened #"+p.number+" as "+p.user.login)'
          elif [ "$code" = "422" ] && grep -q "No commits between" resp.json; then echo "No commits ahead of $BASE yet; the next push retries."
          elif [ "$code" = "422" ] && grep -q "A pull request already exists" resp.json; then
            # P155: a worker opened its own PR between the adopt check and this POST. A race, not a
            # failure: decide again (skips a bot PR, replaces an owner one; a failed replace still exits 1).
            echo "A PR for $BRANCH was opened meanwhile (race); re-checking it."
            ADOPT_OUT=adopt-race.out node scripts/lib/bot-pr-adopt.mjs
            if [ "$(cat adopt-race.out)" = "open" ]; then
              echo "::warning::GitHub reports a PR for $BRANCH but the list does not show it yet; the next push re-checks."
            fi
          else echo "::error::PR creation failed (HTTP $code)"; cat resp.json; exit 1; fi
