name: Unit & Contract Tests

# Vitest unit + contract suite. CLAUDE.md names these as the unit/contract
# gate, but they ran only by hand until now - a regression in the
# event_view_p5 snapshot_compat shape could ship unblocked.
#
# The 4 contract tests (eventViewCompat, publicEventPageLineup,
# occurrenceProgram, latestEvents) hit the live READ-ONLY DB via the anon key,
# so the same Supabase secrets db-contract-check.yml uses are required. The
# tests read process.env.VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY
# directly; pure-logic tests ignore them.
#
# On pull_request the London leg runs those live suites only when the diff
# touches a DB-facing path (scripts/ci-live-db-gate.mjs owns the rule and the
# path list, shared with db-contract-check.yml). Otherwise it runs
# `test:unit:offline` -- everything except *.contract.test.ts -- with the
# Supabase secrets withheld, so nothing in it can reach prod. Push to main
# always runs the full live set. Why: 2026-10-04, two full CI suites starting
# saturated prod (68 statement-timeout cancels, public site 500s ~3 min each).

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# These jobs hit the PRODUCTION database (Micro compute). A new push to a PR
# cancels that PR's superseded run so two runs never load prod at once; main,
# schedule and dispatch runs are never cancelled (their result is the record).
concurrency:
  group: unit-tests-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Calendar-time code must be independent of the machine timezone — the
      # "in -1 days" bug family was browser-local date math. Full suite runs
      # once (London); the other two zones re-run only the tz-sensitive files,
      # so the matrix doesn't triple npm ci or the live-DB contract tests.
      matrix:
        include:
          - tz: Europe/London
            scope: full
          - tz: America/New_York
            scope: tz-sensitive
          - tz: Australia/Sydney
            scope: tz-sensitive
    env:
      TZ: ${{ matrix.tz }}
    steps:
      # fetch-depth 2: on pull_request the checkout is the merge commit, and the
      # live-DB gate below diffs it against its first parent (the base tip).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # tests/integrityCouldNotRun.test.ts drives the guard's YAML phase for
      # real, so a runner without PyYAML reds two cases here as well. Same
      # reasoning as architecture-guard.yml: assert the dependency, do not
      # inherit it.
      - name: Ensure PyYAML (the integrity guard's YAML parser)
        run: |
          if python3 -c "import yaml" 2>/dev/null; then
            echo "PyYAML present"
          else
            echo "PyYAML missing -- installing; the guard's YAML phase depends on it"
            sudo apt-get update -qq
            sudo apt-get install -y python3-yaml
            python3 -c "import yaml"
          fi

      # Only the London (full) leg carries the live contract suites, so only it
      # asks. Non-PR events always come back live=true.
      - name: Decide whether the live contract suites run
        id: gate
        if: matrix.scope == 'full'
        run: node scripts/ci-live-db-gate.mjs

      - name: Run unit + contract suite
        env:
          # Replaced by an unroutable stub when the gate said live=false: the
          # offline set must not be ABLE to reach prod, not merely be expected
          # not to. A stub, not an empty value, because modules such as
          # src/integrations/supabase/client.ts call createClient() at import
          # time and throw on an empty URL (useEventGuestList.cache.test.ts,
          # measured); `.invalid` never resolves, so an accidental call fails
          # loudly instead of loading prod. Only an explicit 'false' swaps in
          # the stub; a missing gate output (tz legs, or a broken gate) keeps
          # today's behaviour exactly -- the real secrets, or empty where a PR
          # gets none (Dependabot).
          VITE_SUPABASE_URL: ${{ steps.gate.outputs.live == 'false' && 'https://ci-offline-no-db.invalid' || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.gate.outputs.live == 'false' && 'ci-offline-placeholder-not-a-real-key' || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          LIVE_DB: ${{ steps.gate.outputs.live }}
        # tz-sensitive scope: the calendar-time helpers and the calendar-day
        # transforms that construct/compare local Dates. Everything else is
        # timezone-inert and runs once under Europe/London.
        #
        # festivalGridDays is the deliberate exception -- it is timezone-INERT
        # and is listed here to PROVE that rather than assert it. The arithmetic
        # it is protecting is not in that file: it is wallClockDateRange in
        # src/lib/time/wallClock.ts, which works at UTC midnight and reads back
        # with toISOString. formatWallClockLocalIntl, which builds a machine-
        # LOCAL Date, sits in that SAME file a few exports down -- so the inert
        # version really is one careless edit from becoming the local one, and a
        # helper deciding a festival's day COLUMNS must not quietly start
        # depending on where CI runs.
        #
        # Not decoration, and MEASURED -- one row per mutant, per leg, so the
        # claim can be re-run rather than believed:
        #
        #   mutation of wallClockDateRange        London  NewYork  Sydney
        #   START bound Z dropped (time kept)     KILL    KILL     KILL
        #   END   bound Z dropped (time kept)     live    live     KILL
        #   toISOString -> toLocaleDateString     live    KILL     live
        #   both bounds -> Date.parse(key)        live    live     live
        #
        # Read off it: London alone already catches the START bound, because a
        # DST-spanning case exists. It catches NEITHER of the other two, so both
        # extra zones earn their place and neither is redundant with the other.
        #
        # The last row is an EQUIVALENT mutant, named so nobody reads its
        # silence as a hole: ES parses a date-ONLY string as UTC, so
        # `Date.parse('2026-11-05')` is identical to the Z form everywhere. The
        # matrix covers the machine-local class; it does not cover every edit to
        # those lines, and no arrangement of zones could.
        run: |
          if [ "${{ matrix.scope }}" = "full" ]; then
            # TWO passes, and the second is not optional. `test:unit` EXCLUDES
            # the *EdgeTtl.test.ts family, which runs in its own serial pass.
            # Without the second line those specs would silently stop running
            # under London, which is a coverage loss wearing a green tick.
            if [ "$LIVE_DB" = "false" ]; then
              echo "::notice title=Live contract suites SKIPPED::No DB-facing path changed in this PR; running test:unit:offline (no *.contract.test.ts, no Supabase secrets). See the gate step summary. Push to main runs them."
              npm run test:unit:offline
            else
              npm run test:unit
            fi
            npm run test:unit:timing
          else
            # --no-file-parallelism, matching the serial pass the London leg
            # runs. This list carries some of the *EdgeTtl specs but not all of
            # them -- sitemapEdgeTtl is not in it, so this leg is NOT a
            # substitute for the London leg's second pass.
            npx vitest run --no-file-parallelism tests/londonDate.test.ts tests/festivalGridDays.test.ts tests/pinnedDayKeyEdgeTtl.test.ts tests/festivalLoaderEdgeTtl.test.ts tests/seoLandingLoaderEdgeTtl.test.ts tests/homeLoaderEdgeTtl.test.ts src/modules/home-map/__tests__/mapListDerivations.test.ts src/modules/home-map/__tests__/todayLiveStatus.test.ts src/modules/home-map/__tests__/soonestLiveStatusChange.test.ts
          fi
