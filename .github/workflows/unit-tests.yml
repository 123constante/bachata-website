name: Unit & Contract Tests

# Vitest unit + contract suite (212 tests across 22 files). CLAUDE.md names
# these as the unit/contract gate, but they ran only by hand until now - a
# regression in the event_view_p5 snapshot_compat shape could ship unblocked.
#
# The 4 contract tests (eventViewCompat, publicEventPageLineup,
# occurrenceProgram, latestEvents) hit the live READ-ONLY DB via the anon key,
# so the same Supabase secrets db-contract-check.yml uses are required. The
# tests read process.env.VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY
# directly; pure-logic tests ignore them.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Calendar-time code must be independent of the machine timezone — the
      # "in -1 days" bug family was browser-local date math. Full suite runs
      # once (London); the other two zones re-run only the tz-sensitive files,
      # so the matrix doesn't triple npm ci or the live-DB contract tests.
      matrix:
        include:
          - tz: Europe/London
            scope: full
          - tz: America/New_York
            scope: tz-sensitive
          - tz: Australia/Sydney
            scope: tz-sensitive
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run unit + contract suite
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        # tz-sensitive scope: the calendar-time helpers and the calendar-day
        # transforms that construct/compare local Dates. Everything else is
        # timezone-inert and runs once under Europe/London.
        run: |
          if [ "${{ matrix.scope }}" = "full" ]; then
            # TWO passes, and the second is not optional. `test:unit` now
            # EXCLUDES the *EdgeTtl.test.ts family, which run in their own
            # serial pass because they assert real wall-clock bounds and lost
            # races against other vitest workers (reproduced at 24 workers on
            # 12 cores: 5 failures, all in that family). Without the second
            # line those specs would silently stop running under London, which
            # is a coverage loss wearing a green tick.
            npm run test:unit
            npm run test:unit:timing
          else
            npx vitest run tests/londonDate.test.ts tests/pinnedDayKeyEdgeTtl.test.ts tests/festivalLoaderEdgeTtl.test.ts tests/seoLandingLoaderEdgeTtl.test.ts tests/homeLoaderEdgeTtl.test.ts src/modules/home-map/__tests__/mapListDerivations.test.ts src/modules/home-map/__tests__/todayLiveStatus.test.ts src/modules/home-map/__tests__/soonestLiveStatusChange.test.ts
          fi
