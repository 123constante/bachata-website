name: Workflow Lint

# Guards against BOM-prefixed workflow files.
# A BOM in any workflow causes a YAML parse error before any step runs,
# making the problem impossible to detect from within that workflow.
# This separate file catches it on push/PR.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Supersede the previous run on the same PR branch (a re-push or a bot rebase);
# main pushes, schedules and deployment events never cancel each other.
concurrency:
  group: workflow-lint-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  masking-check:
    # Guards against the dead-Lighthouse failure mode: a check masked green by an
    # unjustified continue-on-error. Every continue-on-error must carry a
    # `soft-signal:` justification (see scripts/lint-workflow-masking.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Docs-only PRs skip the heavy steps below; the job still runs, so the
      # required check keeps its name and reports success. Fail-safe: any error
      # means docs_only=false (scripts/ci/docs-only.mjs).
      - name: Detect docs-only PR
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
        run: node scripts/ci/docs-only.mjs --merge "$MERGE_SHA"

      - name: Docs-only classifier self-test (always runs)
        run: node scripts/ci/docs-only.mjs --self-test

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.docs_only != 'true'
        with:
          node-version: 22

      - name: Lint workflows for unjustified continue-on-error
        if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/lint-workflow-masking.mjs

      # Which workflow files an automation-loop PR may change (claude/ or ccr-
      # branch, or authored by kiki-claude-bot): only names on
      # scripts/data/automation-workflow-allowlist.json (owner-curated; currently
      # empty, so no workflow file), and never the list itself. Owner PRs are not affected. Needs no npm ci (node
      # built-ins only). The git fetch is the same depth-2 merge-sha fetch the
      # docs-only step does. docs/handovers/workflow-allowlist-2.md.
      - name: Automation workflow allow-list
        if: github.event_name == 'pull_request' && steps.changes.outputs.docs_only != 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          node scripts/check-automation-workflow-allowlist.mjs --self-test
          node scripts/check-automation-workflow-allowlist.mjs --merge "$MERGE_SHA"

  notification-check:
    # Guards against the RC4 failure mode (edge-config-governance arc, P2):
    # prod-smoke, seo-check, og-image-check and synthetic-ssr-monitor went red
    # on schedule and stayed red for ~14h with no failure-notification step --
    # detection existed, but had no audience. Every workflow job reachable on
    # a schedule tick that probes production must carry a failure-notification
    # step (see scripts/lint-workflow-notification.mjs for the exact rule).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm 10 (bundled with Node 22) has rejected this repo's lockfile
      # before ("Missing: quickjs-wasi@2.2.0 from lock file"); every sibling
      # Node-22 npm-ci job carries this upgrade for that reason.
      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      # The lint imports the `yaml` package (a real parser, not a line
      # scanner -- that is P2's whole point), so the job must install
      # dependencies. Shipped without this step, the canary failed 5/20 on
      # "Cannot find module 'yaml'" and the job was red on main from the
      # first post-merge run (2026-08-22).
      - name: Install dependencies
        run: npm ci

      - name: Canary (self-test)
        run: node scripts/lint-workflow-notification.mjs --self-test

      - name: Lint workflows for unnotified scheduled prod probes
        run: node scripts/lint-workflow-notification.mjs

      # The preview jobs' `if:` must exclude exactly the no-preview branch
      # prefixes in scripts/vercel-ignore-build.sh (Vercel build budget).
      # Here, not in masking-check: it parses YAML, so it needs npm ci.
      - name: No-preview prefixes canary (self-test)
        run: node scripts/check-no-preview-prefixes.mjs --self-test

      - name: No-preview prefixes in sync with the Vercel ignore step
        run: node scripts/check-no-preview-prefixes.mjs
