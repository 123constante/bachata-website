name: GSC Health Check

# Daily Google Search Console health check for bachatacalendar.co.uk via the
# GSC API (service-account JWT auth, zero npm deps - same install-free pattern
# as og-image-check.yml). Verifies sitemap submissions are clean, key routes
# are indexable, and no sitemap URL 404s before Google finds it.
#
# Findings are WARN by default so the known backlog of 404s does not hold the
# job red; once those are fixed in generate-sitemap.mjs, set STRICT: '1' below
# to lock 404s / redirects / junk sitemaps as hard failures.
#
# Requires repo secret GSC_SERVICE_ACCOUNT_KEY (the service-account JSON).
# The SA only ever holds a readonly token here - cleanup (--delete-junk) is a
# deliberate local one-off and is never run in CI.

on:
  schedule:
    - cron: '30 6 * * *'   # daily, 30 min after db-contract-check / og-image guard
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Fail deliberately, to prove the failure notification still works'
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/check-gsc.mjs'
      - '.github/workflows/gsc-health-check.yml'

permissions:
  contents: read
  # Needed by the "Announce failure" step below -- see db-contract-check.yml's
  # comment above its own permissions block for why this can't stay implicit.
  issues: write

jobs:
  gsc-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # live-diff worst case ~9 min + spinup headroom

    steps:
      # A deliberate failure, on demand -- proves the notify step below end to
      # end. Mirrors db-contract-check.yml's test_notification input.
      - name: Deliberate failure (notification self-test)
        if: inputs.test_notification
        run: |
          echo "test_notification=true - failing on purpose to exercise the notifier."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # No npm install: check-gsc.mjs imports only node built-ins.
      - name: Run GSC health check
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          # STRICT: '1'   # uncomment once the sitemap 404 backlog is fixed
        run: node scripts/check-gsc.mjs --json gsc-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gsc-report
          path: gsc-report.json
          retention-days: 14

      # Failure-notification pattern copied from db-contract-check.yml (see its
      # "Announce failure" step for the full cancelled()/schedule reasoning).
      # Scoped to schedule + workflow_dispatch only -- push runs already have a
      # human in the loop via the pusher.
      - name: Announce failure
        if: (failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || (cancelled() && github.event_name == 'schedule')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'gsc-health-check';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'GSC Health Check failed.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'Open the run and read gsc-report.json in the uploaded artifact --',
              'sitemap submissions, indexability, or a sitemap URL 404.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'GSC Health Check red', body, labels: [LABEL],
              });
            }

      - name: Close failure issue when green again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'gsc-health-check';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }
