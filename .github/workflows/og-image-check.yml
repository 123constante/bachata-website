name: OG Image Guard

# Verifies social link previews still render: every sampled page must expose an
# og:image that resolves to a JPEG/PNG (never WebP) under 300KB, with dimensions.
#
# Two triggers:
#   - scheduled/dispatch: against PRODUCTION (post-deploy drift).
#   - pull_request: against the PR's Vercel PREVIEW (pre-merge coverage), reached
#     first-party via scripts/lib/previewProbe.mjs + the protection-bypass secret.
#     Catches an OG regression BEFORE it ships, not a day later on prod.

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Fail deliberately, to prove the failure notification still works'
        type: boolean
        default: false
  pull_request:
    branches: [main, master]

jobs:
  og-check:
    # Production run (schedule + manual). Skipped on PRs — the preview job covers those.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed by the "Announce failure" step below -- see
      # db-contract-check.yml's comment above its own permissions block.
      issues: write

    steps:
      # A deliberate failure, on demand -- proves the notify step below end to
      # end. Mirrors db-contract-check.yml's test_notification input.
      - name: Deliberate failure (notification self-test)
        if: inputs.test_notification
        run: |
          echo "test_notification=true - failing on purpose to exercise the notifier."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Canary first: prove the guard CAN fail before trusting its green -- a
      # self-test nobody runs proves nothing. Network-free, and deliberately
      # given no OG_CHECK_BASE: module scope demands the bypass secret when
      # pointed at a preview host, which the canary never needs.
      - name: Canary (self-test)
        run: npm run check:og:self-test

      - name: Run OG image guard
        env:
          OG_CHECK_BASE: https://www.bachatacalendar.co.uk
        run: npm run check:og

      # Failure-notification pattern copied from db-contract-check.yml (see its
      # "Announce failure" step for the full cancelled()/schedule reasoning).
      # Scoped to schedule + workflow_dispatch only -- PR runs already have a
      # human in the loop via the PR itself.
      - name: Announce failure
        if: (failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || (cancelled() && github.event_name == 'schedule')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'og-image-check';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'OG Image Guard (production) failed.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'Open the run and read which sampled page lost its og:image, or',
              'which format/size/dimension assertion failed.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'OG Image Guard red', body, labels: [LABEL],
              });
            }

      - name: Close failure issue when green again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'og-image-check';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }

  og-preview:
    # Pre-merge run against the PR's Vercel preview. check-og-images.mjs +
    # previewProbe.mjs use only Node builtins + fetch, so no `npm ci`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Canary first, same rationale as the production job; no OG_CHECK_BASE
      # on purpose.
      - name: Canary (self-test)
        run: npm run check:og:self-test

      - name: Resolve preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(node scripts/resolve-preview-url.mjs)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Run OG image guard (preview)
        env:
          OG_CHECK_BASE: ${{ steps.preview.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run check:og
