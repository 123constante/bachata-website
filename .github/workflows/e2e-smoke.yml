name: E2E Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master

# These jobs hit the PRODUCTION database (Micro compute). A new push to a PR
# cancels that PR's superseded run so two runs never load prod at once; main,
# schedule and dispatch runs are never cancelled (their result is the record).
concurrency:
  group: e2e-smoke-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Docs-only PRs skip the heavy steps below; the job still runs, so the
      # required check keeps its name and reports success. Fail-safe: any error
      # means docs_only=false (scripts/ci/docs-only.mjs).
      - name: Detect docs-only PR
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
        run: node scripts/ci/docs-only.mjs --merge "$MERGE_SHA"

      - name: Setup Node
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        if: steps.changes.outputs.docs_only != 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        if: steps.changes.outputs.docs_only != 'true'
        env:
          # E2E smoke tests do NOT use real Supabase — Playwright route mocks
          # intercept every **/auth/v1/** and **/rest/v1/** call. We only need
          # createClient(url, key) to not throw at module-init time.
          #
          # DON'T "fix" a red run by wiring in ${{ secrets.* }}. This workflow also
          # runs on `pull_request`, and Dependabot PRs are given NO repo secrets —
          # an empty URL makes createClient throw at module init, 500-ing every
          # route, so a secrets-based approach leaves every Dependabot PR
          # permanently red. (The old note here claimed the VITE_SUPABASE_URL secret
          # was itself malformed. That was true when written but was fixed on
          # 2026-05-13; it is no longer a reason for anything.)
          #
          # Route mocks only patch the BROWSER's network stack. Since the SSR
          # cutover they cannot reach a server loader's fetch — which is why
          # playwright.config.ts probes /auth (no server data fetch) instead of '/'.
          # See the comment on webServer.url there before changing any of this.
          #
          # The URL's projectRef must match the `projectRef` constant in
          # tests/e2e/*.spec.ts so the localStorage `sb-<ref>-auth-token` key
          # the mocks set is what supabase-js looks up.
          VITE_SUPABASE_URL: https://stsdtacfauprzrdebmzg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.e2e-test-placeholder-not-a-real-key
          # Organiser self-serve (Lever 2) is OFF in production; the dev server here
          # turns it on so the tests/e2e/organiser-*.spec.ts smoke specs can reach /account/o
          # (the old /account URLs redirect there; organiser-legacy-redirects.spec.ts).
          VITE_ENABLE_ORGANISER_SELF_SERVE: 'true'
        run: npm run test:e2e

      # The P3 walk specs skip themselves unless VITE_ENABLE_ORGANISER_P3 (and, for the door
      # scanner, _TICKETING) is 'true'. Review of #1208, F4: they sat in test:e2e above, which
      # sets neither, so all seven skipped and this gate ran none of them. They cannot simply
      # join the step above with the flags on: P3 takes over /account/o and the legacy
      # organiser-* smoke specs fail (measured 2026-10-31). So they run here, on their own dev
      # server (a new step starts a new one), with the flags on the STEP so both the server and
      # the test runner see them -- the specs read process.env directly.
      # scripts/check-p3-specs-not-skipped.mjs (architecture-guard.yml) fails if a flag goes
      # missing here or a P3 spec gains a skip the flags do not control.
      - name: Run E2E P3 walk specs (P3 flags on)
        # !cancelled(): a legacy failure above must not hide the P3 result on the same commit.
        if: ${{ !cancelled() && steps.changes.outputs.docs_only != 'true' }}
        env:
          VITE_SUPABASE_URL: https://stsdtacfauprzrdebmzg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.e2e-test-placeholder-not-a-real-key
          VITE_ENABLE_ORGANISER_SELF_SERVE: 'true'
          VITE_ENABLE_ORGANISER_P3: 'true'
          VITE_ENABLE_ORGANISER_TICKETING: 'true'
          # walk-p3-create-kinds (fix-1208 r4): turns its missing-mount skip into a failure.
          P3_GEOMETRY_REQUIRED: '1'
        run: npm run test:e2e:p3

      - name: Upload Playwright artifacts on failure
        if: ${{ (failure()) && steps.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
