name: E2E Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        env:
          # E2E smoke tests do NOT use real Supabase — Playwright route mocks
          # intercept every **/auth/v1/** and **/rest/v1/** call. We only need
          # createClient(url, key) to not throw at module-init time.
          #
          # DON'T "fix" a red run by wiring in ${{ secrets.* }}. This workflow also
          # runs on `pull_request`, and Dependabot PRs are given NO repo secrets —
          # an empty URL makes createClient throw at module init, 500-ing every
          # route, so a secrets-based approach leaves every Dependabot PR
          # permanently red. (The old note here claimed the VITE_SUPABASE_URL secret
          # was itself malformed. That was true when written but was fixed on
          # 2026-05-13; it is no longer a reason for anything.)
          #
          # Route mocks only patch the BROWSER's network stack. Since the SSR
          # cutover they cannot reach a server loader's fetch — which is why
          # playwright.config.ts probes /auth (no server data fetch) instead of '/'.
          # See the comment on webServer.url there before changing any of this.
          #
          # The URL's projectRef must match the `projectRef` constant in
          # tests/e2e/*.spec.ts so the localStorage `sb-<ref>-auth-token` key
          # the mocks set is what supabase-js looks up.
          VITE_SUPABASE_URL: https://stsdtacfauprzrdebmzg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.e2e-test-placeholder-not-a-real-key
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
