name: Ship it (owner comment arms auto-merge)

# The owner comments exactly `ship it` on a PR. If EVERY changed file is on the ALLOWLIST below, this
# workflow brings the branch up to date, arms GitHub auto-merge (squash) pinned to the checked head
# sha, and labels the PR `ship-it`. GitHub itself does the merge, only after the required checks of
# the `main` ruleset pass. Anything else is REFUSED (label `ship-it-refused` + a comment naming the
# first path that is not allowed, and auto-merge is switched off).
#
# ALLOWLIST (bash `case` patterns, case-insensitive, `*` crosses `/`). A file must match one of these
# AND none of the DENY prefixes. Renames are checked on both the new and the previous filename.
#   allow: docs/*   *.md   *.test.ts  *.test.tsx  */__tests__/*   *.css
#          public/*.png|jpg|jpeg|gif|webp|avif|ico|svg
#          src/modules/*/screens/*.tsx   src/modules/*/components/*.tsx
#   deny first (beats allow): .github/*  .claude/*  .githooks/*  scripts/*  supabase/*  *.sql
#          CLAUDE.md  AGENTS.md  (also nested)
#   everything else (api/*, src/** other than the two .tsx cases, package*.json, nested package.json,
#   middleware.ts, vercel*.json, *.ts server/lib/hook files, ...) = refused.
# ACCEPTED RISK (owner click 2026-11-21): .tsx under src/modules/*/screens/ and src/modules/*/components/
#   is allowed even for money screens (refund, payout, stripe, tickets): wording and UI edits there ship
#   on `ship it`. Logic in those files rides on the required checks only.
# A PR with 3000+ files (the API cap) is refused: the list cannot be proven.
#
# SAFETY:
#  - PUBLIC repo, comment body is untrusted. The comment job runs only for commenter 123constante AND
#    body == `ship it` (trimmed, lowercased; checked again in shell). No github.event.* is ever
#    interpolated into a shell command: everything goes through env.
#  - PR code is NEVER checked out, built or run. Files and head sha are read through the REST API.
#  - No third-party actions, so nothing to pin. Only `gh` (preinstalled).
#  - Refuses unless the `main` ruleset has a required_status_checks rule (auto-merge would merge at once).
#  - Disarm: pull_request_target `synchronize` re-runs the allowlist on every new head of a `ship-it`
#    PR and switches auto-merge off if the PR is now refused. (The definition comes from main.)
#  - Token: BOT_PR_TOKEN when present, else GITHUB_TOKEN. A branch update pushed with GITHUB_TOKEN does
#    not trigger the PR's checks (GitHub rule); pr-auto-rebase.yml uses BOT_PR_TOKEN for the same reason.
#    pr-auto-rebase.yml only rebases CONFLICTED PRs, so the update-labelled job here is not redundant.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ship:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == '123constante' &&
      contains(github.event.comment.body, 'ship it')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    concurrency:
      group: ship-it-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      BODY: ${{ github.event.comment.body }}
      COMMENTER: ${{ github.event.comment.user.login }}
    steps:
      - name: Check, update branch, arm auto-merge
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nocasematch

          body="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
          [ "$body" = "ship it" ] || { echo "not a ship-it comment"; exit 0; }
          [ "$COMMENTER" = "123constante" ] || { echo "not the owner"; exit 0; }

          # ---- allowlist (keep identical to the disarm job) ----
          allowed() {
            case "$1" in
              .github/*|.claude/*|.githooks/*|scripts/*|supabase/*|*.sql|CLAUDE.md|*/CLAUDE.md|AGENTS.md|*/AGENTS.md) return 1 ;;
              docs/*|*.md|*.test.ts|*.test.tsx|*/__tests__/*|*.css) return 0 ;;
              public/*.png|public/*.jpg|public/*.jpeg|public/*.gif|public/*.webp|public/*.avif|public/*.ico|public/*.svg) return 0 ;;
              src/modules/*/screens/*.tsx|src/modules/*/components/*.tsx) return 0 ;;
            esac
            return 1
          }
          # Sets HEAD_SHA; sets REFUSED_PATH and returns 1 if any file (or rename source) is not allowed.
          check_pr() {
            HEAD_SHA="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
            local files n f
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
            n="$(printf '%s\n' "$files" | grep -c . || true)"
            if [ "$n" -ge 3000 ]; then REFUSED_PATH="(3000+ files)"; return 1; fi
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if ! allowed "$f"; then REFUSED_PATH="$f"; return 1; fi
            done <<< "$files"
            return 0
          }
          say_once() { # $1 = full comment text, $2 = marker key; skips if the last marked comment has the same key
            local last
            last="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate --jq "[.[] | select(.body | contains(\"<!-- ship-it -->\"))] | last | .body // \"\"" | tail -n 1 || true)"
            case "$last" in *"$2"*) echo "same comment already posted"; return 0 ;; esac
            gh pr comment "$PR" --repo "$REPO" --body "<!-- ship-it -->$1 <!-- $2 -->"
          }
          disarm() {
            gh pr merge "$PR" --repo "$REPO" --disable-auto >/dev/null 2>&1 || true
            gh pr edit "$PR" --repo "$REPO" --remove-label ship-it >/dev/null 2>&1 || true
          }
          refuse() {
            local p; p="$(printf '%s' "$REFUSED_PATH" | tr -d '@`' | cut -c1-200)"
            gh label create ship-it-refused --repo "$REPO" --color B60205 --description "ship it refused: path not on the allowlist" 2>/dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label ship-it-refused >/dev/null
            disarm
            say_once "ship-it REFUSED: \`$p\` is not on the auto-merge allowlist. Merge this PR the normal way." "refused:$p"
          }
          fail() { say_once "ship-it FAILED: $1" "failed:$1"; exit 1; }

          state="$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + .base.ref + " " + (.head.repo.full_name // "")')"
          [ "$state" = "open main $REPO" ] || { say_once "ship-it: skipped, PR must be open, target main and come from this repo." "skipped:$state"; exit 0; }

          # Auto-merge with no required checks would merge at once: demand the ruleset rule.
          n_req="$(gh api "repos/$REPO/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length')"
          if [ "$n_req" = "0" ]; then say_once "ship-it: refused, main has no required_status_checks rule, auto-merge would merge immediately." "norule"; exit 0; fi

          if ! check_pr; then refuse; exit 0; fi

          # Behind main: update the branch, wait for the head sha to change, re-check the final sha.
          old_sha="$HEAD_SHA"
          merge_state="$(gh api "repos/$REPO/pulls/$PR" --jq .mergeable_state)"
          if [ "$merge_state" = "behind" ]; then
            gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" -f expected_head_sha="$old_sha" >/dev/null \
              || fail "update-branch error (conflict or race). Update the branch by hand."
            changed=0
            for _ in $(seq 1 12); do
              sleep 5
              cur="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
              if [ "$cur" != "$old_sha" ]; then changed=1; break; fi
            done
            [ "$changed" = "1" ] || fail "branch update did not land within 60s."
            if ! check_pr; then refuse; exit 0; fi
          fi

          if ! gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA"; then
            fail "could not arm auto-merge (see the run log)."
          fi
          gh label create ship-it --repo "$REPO" --color 0E8A16 --description "owner said ship it: auto-merge armed" 2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label ship-it >/dev/null
          gh pr edit "$PR" --repo "$REPO" --remove-label ship-it-refused >/dev/null 2>&1 || true
          gh pr comment "$PR" --repo "$REPO" --body "ship-it: auto-merge on, waits for required checks and up-to-date branch"

  disarm:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(toJSON(github.event.pull_request.labels.*.name), 'ship-it')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: ship-it-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Re-check the new head, disarm if no longer allowed
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nocasematch
          # No PR checkout: files come from the REST API. Allowlist identical to the ship job.
          allowed() {
            case "$1" in
              .github/*|.claude/*|.githooks/*|scripts/*|supabase/*|*.sql|CLAUDE.md|*/CLAUDE.md|AGENTS.md|*/AGENTS.md) return 1 ;;
              docs/*|*.md|*.test.ts|*.test.tsx|*/__tests__/*|*.css) return 0 ;;
              public/*.png|public/*.jpg|public/*.jpeg|public/*.gif|public/*.webp|public/*.avif|public/*.ico|public/*.svg) return 0 ;;
              src/modules/*/screens/*.tsx|src/modules/*/components/*.tsx) return 0 ;;
            esac
            return 1
          }
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          n="$(printf '%s\n' "$files" | grep -c . || true)"
          bad=""
          if [ "$n" -ge 3000 ]; then bad="(3000+ files)"; else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if ! allowed "$f"; then bad="$f"; break; fi
            done <<< "$files"
          fi
          [ -n "$bad" ] || { echo "new head still allowed"; exit 0; }
          gh pr merge "$PR" --repo "$REPO" --disable-auto || true
          gh pr edit "$PR" --repo "$REPO" --remove-label ship-it || true
          gh label create ship-it-refused --repo "$REPO" --color B60205 --description "ship it refused: path not on the allowlist" 2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label ship-it-refused || true
          p="$(printf '%s' "$bad" | tr -d '@`' | cut -c1-200)"
          last="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate --jq '[.[] | select(.body | contains("<!-- ship-it -->"))] | last | .body // ""' | tail -n 1 || true)"
          case "$last" in *"disarmed:$p"*) exit 0 ;; esac
          gh pr comment "$PR" --repo "$REPO" --body "<!-- ship-it -->ship-it DISARMED: a new push touches \`$p\`, which is not on the auto-merge allowlist. Auto-merge is off. <!-- disarmed:$p -->"

  update-labelled:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: ship-it-push
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Update open same-repo PRs that are labelled ship-it and have auto-merge armed
        shell: bash
        run: |
          set -uo pipefail
          for n in $(gh pr list --repo "$REPO" --state open --label ship-it --json number,autoMergeRequest,isCrossRepository \
                       --jq '.[] | select(.autoMergeRequest != null and (.isCrossRepository | not)) | .number'); do
            gh api -X PUT "repos/$REPO/pulls/$n/update-branch" >/dev/null 2>&1 \
              && echo "updated #$n" || echo "update-branch #$n skipped (up to date or conflict)"
          done
          exit 0
