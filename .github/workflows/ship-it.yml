name: Ship it (owner comment arms auto-merge)

# The owner comments exactly `ship it` on a PR. If the PR touches no risky path (list below) this
# workflow labels it `ship-it`, brings the branch up to date and arms GitHub auto-merge (squash).
# GitHub itself does the merge, and only after the required checks of the `main` ruleset pass.
# A PR touching a risky path is REFUSED: label `ship-it-refused` plus a comment naming the path.
#
# SAFETY:
#  - PUBLIC repo, comment body is untrusted. The job runs only when the commenter is
#    123constante AND the trimmed, lowercased body is exactly `ship it` AND it is a PR comment.
#    No github.event.* value is ever interpolated into a shell command: everything goes via env.
#  - PR code is NEVER checked out, built or run. Files and head sha are read through the REST API.
#  - No third-party actions, so nothing to pin. Only `gh` (preinstalled on the runner).
#  - Auto-merge is pinned to the head sha that was checked (--match-head-commit): a push that lands
#    after the check voids the arming.
#  - Token: BOT_PR_TOKEN when present, else GITHUB_TOKEN. A branch update pushed with GITHUB_TOKEN
#    does not trigger the PR's checks (GitHub rule), so the required checks would never run on the
#    new head; pr-auto-rebase.yml uses BOT_PR_TOKEN for the same reason.
#
# RISKY PATHS (refused). Globs are bash `case` patterns on the repo-relative path, case-insensitive;
# `*` matches across `/`. Keep this list and the RISKY_GLOBS / MONEY_WORDS env below in sync.
#   Governance / automation:
#     scripts/*   .github/*   .claude/*   .githooks/*   CLAUDE.md   .integrity-guard.sha256
#     (.github/* includes .github/automation/guard-paths.json, the guard and queue workflows)
#   Server / DB:
#     supabase/functions/*   supabase/migrations/*   *.sql   api/*   middleware.ts
#     vercel.json   vercel-firewall.json   package.json   package-lock.json
#   Money logic: any path containing  refund | payout | stripe | webhook | ticket_orders |
#     ticket-orders | ticketorders | pricing   (case-insensitive),
#     EXCEPT these, which stay allowed (owner click: wording-only edits to ticket money UI copy):
#       - .tsx files under src/modules/*/screens/ or src/modules/*/components/ (any depth below
#         the module), i.e. screens and components
#       - docs/*  and test files (*.test.ts, *.test.tsx, __tests__/*)
#     .ts server/lib/hook/model files stay refused (e.g. r4RefundModel.ts, refundData.ts),
#     and so does any .tsx outside screens/ and components/.
#   Guard / queue files: .github/* (covers the queue-*.yml and *-guard.yml workflows and
#     guard-paths.json), scripts/* (covers scripts/lib/guard-paths.mjs, merge-tier.mjs, ...).
#   A PR with 3000+ files (the API cap) is refused: the list cannot be proven.

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  ship:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == '123constante' &&
      contains(github.event.comment.body, 'ship it')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ship-it-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number }}
      BODY: ${{ github.event.comment.body }}
      COMMENTER: ${{ github.event.comment.user.login }}
    steps:
      - name: Check, label, update branch, arm auto-merge
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nocasematch

          # Exact-body check again, in shell, trimmed and lowercased (the `if` above is only a prefilter).
          body="$(printf '%s' "$BODY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
          [ "$body" = "ship it" ] || { echo "not a ship-it comment"; exit 0; }
          [ "$COMMENTER" = "123constante" ] || { echo "not the owner"; exit 0; }

          # --- risky-path rules (documented in the header) ---
          is_money_exempt() {
            case "$1" in
              docs/*|*.test.ts|*.test.tsx|*/__tests__/*) return 0 ;;
              src/modules/*/screens/*.tsx|src/modules/*/components/*.tsx) return 0 ;;
            esac
            return 1
          }
          risky_reason() {
            local f="$1"
            case "$f" in
              scripts/*|.github/*|.claude/*|.githooks/*|CLAUDE.md|.integrity-guard.sha256)
                echo "governance/automation/guard path"; return 0 ;;
              supabase/functions/*) echo "edge function"; return 0 ;;
              supabase/migrations/*|*.sql) echo "database migration/SQL"; return 0 ;;
              api/*|middleware.ts|vercel.json|vercel-firewall.json|package.json|package-lock.json)
                echo "server/deploy config"; return 0 ;;
            esac
            case "$f" in
              *refund*|*payout*|*stripe*|*webhook*|*ticket_orders*|*ticket-orders*|*ticketorders*|*pricing*)
                if ! is_money_exempt "$f"; then echo "money logic"; return 0; fi ;;
            esac
            return 1
          }

          # Reads head sha + files into HEAD_SHA, FILES; sets REFUSED_PATH/REFUSED_WHY, returns 1 if refused.
          check_pr() {
            HEAD_SHA="$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)"
            FILES="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
            local n; n="$(printf '%s\n' "$FILES" | grep -c . || true)"
            if [ "$n" -ge 3000 ]; then REFUSED_PATH="(3000+ files)"; REFUSED_WHY="file list at the API cap"; return 1; fi
            local f why
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if why="$(risky_reason "$f")"; then REFUSED_PATH="$f"; REFUSED_WHY="$why"; return 1; fi
            done <<< "$FILES"
            return 0
          }

          refuse() {
            gh label create ship-it-refused --repo "$REPO" --color B60205 --description "ship it refused: risky path" 2>/dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label ship-it-refused >/dev/null
            gh pr comment "$PR" --repo "$REPO" --body "ship-it REFUSED: \`$REFUSED_PATH\` matches a risky path ($REFUSED_WHY). Merge this PR the normal way."
          }

          state="$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + .base.ref + " " + (.head.repo.full_name // "")')"
          [ "$state" = "open main $REPO" ] || { gh pr comment "$PR" --repo "$REPO" --body "ship-it: skipped, PR must be open, target main and come from this repo (got: $state)."; exit 0; }

          if ! check_pr; then refuse; exit 0; fi

          # Update the branch if behind, then re-check the new head (its files may differ).
          merge_state="$(gh api "repos/$REPO/pulls/$PR" --jq .mergeable_state)"
          if [ "$merge_state" = "behind" ] || [ "$merge_state" = "unknown" ]; then
            gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" -f expected_head_sha="$HEAD_SHA" >/dev/null || echo "update-branch failed (conflict or race); continuing"
            sleep 5
            if ! check_pr; then refuse; exit 0; fi
          fi

          gh label create ship-it --repo "$REPO" --color 0E8A16 --description "owner said ship it: auto-merge armed" 2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label ship-it >/dev/null
          gh pr edit "$PR" --repo "$REPO" --remove-label ship-it-refused >/dev/null 2>&1 || true
          gh pr merge "$PR" --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA"
          gh pr comment "$PR" --repo "$REPO" --body "ship-it: auto-merge on, waits for required checks and up-to-date branch"

  update-labelled:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ship-it-push
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ secrets.BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Update every open PR labelled ship-it
        shell: bash
        run: |
          set -uo pipefail
          for n in $(gh pr list --repo "$REPO" --state open --label ship-it --json number --jq '.[].number'); do
            gh api -X PUT "repos/$REPO/pulls/$n/update-branch" >/dev/null 2>&1 \
              && echo "updated #$n" || echo "update-branch #$n skipped (up to date or conflict)"
          done
          exit 0
