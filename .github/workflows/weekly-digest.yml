name: Weekly Digest

# A weekly search + traffic + content-health briefing for the operator,
# delivered as a GitHub Issue (GitHub emails the repo owner on new issues - a
# push channel needing no extra secret). Reuses data the daily checks already
# compute, so this is pure delivery:
#   - GSC analytics, 28d with week-over-week delta + top queries + sitemap
#     health (check-gsc.mjs --digest, readonly service-account token)
#   - live recurring series running out of dates
#     (check-series-occurrence-horizon.mjs --markdown)
#   - rework share, trailing 100 commits, both repos (rework-share.mjs --markdown;
#     frozen recipe owned by admin docs/workflow-overhaul-adoption-checkpoint.md)
#
# To switch delivery to WhatsApp/Telegram later, replace the final step.

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Fail deliberately, to prove the failure notification still works'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # A deliberate failure, on demand -- proves the notify step below end to
      # end. Mirrors db-contract-check.yml's test_notification input.
      - name: Deliberate failure (notification self-test)
        if: inputs.test_notification
        run: |
          echo "test_notification=true - failing on purpose to exercise the notifier."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The rework-share step counts the trailing 100 commit SUBJECTS. The default
          # single-commit checkout would silently make that number 1/1, so the depth is
          # part of the metric, not a performance knob.
          fetch-depth: 150

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build GSC section (analytics delta + top queries + sitemap)
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: node scripts/check-gsc.mjs --digest --digest-out digest.md

      - name: Append live-series section
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          {
            echo ""
            node scripts/check-series-occurrence-horizon.mjs --markdown
          } >> digest.md

      - name: Append rework-share section
        # soft-signal: the digest is a report channel, not a gate - no correctness claim
        # rides on this step, and the share is already measured twice over (the script's
        # own fail-soft line, plus the `|| echo` at the call site). This is belt and
        # braces for a process-level failure (module-load error, OOM, ENOENT after a
        # rename): it must degrade this SECTION, not kill the digest before the issue
        # opens.
        continue-on-error: true
        env:
          # Fine-grained PAT, admin repo only, Contents:read. Absent (e.g. on a fork or a
          # branch copy) the section still renders and the admin row reads "unavailable" -
          # the digest is the one push channel Ricky reads and must never die for a token.
          ADMIN_READ_TOKEN: ${{ secrets.ADMIN_READ_TOKEN }}
        run: |
          {
            echo ""
            node scripts/rework-share.mjs --markdown || echo "_rework share unavailable this week_"
          } >> digest.md

      - name: Append footer
        # Last on purpose: every content section lands above the sign-off.
        run: |
          {
            echo ""
            echo "---"
            echo "_Auto-generated weekly. Close this issue when read._"
          } >> digest.md

      - name: Open digest issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Weekly digest - $(date -u +%Y-%m-%d)"
          gh issue create --title "$TITLE" --body-file digest.md --label digest \
            || gh issue create --title "$TITLE" --body-file digest.md

      # Failure-notification pattern copied from db-contract-check.yml (see its
      # "Announce failure" step for the full cancelled()/schedule reasoning).
      # A distinct mechanism and label from "Open digest issue" above: that
      # step is the digest's DELIVERY, and only runs if every prior step
      # succeeded; this one fires when the job failed to PRODUCE a digest at
      # all, which is otherwise invisible -- no digest issue appears, and
      # nothing says why. Scoped to schedule + workflow_dispatch only.
      - name: Announce failure
        if: (failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || (cancelled() && github.event_name == 'schedule')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'weekly-digest';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Weekly Digest failed to build -- no digest issue was opened this week.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'Open the run and read which section failed: GSC analytics, the',
              'live-series check, or the checkout/install steps before them.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'Weekly Digest build red', body, labels: [LABEL],
              });
            }

      - name: Close failure issue when green again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'weekly-digest';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }
