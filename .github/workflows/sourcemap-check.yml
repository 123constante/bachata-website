name: Sourcemap Resolve Check

# Drift monitor: checks recent production Sentry events resolve to ORIGINAL source
# (.ts/.tsx) rather than minified /assets/*.js chunks. A regression (missing Vercel
# Sentry credential, or a release-name mismatch in @sentry/vite-plugin) silently
# makes every prod error undebuggable, so we fail CI on it. NOTE: this inspects the
# most-recent unresolved issues, not a specific release — the daily cron is its real
# value (a just-deployed release usually has no errors yet to inspect).
#
# Requires repo secret SENTRY_READ_TOKEN (personal/project token, scopes
# project:read + event:read). SOURCEMAP_CHECK_REQUIRE_TOKEN=1 makes a missing/renamed
# secret FAIL here (these triggers only run on the trusted base repo) rather than
# silently skip to green.
#
# Triggers mirror prod-smoke.yml: a successful PRODUCTION Vercel deploy, plus a
# daily safety net. Preview deploys are excluded deliberately -- this job never
# sets SITE_URL, so check-sourcemap-debugids.mjs falls back to live production.
# A preview-triggered run therefore graded PROD state and attached the result to
# the PR's head SHA, i.e. a red check on a PR that had nothing to do with it.
# state == 'success' alone does NOT filter previews: a successful preview deploy
# reports exactly the same state.

on:
  deployment_status:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Fail deliberately, to prove the failure notification still works'
        type: boolean
        default: false

permissions:
  contents: read
  # Needed by the "Announce failure" step below -- see db-contract-check.yml's
  # comment above its own permissions block for why this can't stay implicit.
  issues: write

jobs:
  check:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A deliberate failure, on demand -- proves the notify step below end to
      # end. Mirrors db-contract-check.yml's test_notification input.
      - name: Deliberate failure (notification self-test)
        if: inputs.test_notification
        run: |
          echo "test_notification=true - failing on purpose to exercise the notifier."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The guard proves it can FAIL before it is trusted to say anything passed.
      # Needs no secrets and no network -- it drives the pure classify() over every
      # verdict in both directions. Runs first so a broken guard reds here rather
      # than reporting a green it did not earn (rule R4, check #63).
      - name: Prove the debug-id guard can fail (canary)
        run: node scripts/check-sourcemap-debugids.mjs --self-test

      # Primary gate: deterministic per-deploy check — reads the LIVE bundle's
      # debug-ids and asks Sentry whether a matching sourcemap was uploaded. Needs
      # no error traffic, so it validates the just-shipped release directly.
      #
      # Exit 2 = could not measure (no token, site unreachable, no chunk body
      # readable). It is NOT a pass: a non-zero exit fails the step, which is the
      # point -- this guard used to exit 0 on exactly the state it guards against.
      - name: Check deployed debug-ids have uploaded sourcemaps
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SOURCEMAP_CHECK_REQUIRE_TOKEN: '1'
        run: node scripts/check-sourcemap-debugids.mjs

      # Secondary: event-based drift monitor (catches resolution failures seen in
      # real prod errors). Informational — does not fail the job on its own.
      - name: Check recent production errors resolve (drift monitor)
        # soft-signal: informational drift monitor over live Sentry data. The
        # primary invariant (debug-ids resolve) is guarded by the fail-fast step
        # above; this secondary step only annotates and must not fail the job on
        # transient Sentry/event noise.
        continue-on-error: true
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SOURCEMAP_CHECK_REQUIRE_TOKEN: '1'
        run: node scripts/check-sourcemaps-resolve.mjs

      # Failure-notification pattern copied from db-contract-check.yml (see its
      # "Announce failure" step for the full cancelled()/schedule reasoning).
      # Scoped to schedule + workflow_dispatch + deployment_status: unlike
      # db-contract-check.yml (which has no deployment_status trigger), this
      # job's deployment_status run is the post-deploy check itself -- an
      # automated Vercel-triggered run with no human watching this specific
      # GitHub check, the same unattended-tick class schedule is. cancelled()
      # is NOT extended to deployment_status: a deploy-triggered run this
      # short (5 min timeout) cancelling mid-flight is unusual enough to be
      # worth a human's attention same as a schedule cancellation is.
      - name: Announce failure
        if: (failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'deployment_status')) || (cancelled() && github.event_name == 'schedule')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'sourcemap-check';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Sourcemap Resolve Check failed.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'Open the run and read which step failed -- the debug-id/sourcemap',
              'match, or the drift monitor (informational only, does not fail here).',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'Sourcemap Resolve Check red', body, labels: [LABEL],
              });
            }

      - name: Close failure issue when green again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'deployment_status')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'sourcemap-check';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }
