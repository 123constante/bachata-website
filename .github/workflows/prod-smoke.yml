name: Prod Smoke

# Headless Playwright smoke against LIVE production (scripts/launch-critical-smoke.mjs).
# Asserts: the homepage map paints Leaflet markers/clusters, an event page renders
# (sourced from the live sitemap), key routes mount with no console/page errors,
# and Supabase returns no 4xx/5xx. Runs at a mobile viewport (~95% of users) with a
# 'bot' user-agent so the server-side view-tracking RPCs skip these runs - no
# analytics pollution.
#
# Triggers:
#   deployment_status - validate immediately after a successful PRODUCTION Vercel
#                       deploy. Preview deploys are excluded: this job smokes the
#                       live prod URL, so running it for a PR's preview produced a
#                       red check that had nothing to do with the PR.
#   schedule          - synthetic-uptime safety net (catches drift with no deploy,
#                       and covers the case where Vercel's deployment_status
#                       integration is not wired to GitHub)
#   workflow_dispatch - on demand

on:
  deployment_status:
  schedule:
    # Daily, not 6-hourly: each run is a 13-navigation Playwright suite at
    # networkidle (several hundred to >1000 requests) and Vercel meters every
    # edge request. The trade is real and accepted -- worst-case time to detect
    # a deploy-less prod outage goes from ~6h to ~24h -- and the
    # deployment_status trigger, which is where most of the value is, is
    # unchanged. 03:23, deliberately off the hour: GitHub drops congested
    # top-of-hour ticks silently (no run record), and with one attempt a day
    # instead of four there is no second chance to absorb that.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Fail deliberately, to prove the failure notification still works'
        type: boolean
        default: false

permissions:
  contents: read
  # Needed by the "Announce failure" step below -- see db-contract-check.yml's
  # comment above its own permissions block for why this can't stay implicit.
  issues: write

jobs:
  smoke:
    # Ignore pending/error deployment_status noise, and PREVIEW deploys entirely.
    # A successful *preview* deploy also reports state == 'success', so state alone
    # let every PR trigger a run that then smoked LIVE PRODUCTION - a red check on
    # the PR reporting prod health rather than the PR's. Vercel sets environment to
    # exactly 'Preview' or 'Production' on the deployment_status object.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # A deliberate failure, on demand -- proves the notify step below end to
      # end without waiting for a genuinely bad night. Mirrors
      # db-contract-check.yml's test_notification input.
      - name: Deliberate failure (notification self-test)
        if: inputs.test_notification
        run: |
          echo "test_notification=true - failing on purpose to exercise the notifier."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke live production
        env:
          SMOKE_BASE_URL: https://www.bachatacalendar.co.uk
        run: |
          set -o pipefail
          node scripts/launch-critical-smoke.mjs | tee smoke-report.json

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prod-smoke-report
          path: smoke-report.json
          retention-days: 14

      # Failure-notification pattern copied from db-contract-check.yml (see its
      # "Announce failure" step for the full cancelled()/schedule reasoning).
      # Scoped to schedule + workflow_dispatch + deployment_status: unlike
      # db-contract-check.yml (no deployment_status trigger), this job's
      # deployment_status run IS the post-deploy health check, an automated
      # Vercel-triggered run with no human watching this specific GitHub check
      # -- the same unattended-tick class schedule is. Not extended to PR:
      # this workflow has no pull_request trigger at all.
      - name: Announce failure
        if: (failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'deployment_status')) || (cancelled() && github.event_name == 'schedule')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'prod-smoke';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Prod Smoke failed.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'Open the run and read which step failed. The suite navigates the',
              'live homepage map, an event page, and key routes under a mobile',
              'viewport -- see scripts/launch-critical-smoke.mjs.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title: 'prod-smoke red', body, labels: [LABEL],
              });
            }

      - name: Close failure issue when green again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'deployment_status')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'prod-smoke';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
            }
