# PROPOSAL (brief merge-tiers). Cloud workers cannot write .github/workflows/; the orchestrator
# copies this file to .github/workflows/auto-merge-on-open.yml after the owner's review.
#
# Arms GitHub auto-merge on a bot PR of merge tier B or C (scripts/lib/merge-tier.mjs classifyTier).
# GitHub then waits for the required checks of ruleset "main checks"; nothing here merges directly.
#   - only when repo variable MERGE_TIERS_ENABLED == 'true' (default off: the job is skipped)
#   - only for PRs authored by kiki-claude-bot, never from a fork
#   - tier B: also needs a non-empty '## Self-review' section in the PR body (hasSelfReview)
#   - not armed (tier A, or B without a self-review) while auto-merge is on = it is DISABLED, so a
#     later push that adds a guard path cannot ride an earlier arming
#   - never arms a revert PR (head claude/revert-*): revert-on-red.yml's PRs wait for a human
#   - tier A: does nothing (owner Approve as today)
#   - pull_request_target (branches: [main]) and a checkout of ref main: the workflow DEFINITION
#     and the classifier always come from main, never the PR's own code (a PR cannot rewrite
#     merge-tier.mjs, or this file, to downgrade itself); PR head code is never checked out
#   - --match-head-commit: a push after classification voids the arming (synchronize re-runs it)
# Token: BOT_PR_TOKEN (as bot-automerge.yml). A GITHUB_TOKEN merge would not trigger the push
# workflows on main (owner-approval audit, revert-on-red), so it must NOT be used here.
name: Auto-merge on open (merge tiers)

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read # the pause switch reader (docs/automation-pause.md); nothing else

concurrency:
  group: auto-merge-on-open-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    if: >-
      vars.MERGE_TIERS_ENABLED == 'true' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'kiki-claude-bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'claude/revert-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: List the PR's files
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100 });
            // 3000 is the API cap: a capped list cannot prove the tier, so write nothing (-> tier A).
            if (files.length >= 3000) { core.warning('file list at the API cap: tier A'); return; }
            require('fs').writeFileSync('pr-files.json', JSON.stringify(files.map((f) => ({ filename: f.filename, previous_filename: f.previous_filename, patch: f.patch, changes: f.changes }))));
      - name: Classify the tier
        id: tier
        run: >-
          node --input-type=module -e "import { readFileSync, existsSync, appendFileSync } from 'node:fs';
          import { classifyTier } from './scripts/lib/merge-tier.mjs';
          const files = existsSync('pr-files.json') ? JSON.parse(readFileSync('pr-files.json', 'utf8')) : [];
          const t = classifyTier(files); console.log('merge tier: ' + t);
          appendFileSync(process.env.GITHUB_OUTPUT, 'tier=' + t + String.fromCharCode(10));"
      # Tier B needs the worker's self-review recorded in the PR body (non-empty '## Self-review').
      - name: Tier B self-review recorded
        id: review
        env:
          BODY: ${{ github.event.pull_request.body }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: >-
          node --input-type=module -e "import { appendFileSync } from 'node:fs';
          import { hasSelfReview } from './scripts/lib/merge-tier.mjs';
          const ok = process.env.TIER !== 'B' || hasSelfReview(process.env.BODY);
          if (!ok) console.log('tier B without a non-empty ## Self-review section: not armed');
          appendFileSync(process.env.GITHUB_OUTPUT, 'ok=' + ok + String.fromCharCode(10));"
      # PAUSE SWITCH (docs/automation-pause.md): exit 3 = paused. continue-on-error so a pause is
      # not a red run; fail closed: only paused == 'false' (positively read) lets a write step run.
      - name: Read the automation pause switch
        id: pause
        # soft-signal: exit 3 = PAUSED is the measured outcome, written to outputs; only paused == 'false' acts (fail closed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation-pause.mjs
      - name: Arm auto-merge (tier B or C only)
        if: (steps.tier.outputs.tier == 'B' || steps.tier.outputs.tier == 'C') && steps.review.outputs.ok == 'true' && steps.pause.outputs.paused == 'false'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD"
      - name: Not armed -- disable any earlier arming, leave it for the owner
        if: ${{ always() && !((steps.tier.outputs.tier == 'B' || steps.tier.outputs.tier == 'C') && steps.review.outputs.ok == 'true' && steps.pause.outputs.paused == 'false') }}
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          TIER: ${{ steps.tier.outputs.tier }}
        # Unconditional: the event payload's auto_merge can be stale (armed after this event fired),
        # so always disable. If the disable exits non-zero, re-read the PR: only a positively read
        # "not armed" is harmless; still armed, or an unreadable state, fails the job (fail closed).
        run: |
          echo "merge tier $TIER - not armed (owner Approve, or a tier-B self-review, is needed)"
          if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --disable-auto; then
            STILL=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null' || echo unknown)
            if [ "$STILL" != "false" ]; then echo "::error::disable-auto failed and auto-merge is $STILL (true/unknown) on #$PR"; exit 1; fi
            echo "disable-auto: nothing was armed"
          fi
