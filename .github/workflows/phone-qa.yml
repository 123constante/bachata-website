name: Phone QA

# Phone-size browser checks on every PR that can move pixels on a phone. Until
# this existed NO phone-size check ran on any PR: the owner found the organiser
# Save bar hidden behind the BottomNav and a low-contrast heading on a phone
# (fixed in #719), and the spec written for it (tests/e2e/organiser-edit-save-bar
# .real-supabase.spec.ts) needs a real Supabase key, so it skips itself in CI.
#
# playwright.phone.config.ts, tests/e2e-phone/: at 390x844 and 360x640 (touch,
# isMobile) --
#   - the organiser Save bar: inside the screen, above the BottomNav, Save
#     hit-testable, pinned at scroll top and bottom, on a direct load AND after
#     an in-app router navigation;
#   - axe-core colour contrast on the public routes and the organiser page, as a
#     shrink-only ratchet (tests/e2e-phone/axe-contrast-baseline.json);
#   - overlap: no horizontal page scroll, no fixed bottom layer covering
#     another's controls.
#
# NO SECRETS, so Dependabot and fork PRs run it too. The SSR routes render from
# a fake Supabase: tests/e2e-phone/fakeSupabasePreload.mjs answers the dev
# server's Node-side fetches and page.route() the browser's, both from
# tests/e2e-phone/fakeSupabase.mjs. Nothing reaches any Supabase project.
#
# Runs on EVERY pull request (owner 2026-11-12, e2e audit item 4). It used to be
# path-filtered to UI files, so a PR outside those paths got no phone check and,
# because a path-filtered workflow never reports, the check could not be made
# required. Now it always reports. Docs-only PRs pay the shard time; that is the
# price of a check that means "the phone suite ran". Whether to make it a
# REQUIRED status check is still the owner's call.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-qa-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Three parallel shards (owner 2026-11-06): one job hit the 25-minute limit on
  # busy runs. Shards split by file, not duration: on #1461 shard 3 took 14m00s,
  # shard 1 9m17s, shard 2 7m43s, so a 15-minute cap left no headroom and the one
  # auto-rerun has the same cap. A shard cancelled at its 20-minute limit is re-run once by
  # phone-qa-rerun.yml; a real test failure is never re-run and stays red.
  phone-qa:
    runs-on: ubuntu-latest
    # Browsers and their system libraries come baked into the Playwright image, so no
    # step here runs apt: `playwright install --with-deps` did, and runner apt DNS
    # failures ("Temporary failure resolving azure.archive.ubuntu.com") redded this
    # job with no code change (PR #1542, 2026-11-11). The tag MUST equal the
    # @playwright/test version in package-lock.json: the image's browsers are built
    # for that version only. Node still comes from setup-node (22), not the image.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The container's HOME is /github/home, a runner mount whose parent is writable by
      # another user; @swc/core 1.16 refuses a native-addon cache under it ("cache root has
      # a parent writable by another user") and vite.config.ts fails to load. /root is
      # root-owned 0700, so the cache is accepted there.
      XDG_CACHE_HOME: /root/.cache
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The workspace is owned by the runner user and the container runs as root, so
      # without this every later git command fails with "dubious ownership".
      - name: Trust the workspace for git (container job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # A failure prints each assertion with its measured px; reproduce locally for
      # screenshots and traces (test-results/phone-qa/). The auto-walk pictures below
      # are the one upload here; check-workflow-artifact-policy.mjs records the count.
      - name: Run the phone suite (390x844 and 360x640)
        run: npx playwright test --config playwright.phone.config.ts --shard=${{ matrix.shard }}/3

      # Auto-walk pictures for the review pack (scripts/auto-walk-manifest.mjs).
      # Runs even when the suite is red, so a failing PR still gets its pictures.
      # Reports only: NOT covered lines never fail the job. Shard 1 only: the pictures
      # do not depend on the shard, and three uploads named auto-walk would collide.
      - name: Auto-walk pictures (390x844)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.shard == 1 }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PR_FILES="$(git diff --name-only "$BASE_SHA"...HEAD)" node scripts/auto-walk-manifest.mjs --run
          node scripts/auto-walk-manifest.mjs --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload auto-walk pictures
        if: ${{ !cancelled() && github.event_name == 'pull_request' && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: auto-walk
          path: test-results/auto-walk
          if-no-files-found: error
          retention-days: 14

  # The PRODUCTION build, which the job above never sees: it drives the dev
  # server, which serves every module unbundled, so a bug that exists only in the
  # built chunk graph passes it. PR #747's Vercel preview left /parties on
  # skeletons and the event schedule on "Loading..." (`TypeError: le is not a
  # function`: a vendor-ui <-> vendor-ui-modal import cycle) with every job here
  # green. playwright.build.config.ts serves `npm run build` the way Vercel does,
  # with the same fake Supabase baked in at build time; tests/e2e-build/ fails on
  # an uncaught page error, a page still loading after 8 s, or route content
  # that never appears.
  # Path-filtered with the phone suite. The cycle class is not left to this
  # job: vendorChunkCycleGuard (vite.chunks.ts) fails EVERY client build on it,
  # perf-budget.yml's on every PR and Vercel's deploy included.
  build-smoke:
    runs-on: ubuntu-latest
    # Browsers and their system libraries come baked into the Playwright image, so no
    # step here runs apt: `playwright install --with-deps` did, and runner apt DNS
    # failures ("Temporary failure resolving azure.archive.ubuntu.com") redded this
    # job with no code change (PR #1542, 2026-11-11). The tag MUST equal the
    # @playwright/test version in package-lock.json: the image's browsers are built
    # for that version only. Node still comes from setup-node (22), not the image.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The container's HOME is /github/home, a runner mount whose parent is writable by
      # another user; @swc/core 1.16 refuses a native-addon cache under it ("cache root has
      # a parent writable by another user") and vite.config.ts fails to load. /root is
      # root-owned 0700, so the cache is accepted there.
      XDG_CACHE_HOME: /root/.cache
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The workspace is owned by the runner user and the container runs as root, so
      # without this every later git command fails with "dubious ownership".
      - name: Trust the workspace for git (container job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Production build against the fake Supabase
        env:
          VITE_SUPABASE_URL: https://phoneqafakenotaproject.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.e2e-test-placeholder-not-a-real-key
          VITE_ENABLE_ORGANISER_DETAIL: 'true'
          VITE_ENABLE_ORGANISERS_DIRECTORY: 'true'
          NODE_OPTIONS: --import ./tests/e2e-phone/fakeSupabasePreload.mjs
        run: npm run build

      - name: Run the production-build smoke
        run: npx playwright test --config playwright.build.config.ts
