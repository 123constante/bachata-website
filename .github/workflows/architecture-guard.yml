name: Source Integrity

# Production guardrail against Cowork-mount file corruption (null bytes,
# silent truncation, JSON/TS parse failures). Runs on every push and PR.
# Calls bin/check-integrity.sh which sha256-pins the guard before running.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: chmod +x bin/*.sh

      - name: Run integrity guard (sealed wrapper)
        run: bin/check-integrity.sh

      - name: Run legacy-tables guardrail (event_profile_links*)
        run: npm run check:legacy-tables

      - name: Run legacy-program-RPC guardrail (Phase 5.6 cutover)
        run: npm run check:legacy-program-rpcs

      - name: Run runtime architecture guard
        run: npm run lint:architecture

      # a11y + lazy-load guard: every <img> in src/**/*.tsx must carry
      # alt= and loading=. Script-only, zero deps. AUDIT_STRICT=1 makes a
      # missing attribute a hard fail (backlog swept to zero 2026-06-13).
      - name: Image-attribute audit (alt + loading)
        env:
          AUDIT_STRICT: '1'
        run: npm run check:images

      # Image-width contract: every literal width/quality handed to the
      # /_vercel/image helpers must be one vercel.json declares, and
      # imageCdn.ts's SIZES must equal images.sizes. Vercel answers 400 for
      # anything else, so the image renders blank on production while
      # typechecking, linting and rendering fine in dev -- exactly how PR #178
      # shipped six blank organiser thumbnails on 2026-07-31.
      #
      # The canary runs first. It existed as a package.json entry from the day
      # the guard landed and NOTHING invoked it -- a self-test nobody runs proves
      # nothing, and reads as coverage that is not there. Found while auditing
      # which canaries have real callers (rule R4, check #63).
      - name: Image-width contract
        run: |
          npm run check:image-widths:self-test
          npm run check:image-widths

      # The plan-hygiene GUARD cannot run here -- its plans directory lives
      # outside the repo, which is why pre-ship is its only caller and why it
      # appears in no other workflow. Its CANARY has no such dependency: it
      # builds its fixtures in a tmpdir. So the rules get proved on every push
      # even though the lint itself is a local-only gate, which is the half of
      # this guard CI can honestly own.
      - name: Plan-hygiene rules (canary only -- the lint is pre-ship-local)
        run: npm run check:plan-hygiene:self-test

      # Workflow artifact policy: what an upload in .github/workflows is
      # allowed to cost. Phase P3 of the ci-spend-never-silent arc, and the
      # author-time half of it -- check-ci-budget.mjs measures the bill daily,
      # this refuses the shapes that run it up, on the PR that adds them.
      #
      # The incident it exists for: an `if: failure()` upload on a nightly that
      # never went green. That reads as a bound on cost and is one only if the
      # job sometimes succeeds; on 15-of-15 failures it was an unconditional
      # 122 MB upload wearing a conditional's clothes, holding 858 MB against a
      # 500 MB allowance for four months while every gate on this board stayed
      # green. Nothing here was measuring what CI cost.
      #
      # Canary first, same rule as the guards above: a self-test with no caller
      # proves nothing, and this guard's whole job is to not be silently blind.
      # Static -- no network, no secrets, no DB.
      - name: Workflow artifact policy (canary, then the guard)
        run: |
          npm run check:workflow-artifact-policy:self-test
          npm run check:workflow-artifact-policy

      # cp1252→UTF-8 mojibake reintroduction guard. Fires when the
      # byte signature of a misinterpreted UTF-8 sequence (e.g. `â€"`,
      # `â˜…`, `â†'`, `Â·`, `Ã—`) lands in tracked source. The repo was
      # swept clean on 2026-05-18; .editorconfig (charset = utf-8) tells
      # modern editors to never re-encode, so any new hit is a regression.
      # The canary runs first, per the same rule as the image-width guard above.
      # It proves the DETECTION rules against fixtures and needs no checkout
      # state, so it still reports if the grep below is the thing that broke.
      - name: Mojibake rules (canary)
        run: npm run check:mojibake:self-test

      - name: Mojibake guard
        run: |
          if git grep -nE 'â€|â˜…|â†|Â·|Ã—|â‰|â”€|â„™' \
              -- ':!.playwright-mcp/' \
                 ':!.github/workflows/architecture-guard.yml' \
                 ':!devWebsitesrcmodulesevent-pagebentoBentoTile.tsx'; then
            echo '::error::cp1252→UTF-8 mojibake detected. Re-save the affected files as UTF-8 (charset declared in .editorconfig).'
            exit 1
          fi

      # Entry-point dispatch proof: every CLI under scripts/ and bin/ still RUNS
      # when it is invoked through a junction/symlink spelling of the repo, and
      # still stays silent on a plain import. Node realpaths import.meta.url and
      # leaves process.argv[1] as typed, so a hand-rolled comparison of the two
      # fails OPEN through such a spelling -- the script exits 0 having run
      # NOTHING, which reads as a pass. That is rule R6 in
      # check-script-conventions.mjs, and this is the sweep that proves it.
      #
      # The incident being closed here is one level up from that. #235 landed a
      # guard that dispatched through isEntryPoint with no TARGETS row, so
      # `npm run prove:entry-point` exited 2 -- "cannot run", nothing measured --
      # from that merge until #260. Nothing caught it, because the prover
      # appeared in NO workflow, no lint chain and no pre-ship. It was OFFLINE
      # rather than passing, and an offline guard looks exactly like a quiet one.
      #
      # Three attempts at a cheap source-scanning stand-in for this step were
      # built and all three reverted, the last two dying inside their own central
      # predicate on pristine code. The premise behind them was that the sweep is
      # too slow for every PR. Re-measured on this tree 2026-08-20: ~10s over 25
      # targets, on a job that already spends minutes in `npm ci` -- and the
      # unlisted-dispatcher case, which is the #235 shape exactly, returns 2
      # before a single process is spawned. So the real prover runs here and
      # there is no stand-in left to keep honest.
      #
      # It creates one link per run under the temp directory and removes it;
      # both GitHub runner images make symlinks and junctions unprivileged. It
      # does not degrade quietly if that stops being true: a link-rights skip
      # under CI is a hard failure inside the canary, and a link the sweep could
      # not remove is exit 2 rather than a warning line.
      #
      # LAST, AND SEPARATELY BOUNDED, for the reason check #65 is in
      # db-contract-check.yml. This is the only step here that spawns processes
      # -- 25 targets x 3 arms, sequentially, each free to burn the prover's own
      # 30s per-arm timeout. That worst case is far larger than this job's
      # timeout-minutes, so a handful of stalled arms would have GitHub cancel
      # the JOB: the prover's "COULD NOT MEASURE" report never prints, and every
      # step behind it is killed having reported nothing. A cancelled job is not
      # a named failure. So it runs after the cheap greps, and its own
      # timeout-minutes bounds it well under the job's -- measured at ~10s, this
      # is a 12x ceiling, not a target.
      #
      # That this step RUNS is asserted from tests/entryPoint.test.ts, out of
      # PARSED yaml -- a guard against offline guards has no business being
      # switched off by a comment character. That spec pins the script to
      # EXACTLY these two lines: no `if:`, no continue-on-error, no `shell:`
      # override, and nothing wrapped around them.
      #
      # Canary first, same rule as the guards above.
      - name: Entry-point dispatch proof (canary, then the sweep)
        timeout-minutes: 2
        run: |
          npm run prove:entry-point:self-test
          npm run prove:entry-point
