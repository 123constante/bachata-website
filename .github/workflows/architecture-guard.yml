name: Source Integrity

# Production guardrail against Cowork-mount file corruption (null bytes,
# silent truncation, JSON/TS parse failures). Runs on every push and PR.
# Calls bin/check-integrity.sh which sha256-pins the guard before running.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Make scripts executable
        run: chmod +x bin/*.sh

      - name: Run integrity guard (sealed wrapper)
        run: bin/check-integrity.sh

      - name: Run legacy-tables guardrail (event_profile_links*)
        run: npm run check:legacy-tables

      - name: Run legacy-program-RPC guardrail (Phase 5.6 cutover)
        run: npm run check:legacy-program-rpcs

      - name: Run runtime architecture guard
        run: npm run lint:architecture

      # a11y + lazy-load guard: every <img> in src/**/*.tsx must carry
      # alt= and loading=. Script-only, zero deps. AUDIT_STRICT=1 makes a
      # missing attribute a hard fail (backlog swept to zero 2026-06-13).
      - name: Image-attribute audit (alt + loading)
        env:
          AUDIT_STRICT: '1'
        run: npm run check:images

      # Image-width contract: every literal width/quality handed to the
      # /_vercel/image helpers must be one vercel.json declares, and
      # imageCdn.ts's SIZES must equal images.sizes. Vercel answers 400 for
      # anything else, so the image renders blank on production while
      # typechecking, linting and rendering fine in dev -- exactly how PR #178
      # shipped six blank organiser thumbnails on 2026-07-31.
      #
      # The canary runs first. It existed as a package.json entry from the day
      # the guard landed and NOTHING invoked it -- a self-test nobody runs proves
      # nothing, and reads as coverage that is not there. Found while auditing
      # which canaries have real callers (rule R4, check #63).
      - name: Image-width contract
        run: |
          npm run check:image-widths:self-test
          npm run check:image-widths

      # The plan-hygiene GUARD cannot run here -- its plans directory lives
      # outside the repo, which is why pre-ship is its only caller and why it
      # appears in no other workflow. Its CANARY has no such dependency: it
      # builds its fixtures in a tmpdir. So the rules get proved on every push
      # even though the lint itself is a local-only gate, which is the half of
      # this guard CI can honestly own.
      - name: Plan-hygiene rules (canary only -- the lint is pre-ship-local)
        run: npm run check:plan-hygiene:self-test

      # cp1252→UTF-8 mojibake reintroduction guard. Fires when the
      # byte signature of a misinterpreted UTF-8 sequence (e.g. `â€"`,
      # `â˜…`, `â†'`, `Â·`, `Ã—`) lands in tracked source. The repo was
      # swept clean on 2026-05-18; .editorconfig (charset = utf-8) tells
      # modern editors to never re-encode, so any new hit is a regression.
      # The canary runs first, per the same rule as the image-width guard above.
      # It proves the DETECTION rules against fixtures and needs no checkout
      # state, so it still reports if the grep below is the thing that broke.
      - name: Mojibake rules (canary)
        run: npm run check:mojibake:self-test

      - name: Mojibake guard
        run: |
          if git grep -nE 'â€|â˜…|â†|Â·|Ã—|â‰|â”€|â„™' \
              -- ':!.playwright-mcp/' \
                 ':!.github/workflows/architecture-guard.yml' \
                 ':!devWebsitesrcmodulesevent-pagebentoBentoTile.tsx'; then
            echo '::error::cp1252→UTF-8 mojibake detected. Re-save the affected files as UTF-8 (charset declared in .editorconfig).'
            exit 1
          fi
