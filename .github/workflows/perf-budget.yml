name: Perf Budget

# Performance guardrails (perf programme, Pillar D -- "stays fast"). Three jobs:
#   - bundle-budget: builds the client and enforces per-route first-load JS
#     budgets from perf-budgets.json (catches a heavy dep creeping back onto the
#     hydration critical path, e.g. framer-motion/Sentry).
#   - lighthouse: resolves the PR's Vercel preview first-party (scripts/lib/
#     previewProbe.mjs, via the GitHub Deployments API -- no third-party action)
#     and asserts LCP/TBT/CLS mobile budgets on the homepage, a landing page, and
#     one event page.
#   - doc-weight: measures the rendered homepage's on-the-wire brotli bytes -- the
#     first CI check that sees the actual document (bundle-budget only sees JS).
#
# ANTI-MASKING (why this workflow no longer hides a dead check): the measure jobs
# are NOT continue-on-error. Their scripts split two failure classes -- an INFRA
# failure ("couldn't measure": preview unreachable, protection not bypassed, zero
# metrics) is ALWAYS a hard red; a BUDGET breach ("measured, over budget") is
# warn-only until LH_ENFORCE=1 / DOC_WEIGHT_ENFORCE=1 flips it to blocking. That
# flip is Phase 4 -- a deliberate env switch, NOT the accident of dropping a
# continue-on-error. Do not add continue-on-error to a measure job to quiet it:
# that is exactly how the Lighthouse check sat dead-but-green for 13 PR runs.
#
# PREREQUISITE: the lighthouse + doc-weight jobs reach the protected preview with
# VERCEL_AUTOMATION_BYPASS_SECRET (Vercel: Settings -> Deployment Protection ->
# Protection Bypass for Automation, added as a repo Actions secret). Until that
# secret exists they fail LOUDLY (by design) rather than silently passing.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # soft-signal: first-load JS budgets are warn-only during the bake; Phase 4
    # removes this to make them blocking. This is a real, reliably-failing local
    # check (no external dependency), so a soft window here cannot hide a dead
    # check the way the old lighthouse continue-on-error did.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build client + server
        env:
          # Same rationale as e2e-smoke.yml: supabase-js validates the URL shape
          # at module init, so a valid-shaped placeholder is required for the
          # build to run. No real backend is contacted during a build/prerender.
          VITE_SUPABASE_URL: https://stsdtacfauprzrdebmzg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.perf-budget-build-placeholder-not-a-real-key
        run: npm run build

      - name: First-load JS budgets
        run: npm run check:bundle-budget

  lighthouse:
    # Previews only exist for PRs; skip on push (nothing to point Lighthouse at).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOT continue-on-error: an infra failure here must be a loud red. Budget
    # breaches are warn-only inside the script (LH_ENFORCE) instead.
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lighthouse mobile budgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run check:lighthouse

  doc-weight:
    # Measures the rendered homepage's on-the-wire brotli bytes on the PR preview.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOT continue-on-error: same anti-masking rule as lighthouse.
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `npm ci`: check-doc-weight.mjs and previewProbe.mjs use only Node
      # builtins + curl (preinstalled on ubuntu-latest).
      - name: Document weight budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run check:doc-weight
