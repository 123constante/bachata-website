name: Perf Budget

# Performance guardrails (perf programme, Pillar D -- "stays fast"). Three jobs:
#   - bundle-budget: builds the client and enforces per-route first-load JS
#     budgets from perf-budgets.json (catches a heavy dep creeping back onto the
#     hydration critical path, e.g. framer-motion/Sentry).
#   - lighthouse: resolves the PR's Vercel preview first-party (scripts/lib/
#     previewProbe.mjs, via the GitHub Deployments API -- no third-party action)
#     and asserts LCP/TBT/CLS mobile budgets on the homepage, a landing page, and
#     one event page.
#   - doc-weight: measures the rendered homepage's on-the-wire brotli bytes -- the
#     first CI check that sees the actual document (bundle-budget only sees JS).
#
# ANTI-MASKING (why this workflow no longer hides a dead check): the measure jobs
# are NOT continue-on-error. Their scripts split two failure classes -- an INFRA
# failure ("couldn't measure": preview unreachable, protection not bypassed, zero
# metrics) is a hard red; a BUDGET breach ("measured, over budget") is
# warn-only until LH_ENFORCE=1 / DOC_WEIGHT_ENFORCE=1 flips it to blocking. That
# flip is Phase 4 -- a deliberate env switch, NOT the accident of dropping a
# continue-on-error. Do not add continue-on-error to a measure job to quiet it:
# that is exactly how the Lighthouse check sat dead-but-green for 13 PR runs.
# ONE narrow INFRA exception (lighthouse job only): a positively-PROVEN
# Deployment Protection wall on the PR preview (401/403 or parked on Vercel's
# login surface) skips green with a ::warning:: -- no code change can open that
# wall. Timeouts / DNS / broken previews are NOT the exception; they stay red.
#
# PREREQUISITE: the lighthouse + doc-weight jobs reach the protected preview with
# VERCEL_AUTOMATION_BYPASS_SECRET (Vercel: Settings -> Deployment Protection ->
# Protection Bypass for Automation, added as a repo Actions secret). If the
# secret is MISSING they fail LOUDLY (by design) rather than silently passing.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# These jobs hit the PRODUCTION database (Micro compute). A new push to a PR
# cancels that PR's superseded run so two runs never load prod at once; main,
# schedule and dispatch runs are never cancelled (their result is the record).
concurrency:
  group: perf-budget-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The preview job(s) below are SKIPPED on the no-preview branches (vercel.json
  # git.deploymentEnabled turns their deployment off; scripts/vercel-ignore-build.sh
  # skips the build). This job runs on exactly those branches so the skip carries
  # an explicit reason instead of a bare "skipped". check-no-preview-prefixes.mjs
  # keeps its prefix list equal to the preview jobs' exclusions.
  no-preview-reason:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'bot/') || startsWith(github.head_ref, 'dependabot/') || startsWith(github.head_ref, 'arc/briefs-') || startsWith(github.head_ref, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Explain the skipped preview job(s)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          msg="Preview checks in this workflow are SKIPPED by design for branch '$HEAD_REF': claude/* and arc/briefs-* get no Vercel deployment, bot/* and dependabot/* skip preview checks (docs/pr-batching-policy.md, Vercel build budget). A slice PR's evidence is the worker's sandbox table; preview checks run on PRs from feat/* and other branches."
          echo "::notice title=No preview by design::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # BLOCKING (the bake window closed early, on purpose). This was warn-only
    # until Phase 4, but .github/dependabot.yml's supabase carve-out now leans
    # on it: that carve-out's whole justification is "on its own PR
    # bundle-budget names it", and a continue-on-error job names nothing - it
    # prints the overage and still reports green. Home currently sits at
    # 243.7 KB against a 245 KB budget (1.3 KB of headroom), so the first
    # @supabase minor would have merged 11.6 KB over on an all-green check
    # list. Unlike the old lighthouse case this is a local, deterministic
    # check with no external dependency, so making it blocking cannot wedge
    # CI on infra flake. Do NOT re-add continue-on-error here.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      # BEFORE the build, deliberately. The canary drives the graph and
      # attribution rules against fixtures and needs no manifest, so running it
      # first means the proof-of-failure still reports in exactly the runs where
      # the tooling is most suspect -- a dependency bump or an OOM that breaks
      # `npm run build`. Behind the build it would be skipped in those runs. A
      # self-test with no caller proves nothing and reads as coverage that is
      # not there (the lesson check-image-widths taught in architecture-guard).
      - name: Bundle-budget canary (no build required)
        run: npm run check:bundle-budget:self-test

      # Same placement, same reason: it drives main() and every rule against
      # fixtures and a fake filesystem, so it still reports in exactly the runs
      # where the build is what broke.
      - name: First-load request canary (no build required)
        run: npm run check:first-load-requests:self-test

      # Same placement, same reason as the two canaries above.
      - name: Chunk import-cycle canary (no build required)
        run: npm run check:chunk-cycles:self-test

      - name: Build client + server
        env:
          # Same rationale as e2e-smoke.yml: supabase-js validates the URL shape
          # at module init, so a valid-shaped placeholder is required for the
          # build to run. No real backend is contacted during a build/prerender.
          VITE_SUPABASE_URL: https://stsdtacfauprzrdebmzg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.perf-budget-build-placeholder-not-a-real-key
        run: npm run build

      - name: First-load JS budgets
        run: npm run check:bundle-budget

      # AFTER the KB budgets, and a separate step on purpose: these two answer
      # different questions off the same build (bytes vs requests) and a route
      # can pass one while failing the other. Sharing a step would let the
      # first failure hide the second.
      - name: First-load request count
        run: npm run check:first-load-requests

      # Its own step for the same reason: a third question off the same build.
      # Two chunks that statically import each other evaluate in load order, so
      # one runs against the other's unassigned vars -- PR #746's "TypeError:
      # <minified helper> is not a function", which every KB and request check
      # above saw as green.
      # `!cancelled()` so a red KB or request budget ABOVE cannot skip it: a
      # Radix bump can break both at once, and the cycle is the one that crashes
      # the page. It does not reach back past the build: if a pre-build canary
      # or the build itself failed, this exits 2 (no build), red but unnamed.
      - name: Chunk import cycles
        if: ${{ !cancelled() }}
        run: npm run check:chunk-cycles

  lighthouse:
    # Previews only exist for PRs; skip on push (nothing to point Lighthouse at).
    # scripts/vercel-ignore-build.sh (vercel.json ignoreCommand) never builds a
    # preview for its no-preview prefixes, so previewProbe would poll 600s then
    # THROW. Keep this list in sync with DIFF_RULE_PREFIXES +
    # ALWAYS_SKIP_PREFIXES there: npm run check:no-preview-prefixes fails on drift.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'bot/') && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'arc/briefs-') && !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOT continue-on-error: an infra failure here must be a loud red. Budget
    # breaches are warn-only inside the script (LH_ENFORCE) instead.
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm to 11 (Node 22 ships with npm 10)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lighthouse mobile budgets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run check:lighthouse

  doc-weight:
    # Measures the rendered homepage's on-the-wire brotli bytes on the PR preview.
    # scripts/vercel-ignore-build.sh (vercel.json ignoreCommand) never builds a
    # preview for its no-preview prefixes, so previewProbe would poll 600s then
    # THROW. Keep this list in sync with DIFF_RULE_PREFIXES +
    # ALWAYS_SKIP_PREFIXES there: npm run check:no-preview-prefixes fails on drift.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'bot/') && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.head_ref, 'arc/briefs-') && !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOT continue-on-error: same anti-masking rule as lighthouse.
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No `npm ci`: check-doc-weight.mjs and previewProbe.mjs use only Node
      # builtins + curl (preinstalled on ubuntu-latest).
      - name: Document weight budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run check:doc-weight
