name: Bot auto-merge (docs/tests only)

# Asks GitHub to merge a LOW-RISK bot PR by itself once the `main` ruleset's
# REQUIRED checks pass (`gh pr merge --auto`). GitHub does the merge; this
# workflow only flips the switch, and flips it back off when the PR stops
# qualifying. Read docs/automerge.md before editing anything here.
#
# SAFETY, read before editing:
#  - OFF unless BOTH automerge_enabled and bot_automerge_enabled are true in
#    .github/automation/arming.json ON MAIN (slice 2, drill A30; docs/automation-foundations.md).
#    automerge_enabled is the shared switch dependabot-automerge.yml also reads;
#    bot_automerge_enabled is this workflow's own. The first step after the checkout reads the
#    file and gates EVERY later step; off = a visible notice and a green run. The old repo
#    variables are drift input only (env ARMING_VAR_*). Auto-merge merges IMMEDIATELY when `main`
#    has no required checks.
#  - pull_request_target, so the workflow DEFINITION and the classifier always come
#    from main: a PR cannot edit its way past them. It NEVER checks out, builds or
#    runs PR code; files, labels and the body are read through the REST API, and no
#    PR-controlled text is interpolated into a shell command.
#  - The verdict is scripts/automerge-classify.mjs (docs/** and tests only, nothing
#    under src/ app/ api/ public/ scripts/ .github/ ..., under 400 lines, the
#    `automerge-ok` label from a bot worker, no `needs-owner`). Exit 2 = NO + red run.
#  - Enabling is pinned to the head sha that was classified (--match-head-commit),
#    so a push that lands between the verdict and the merge cannot ride along.
#  - Nothing here is HARD tier for owner-approval.yml: a qualifying PR touches no
#    scripts/, .github/ or .claude/ path, so the audit stays green without approval.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write
  issues: read # the pause switch reader (docs/automation-pause.md); nothing else

concurrency:
  group: bot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The BASE branch, never the PR head: only main's classifier may judge a PR.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # ARMING (A30): arming.json from this MAIN checkout decides; every later step is gated on it.
      - name: Read arming.json (automerge_enabled + bot_automerge_enabled)
        id: arming
        env:
          ARMING_VAR_AUTOMERGE_ENABLED: ${{ vars.AUTOMERGE_ENABLED }}
          ARMING_VAR_BOT_AUTOMERGE_ENABLED: ${{ vars.BOT_AUTOMERGE_ENABLED }}
        run: node scripts/automation-arming.mjs --gate automerge_enabled,bot_automerge_enabled

      # PAUSE SWITCH (docs/automation-pause.md): exit 3 = paused. continue-on-error so a pause is
      # not a red run; fail closed: only paused == 'false' (positively read) lets a merge step run.
      - name: Read the automation pause switch
        id: pause
        if: steps.arming.outputs.enabled == 'true'
        # soft-signal: exit 3 = PAUSED is the measured outcome, written to outputs; only paused == 'false' enables (fail closed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation-pause.mjs

      - name: Classify the PR (REST only, no PR code)
        id: c
        if: steps.arming.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          # RUN in scripts/automerge-classify.mjs; tests/automergeClassify.test.ts pins the two equal.
          node -e 'import("./scripts/automerge-classify.mjs").then((m) => m.main()).then((c) => { process.exitCode = c; }, (e) => { console.log("INFRA: " + e.message); process.exitCode = 2; })'
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # PAUSE SWITCH (docs/automation-pause.md): exit 3 = paused. continue-on-error so a pause is
      # not a red run; fail closed: only paused == 'false' (positively read) lets a merge step run.
      - name: Read the automation pause switch again (immediately before enabling)
        id: pause2
        if: steps.arming.outputs.enabled == 'true'
        # soft-signal: exit 3 = PAUSED is the measured outcome, written to outputs; only paused == 'false' enables (fail closed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation-pause.mjs

      # The bot's token, not GITHUB_TOKEN: a merge made with GITHUB_TOKEN starts no
      # `push` workflow, so owner-approval.yml and every post-merge check on main
      # would silently not run for an auto-merged commit.
      - name: Enable auto-merge (GitHub merges when required checks pass)
        if: steps.arming.outputs.enabled == 'true' && steps.c.outputs.code == '0' && steps.c.outputs.qualifies == 'true' && steps.pause.outputs.paused == 'false' && steps.pause2.outputs.paused == 'false'
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ steps.c.outputs.head_sha }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::secret BOT_PR_TOKEN is not set; auto-merge NOT enabled"; exit 1; }
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

      # Any other outcome, including a classifier that could not run, switches an
      # already-enabled auto-merge back OFF: a PR that stopped qualifying (new push,
      # needs-owner label, back to draft) must not merge on an old verdict. A PAUSE lands here too:
      # GitHub would merge an armed PR later by itself, so a pause must disarm (the one write allowed).
      - name: Disable auto-merge when the PR does not qualify
        if: always() && steps.arming.outputs.enabled == 'true' && !(steps.arming.outputs.enabled == 'true' && steps.c.outputs.code == '0' && steps.c.outputs.qualifies == 'true' && steps.pause.outputs.paused == 'false' && steps.pause2.outputs.paused == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          on="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.auto_merge != null')"
          if [ "$on" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "Auto-merge was on and is now OFF: the PR no longer qualifies, or automation is paused."
          else
            echo "Auto-merge is off; nothing to undo."
          fi

      - name: Fail the run when the classifier could not run
        if: steps.arming.outputs.enabled == 'true' && steps.c.outputs.code != '0'
        run: |
          echo "::error::automerge-classify exited ${{ steps.c.outputs.code }} (infra); treated as NOT qualifying"
          exit 1
