name: IO Health Poll

# Phase 6 Step 2 of the Supabase IO Optimization arc (see
# ~/.claude/plans/phase-6-io-health-check-auto-degradation.md). CI-only
# consumer of /api/io-health: polls it and reports the raw candidate series.
# There is deliberately no pass/fail threshold here -- Step 1 left "which
# series to key off" undecided, so this is a visibility poll, not a gate.
# Step 3 (auto-degradation) is separate scope, reviewed on its own.
#
# Requires the repo secret IO_HEALTH_SECRET, matching the Vercel production
# env var the deployed /api/io-health route checks. A missing secret is
# exit 2 -- never a green run over a call that was never authenticated.

on:
  schedule:
    - cron: '15 6 * * *'   # daily
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL (defaults to production)'
        required: false
        default: 'https://www.bachatacalendar.co.uk'
  push:
    branches: [main, master]
    paths:
      - 'scripts/check-io-health.mjs'
      - 'app/routes/api.io-health.tsx'
      - '.github/workflows/io-health-guard.yml'

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove the poll can fail
        run: node scripts/check-io-health.mjs --self-test

      - name: Announce failure
        if: (failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || (cancelled() && github.event_name == 'schedule')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'io-health-canary';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '`io-health-guard` job `canary` failed.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'The canary self-test no longer proves the poll can fail -- scripts/check-io-health.mjs --self-test is red. Read the run output.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'io-health-guard canary red', body, labels: [LABEL] });
            }

      - name: Close failure issue when green again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'io-health-canary';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }

  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Poll /api/io-health
        env:
          IO_HEALTH_SECRET: ${{ secrets.IO_HEALTH_SECRET }}
          IO_HEALTH_BASE_URL: ${{ inputs.base_url || 'https://www.bachatacalendar.co.uk' }}
        run: node scripts/check-io-health.mjs

      - name: Announce failure
        if: (failure() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.base_url || 'https://www.bachatacalendar.co.uk') == 'https://www.bachatacalendar.co.uk'))) || (cancelled() && github.event_name == 'schedule')
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'io-health-poll';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '`io-health-guard` job `poll` failed.',
              '',
              `Run: ${run}`,
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              'The /api/io-health poll failed or could not authenticate (a missing IO_HEALTH_SECRET is exit 2, and a Cloudflare challenge on the prod host reads the same). Read the run output.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'io-health-guard poll red', body, labels: [LABEL] });
            }

      - name: Close failure issue when green again
        if: success() && ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.base_url || 'https://www.bachatacalendar.co.uk') == 'https://www.bachatacalendar.co.uk')))
        uses: actions/github-script@v9
        with:
          script: |
            const LABEL = 'io-health-poll';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `Green again as of \`${context.sha.slice(0, 7)}\`. Closing.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
