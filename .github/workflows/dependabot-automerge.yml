name: Dependabot auto-merge

# RUNG 1 of the hands-off ladder. For a Dependabot PR whose EVERY updated package is
# a direct DEV dependency AND a minor or patch bump, ask GitHub to merge it by itself
# once the branch's required status checks are green (`gh pr merge --auto`). GitHub
# does the merge, not this workflow: it only flips the switch.
#
# SAFETY, read before editing:
#  - OFF unless automerge_enabled is true in .github/automation/arming.json ON MAIN (slice 2,
#    drill A30; docs/automation-foundations.md): the first step after the checkout reads the file
#    and gates EVERY later step; off = a visible notice and a green run. The old repo variable
#    AUTOMERGE_ENABLED is drift input only (env ARMING_VAR_AUTOMERGE_ENABLED). Auto-merge merges
#    IMMEDIATELY when `main` has no required checks, so the owner arms it only AFTER the branch
#    rule requiring the stable checks exists. Never flip the default.
#  - Majors, production dependencies, indirect dependencies and GitHub Actions bumps are
#    never auto-merged. Anything touching .github/ is HARD tier for owner-approval.yml
#    (an unapproved landing there goes red + opens an issue), so CI-config PRs stay manual.
#  - Only the grouped/ungrouped Dependabot actor qualifies; a human PR never does.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write
  issues: read # the pause switch reader (docs/automation-pause.md); nothing else

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The pause reader is guard code: it comes from MAIN, never the PR merge ref, and the
      # checkout keeps no credentials. KNOWN RISK: if a Dependabot-triggered token cannot read
      # issues, the reader fails closed (reason=HTTP 403 in this step's log) and nothing enables.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # ARMING (A30): arming.json from this MAIN checkout decides; every later step is gated on it.
      - name: Read arming.json (automerge_enabled)
        id: arming
        env:
          ARMING_VAR_AUTOMERGE_ENABLED: ${{ vars.AUTOMERGE_ENABLED }}
        run: node scripts/automation-arming.mjs --gate automerge_enabled
      # PAUSE SWITCH (docs/automation-pause.md): exit 3 = paused. continue-on-error so a pause is
      # not a red run; fail closed: only paused == 'false' (positively read) lets a merge step run.
      - name: Read the automation pause switch
        id: pause
        if: steps.arming.outputs.enabled == 'true'
        # soft-signal: exit 3 = PAUSED is the measured outcome, written to outputs; only paused == 'false' enables (fail closed)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automation-pause.mjs

      - id: meta
        if: steps.arming.outputs.enabled == 'true'
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this PR qualifies
        id: decide
        if: steps.arming.outputs.enabled == 'true'
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          ok=$(printf '%s' "$DEPS" | jq -r 'length > 0 and all(.[]; .dependencyType == "direct:development" and (.updateType == "version-update:semver-minor" or .updateType == "version-update:semver-patch"))')
          echo "qualifies=$ok" | tee -a "$GITHUB_OUTPUT"
          printf '%s' "$DEPS" | jq -r '.[] | "  \(.dependencyName) \(.prevVersion) -> \(.newVersion) [\(.dependencyType), \(.updateType)]"'

      # MONEY SET (slice 2, drill A16; docs/automation-foundations.md): isMoney() over the PR's
      # files WITH patches (files API, github.token) and money-set.json from the MAIN checkout
      # above. Fail closed: only money == 'false' (positively read, no hit) lets Enable run. A hit
      # is a NO, not a red run (exit 0); a crash leaves no output, so Enable stays off.
      # GUARD PATHS (slice 2, drill A18): the same step writes guard=true|false over the ONE shared
      # guard-path list (scripts/lib/guard-paths.mjs); only guard == 'false' lets Enable run.
      - name: Money-set and guard-path check (isMoney over the PR's changed paths and lines; isGuardPath)
        id: money
        if: steps.arming.outputs.enabled == 'true' && steps.decide.outputs.qualifies == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # F9 (review-1370-r1): the head the event was raised for; the CLI refuses when the PR's
          # head has moved since (a 40-hex sha, never event text).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/automation-money-check.mjs

      - name: Enable auto-merge (GitHub merges when required checks pass)
        if: steps.arming.outputs.enabled == 'true' && steps.decide.outputs.qualifies == 'true' && steps.pause.outputs.paused == 'false' && steps.money.outputs.money == 'false' && steps.money.outputs.guard == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      # Paused (or the switch unreadable), or a money-set hit / unreadable money check on a PR that
      # otherwise qualifies: an already-armed auto-merge would still merge later by itself, so
      # disarm it. Disabling only removes merge power.
      - name: Disable auto-merge while the automation is paused or on a money-set hit
        if: always() && steps.arming.outputs.enabled == 'true' && (steps.pause.outputs.paused != 'false' || (steps.decide.outputs.qualifies == 'true' && (steps.money.outputs.money != 'false' || steps.money.outputs.guard != 'false')))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          on="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.auto_merge != null')"
          if [ "$on" = "true" ]; then
            gh pr merge --disable-auto "$PR_URL"
            echo "Auto-merge was on and is now OFF: automation is paused."
          else
            echo "Auto-merge is off; nothing to undo."
          fi
