# PROPOSAL (brief merge-tiers). Cloud workers cannot write .github/workflows/; the orchestrator
# copies this file to .github/workflows/revert-on-red.yml after the owner's review.
#
# When a push-to-main workflow fails and the failing commit came from a tier B or C PR that was
# merged by GitHub auto-merge, open ONE bot-authored revert PR, comment on the original PR, and
# ping the owner once (issue labelled owner-turn). Rules:
#   - only when repo variable MERGE_TIERS_ENABLED == 'true'
#   - never reverts tier A (scripts/lib/merge-tier.mjs classifyTier, run from main's checkout)
#   - never reverts a revert (subject starting 'Revert "' or a claude/revert-* head branch)
#   - at most one open revert PR per commit: branch claude/revert-<sha8>; an existing branch or
#     open PR for it = do nothing (also serialised by the concurrency group)
#   - workflow_dispatch with dry_run: true (the default) classifies and logs only: no branch, no
#     PR, no comment, no issue. This is how it is tested without a real red main.
# The workflows list is the push-to-main set as of 2026-11-15; adjust when one is renamed.
name: Revert on red (merge tiers)

on:
  workflow_run:
    workflows:
      - Source Integrity
      - BOM Check
      - DB Contract Check
      - E2E Smoke
      - Perf Budget
      - Typecheck (WallClock brand gate)
      - Unit & Contract Tests
      - Workflow Lint
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to evaluate"
        required: true
      dry_run:
        description: "Log the decision only (no branch, PR, comment or issue)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: revert-on-red-${{ github.event.workflow_run.head_sha || github.event.inputs.sha }}
  cancel-in-progress: false

jobs:
  revert:
    if: >-
      vars.MERGE_TIERS_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.event.inputs.sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}
      FAILED_RUN: ${{ github.event.workflow_run.html_url || 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_PR_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Decide
        id: decide
        uses: actions/github-script@v9
        with:
          script: |
            const sha = process.env.SHA;
            const say = (ok, why) => { core.info(`${ok ? 'REVERT' : 'SKIP'} ${sha.slice(0, 8)}: ${why}`); core.setOutput('revert', ok ? 'true' : 'false'); };
            if (!/^[0-9a-f]{40}$/.test(sha)) return say(false, 'not a full sha');
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: sha });
            if (/^Revert "/.test(commit.commit.message)) return say(false, 'is itself a revert (no loop)');
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: sha });
            const pr = prs.find((p) => p.merged_at && p.base.ref === 'main');
            if (!pr) return say(false, 'no merged PR (direct push): owner decides');
            if (/^claude\/revert-/.test(pr.head.ref)) return say(false, 'came from a revert PR (no loop)');
            // Merged by auto-merge = the PR timeline has auto_merge_enabled and the merger is not the owner.
            const events = await github.paginate(github.rest.issues.listEvents, { ...context.repo, issue_number: pr.number, per_page: 100 });
            const auto = events.some((e) => e.event === 'auto_merge_enabled' || e.event === 'auto_squash_enabled');
            if (!auto) return say(false, `PR #${pr.number} was not merged by auto-merge`);
            const files = await github.paginate(github.rest.pulls.listFiles, { ...context.repo, pull_number: pr.number, per_page: 100 });
            require('fs').writeFileSync('pr-files.json', JSON.stringify(files.length >= 3000 ? [] : files.map((f) => ({ filename: f.filename, previous_filename: f.previous_filename, patch: f.patch, changes: f.changes }))));
            core.setOutput('pr', String(pr.number));
            const sha8 = sha.slice(0, 8);
            core.setOutput('branch', `claude/revert-${sha8}`);
            const open = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', head: `${context.repo.owner}:claude/revert-${sha8}`, per_page: 100 });
            if (open.length) return say(false, `revert PR #${open[0].number} already open`);
            say(true, `PR #${pr.number} auto-merged; tier check next`);
      - name: Tier (never revert tier A)
        id: tier
        if: steps.decide.outputs.revert == 'true'
        run: >-
          node --input-type=module -e "import { readFileSync, appendFileSync } from 'node:fs';
          import { classifyTier } from './scripts/lib/merge-tier.mjs';
          const t = classifyTier(JSON.parse(readFileSync('pr-files.json', 'utf8'))); console.log('merge tier: ' + t);
          appendFileSync(process.env.GITHUB_OUTPUT, 'tier=' + t + String.fromCharCode(10));"
      - name: Dry run -- stop here
        if: steps.decide.outputs.revert == 'true' && env.DRY_RUN == 'true'
        env:
          TIER: ${{ steps.tier.outputs.tier }}
        run: 'echo "DRY RUN: would revert $SHA (tier $TIER) if tier is B or C; nothing opened"'
      - name: Open the revert PR, comment, ping the owner
        if: steps.decide.outputs.revert == 'true' && env.DRY_RUN != 'true' && (steps.tier.outputs.tier == 'B' || steps.tier.outputs.tier == 'C')
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
          PR: ${{ steps.decide.outputs.pr }}
          BRANCH: ${{ steps.decide.outputs.branch }}
          TIER: ${{ steps.tier.outputs.tier }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then echo "branch $BRANCH exists: one revert per commit"; exit 0; fi
          git config user.name "kiki-claude-bot"
          git config user.email "336045711+kiki-claude-bot@users.noreply.github.com"
          git switch -c "$BRANCH"
          git revert --no-edit "$SHA"
          git push origin "$BRANCH"
          printf 'Automatic revert of %s (PR #%s, merge tier %s): a push-to-main check went red.\n\nFailed run: %s\n\nMerge only after checking the red is caused by this commit. Raised by .github/workflows/revert-on-red.yml.\n' "$SHA" "$PR" "$TIER" "$FAILED_RUN" > body.md
          URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "Revert ${SHA:0:8} (red main after auto-merge of #$PR)" --body-file body.md)
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Main went red after this auto-merged PR landed ($FAILED_RUN). Revert opened: $URL"
          gh issue create --repo "$GITHUB_REPOSITORY" --label owner-turn --title "Red main: revert of ${SHA:0:8} (#$PR) needs your look" --body "Revert PR: $URL. Failed run: $FAILED_RUN."
