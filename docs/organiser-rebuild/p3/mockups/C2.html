<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organiser mockup C2: Today first</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
 * Mockup C2 "Today first" (v2 of C after the independent critique).
 * Colours are the Ember tokens from src/modules/organiser/ui/ember.css
 * (.ember-world) for dark; the light set is the one named in C.md.
 * New in C2: --cancel-bg, --cancel-fg, .own (organiser-only box on the public preview).
 * Every size is px (the public site shrinks rem on phones).
 */
:root {
  --bg: #f7f3ef; --card: #ffffff; --card2: #f1ebe5; --sheet: #ffffff; --tab: #ffffff;
  --line: #e4dbd2; --line-strong: #8a7d71; --fg: #1d0a03; --mut: #5f5248;
  --gold: #f0703a; --gold-fg: #a8461a; --btn: #f0703a; --btnfg: #1d0a03;
  --danger: #b3261e; --danger-fg: #ffffff; --cancel-bg: #fbe4e1; --cancel-fg: #b3261e;
  --ok-bg: #e2f4ea; --ok-fg: #17663f; --warn-bg: #fde8dc; --warn-fg: #8a3510;
  --scrim: rgba(29, 10, 3, 0.45);
  --shadow: 0 1px 2px rgba(29, 10, 3, 0.06), 0 6px 20px rgba(29, 10, 3, 0.06);
  --r-card: 20px; --r-ctl: 15px; --r-chip: 999px; --r-date: 12px; --r-sheet: 28px;
  --font-ui: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202226; --card: #2a2d32; --card2: #33373d; --sheet: #2a2d32; --tab: #17181b;
    --line: #3d4148; --line-strong: #7b828d; --fg: #f1f2f4; --mut: #a3a9b3;
    --gold: #f0703a; --gold-fg: #f5865a; --btn: #f0703a; --btnfg: #1d0a03; --danger: #ff7a6b; --danger-fg: #1d0a03; --cancel-bg: rgba(255, 122, 107, 0.14); --cancel-fg: #ffa59a;
    --ok-bg: rgba(62, 207, 142, 0.14); --ok-fg: #7be6b4; --warn-bg: rgba(240, 112, 58, 0.14); --warn-fg: #ff9a6a;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202226; --card: #2a2d32; --card2: #33373d; --sheet: #2a2d32; --tab: #17181b;
  --line: #3d4148; --line-strong: #7b828d; --fg: #f1f2f4; --mut: #a3a9b3;
  --gold: #f0703a; --gold-fg: #f5865a; --btn: #f0703a; --btnfg: #1d0a03; --danger: #ff7a6b; --danger-fg: #1d0a03; --cancel-bg: rgba(255, 122, 107, 0.14); --cancel-fg: #ffa59a;
  --ok-bg: rgba(62, 207, 142, 0.14); --ok-fg: #7be6b4; --warn-bg: rgba(240, 112, 58, 0.14); --warn-fg: #ff9a6a;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #ddd3ca; font-family: var(--font-ui); font-size: 16px; line-height: 1.4; color: var(--fg);
  -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center;
}
:root[data-theme="dark"] body { background: #111214; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { background: #111214; } }

.phone {
  width: 390px; height: 844px; position: relative; overflow: hidden; overflow: clip;
  background: var(--bg); border-radius: 44px; box-shadow: 0 0 0 10px #000, 0 30px 80px rgba(0,0,0,0.35);
}
@media (max-width: 500px) {
  body { display: block; }
  .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
}
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 0 16px 120px; display: none; background: var(--bg); }
.scr.on { display: block; animation: in 0.22s ease-out; }
@keyframes in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scr.on, .sheet { animation: none !important; transition: none !important; } }

.top { display: flex; align-items: center; gap: 8px; min-height: 64px; padding-top: 12px; }
.top h1 { font-size: 20px; font-weight: 600; margin: 0; flex: 1; }
.back { min-width: 48px; min-height: 48px; margin-left: -12px; border: 0; background: none; color: var(--fg); font: inherit; font-size: 16px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; padding: 0 12px; }
.back svg { width: 22px; height: 22px; }
h2 { font-size: 18px; font-weight: 600; margin: 28px 0 12px; }
.big { font-size: 28px; line-height: 1.15; font-weight: 600; margin: 8px 0 6px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.mut { color: var(--mut); }
.small { font-size: 14px; }
p { margin: 0 0 12px; }

.card { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); border: 1px solid var(--line); }
.pad { padding: 16px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.row + .row, .row + .todo, .todo + .row { border-top: 1px solid var(--line); }
div.row { cursor: default; }
.row .grow, .todo .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 500; font-size: 16px; overflow-wrap: anywhere; }
.row .s { font-size: 14px; color: var(--mut); overflow-wrap: anywhere; }
.row .s.todo-s { color: var(--gold-fg); font-weight: 500; }
.chev { width: 20px; height: 20px; color: var(--mut); flex: none; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: var(--r-ctl); border: 0; font: inherit; font-weight: 600; font-size: 16px; background: var(--btn); color: var(--btnfg); cursor: pointer; padding: 0 18px; text-decoration: none; text-align: center; }
.btn.quiet { background: var(--card2); color: var(--fg); font-weight: 500; }
.btn.line { background: none; border: 1px solid var(--line-strong); color: var(--fg); font-weight: 500; }
.btn.danger-fill { background: var(--danger); color: var(--danger-fg); }
.btn.sm { width: auto; min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn[disabled] { background: var(--card2); color: var(--mut); cursor: not-allowed; }
.link { background: none; border: 0; color: var(--gold-fg); font: inherit; font-weight: 600; min-height: 44px; padding: 0 4px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
.link.danger { color: var(--danger); }
.stack > * + * { margin-top: 10px; }
.bottombar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px; background: linear-gradient(to top, var(--bg) 70%, transparent); z-index: 5; display: none; }
.bottombar.on { display: block; }
.bottombar.above-tabs { bottom: 80px; padding-bottom: 12px; }
.phone.typing .bottombar, .phone.typing .tabs { display: none !important; }

.hero { overflow: hidden; }
.cover { height: 132px; position: relative; }
@media (max-height: 700px) { .hero .cover { height: 96px; } }
.cover .tag { position: absolute; left: 12px; top: 12px; }
.cover .chg { position: absolute; right: 10px; bottom: 10px; min-height: 44px; border: 0; border-radius: 22px; background: #1d0a03; color: #fff; font: inherit; font-size: 14px; font-weight: 600; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.ph1 { background: radial-gradient(circle at 25% 30%, #ffb38a 0, transparent 45%), linear-gradient(135deg, #f0703a, #7a2b52 70%, #2b1640); }
.ph2 { background: radial-gradient(circle at 70% 30%, #ffd6a0 0, transparent 40%), linear-gradient(160deg, #3a6b8f, #23314d 70%); }
.ph3 { background: radial-gradient(circle at 30% 70%, #f7c6e0 0, transparent 40%), linear-gradient(120deg, #8f3a6b, #331a3d); }
.ph4 { background: linear-gradient(135deg, #2f7a62, #183b38); }
.ph5 { background: radial-gradient(circle at 60% 40%, #ffe08a 0, transparent 40%), linear-gradient(135deg, #c25a2a, #4a1f12); }
.ph6 { background: radial-gradient(circle at 40% 30%, #c7d2ff 0, transparent 40%), linear-gradient(135deg, #3d3a8f, #1a1838); }
.ph7 { background: radial-gradient(circle at 70% 70%, #a8d8c4 0, transparent 40%), linear-gradient(135deg, #8f6b3a, #2f2416); }
.nophoto { background: repeating-linear-gradient(45deg, var(--card2), var(--card2) 10px, var(--card) 10px, var(--card) 20px); display: flex; align-items: center; justify-content: center; color: var(--mut); font-size: 14px; }
.when { font-size: 14px; font-weight: 600; color: var(--gold-fg); text-transform: uppercase; letter-spacing: 0.06em; }
.qa { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.qa .btn { min-height: 56px; font-size: 15px; padding: 0 10px; }
.qa svg { width: 20px; height: 20px; flex: none; }
.under { display: flex; justify-content: center; margin-top: 6px; }

.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; border-radius: var(--r-chip); padding: 4px 10px; white-space: nowrap; flex: none; }
.tag.live { background: var(--ok-bg); color: var(--ok-fg); }
.tag.paused, .tag.ended { background: var(--card2); color: var(--mut); border: 1px solid var(--line); }
.tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
.tag.cancel { background: var(--cancel-bg); color: var(--cancel-fg); }
.cover .tag.live { background: #e2f4ea; color: #17663f; }
.cover .tag.paused, .cover .tag.ended, .cover .tag.warn { background: #f1ebe5; color: #5f5248; border: 0; }
.cover .tag.cancel { background: #fbe4e1; color: #b3261e; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

.todo { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; width: 100%; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.todo + .todo { border-top: 1px solid var(--line); }
.tick { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; display: flex; align-items: center; justify-content: center; }
.todo.done .tick { background: var(--ok-fg); border-color: var(--ok-fg); color: var(--card); }
.todo.done .t { text-decoration: line-through; color: var(--mut); }
.todo .t { display: block; font-weight: 500; }
.todo .s { display: block; font-size: 14px; color: var(--mut); }
.count { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 13px; background: var(--gold); color: var(--btnfg); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

.stat { padding: 16px; }
.stat .n { font-size: 30px; font-weight: 600; line-height: 1.1; }
.stat .l { font-size: 14px; color: var(--mut); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--card2); border-radius: var(--r-ctl); }
.seg button { min-height: 44px; border: 0; border-radius: 11px; background: none; color: var(--mut); font: inherit; font-weight: 500; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--card2); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.thumb { width: 48px; height: 48px; border-radius: 12px; flex: none; }
.notice { display: flex; gap: 10px; align-items: center; padding: 12px 12px 12px 16px; border-radius: var(--r-card); background: var(--ok-bg); color: var(--ok-fg); font-weight: 500; margin-top: 4px; }
.notice .grow { flex: 1; }

/* date strip */
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px; margin: 0 -16px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.date { flex: none; width: 68px; min-height: 100px; border-radius: var(--r-date); border: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: inherit; color: var(--fg); cursor: pointer; scroll-snap-align: start; padding: 6px 2px; position: relative; }
.date .d, .date .m { font-size: 13px; color: var(--mut); }
.date .n { font-size: 22px; font-weight: 600; line-height: 1.1; }
.date .st { font-size: 12px; font-weight: 600; min-height: 16px; }
.date .y { font-size: 12px; font-weight: 700; color: var(--gold-fg); }
.date.next { border: 2px solid var(--gold); }
.date.cancelled { background: var(--card2); }
.date.cancelled .n { text-decoration: line-through; color: var(--mut); }
.date.cancelled .st { color: var(--danger); }
.date.moved .st { color: var(--warn-fg); }
.date.past { opacity: 1; background: var(--card2); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 14px; color: var(--mut); margin-top: 4px; }

.av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #1d0a03; font-size: 15px; }
.a1 { background: #ffb38a; } .a2 { background: #a8d8c4; } .a3 { background: #f7c6e0; } .a4 { background: #c7d2ff; } .a5 { background: #ffe08a; }

label.f { display: block; font-size: 15px; font-weight: 500; margin: 16px 0 6px; }
.in { width: 100%; min-height: 52px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--card); color: var(--fg); font: inherit; font-size: 16px; padding: 0 14px; }
.in::placeholder { color: var(--mut); }
.in:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.in.bad { border-color: var(--danger); border-width: 2px; }
.err { color: var(--danger); font-size: 14px; margin-top: 6px; }
.hint { font-size: 14px; color: var(--mut); margin-top: 8px; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 12px 16px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--card); color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.choice + .choice { margin-top: 10px; }
.choice[aria-checked="true"] { border: 2px solid var(--gold); background: var(--warn-bg); }
.choice .grow { flex: 1; min-width: 0; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; }
.choice[aria-checked="true"] .radio { border: 7px solid var(--gold); }
.box { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--line-strong); flex: none; display: flex; align-items: center; justify-content: center; }
.choice[aria-checked="true"] .box { background: var(--gold); border-color: var(--gold); color: var(--btnfg); }
.steps { display: flex; gap: 6px; margin: 4px 0 18px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--card2); }
.steps i.on { background: var(--gold); }
.pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pick.days { grid-template-columns: repeat(4, 1fr); }
.pick button { min-height: 52px; border-radius: var(--r-ctl); border: 1px solid var(--line-strong); background: var(--card); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
.pick button[aria-pressed="true"] { border: 2px solid var(--gold); background: var(--warn-bg); }

.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; padding-bottom: 16px; background: var(--tab); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); z-index: 6; }
.tabs button { border: 0; background: none; color: var(--mut); font: inherit; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; min-height: 56px; }
.tabs button[aria-current="page"] { color: var(--gold-fg); font-weight: 600; }
.tabs svg { width: 24px; height: 24px; }
.tabs.hide { display: none; }

.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; display: none; }
.scrim.on { display: block; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--sheet); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 10px 16px 28px; transform: translateY(105%); transition: transform 0.25s ease-out; max-height: 88%; overflow-y: auto; visibility: hidden; }
.sheet.on { transform: none; visibility: visible; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 12px; }
.sheet h3 { font-size: 20px; font-weight: 600; margin: 4px 0 6px; overflow-wrap: anywhere; }

.toast { position: absolute; left: 16px; right: 16px; bottom: 24px; z-index: 30; background: var(--fg); color: var(--bg); border-radius: var(--r-ctl); padding: 6px 6px 6px 16px; display: none; align-items: center; gap: 8px; min-height: 56px; font-size: 15px; }
.toast.on { display: flex; }
.toast .grow { flex: 1; }
.toast button { min-height: 44px; min-width: 64px; border: 0; background: none; color: #ffb38a; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
:root[data-theme="dark"] .toast button { color: #a8461a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast button { color: #a8461a; } }

/* public preview (fixed public-site colours) */
.pub { background: #0f0d0b; color: #f6f1e7; margin: 0 -16px; min-height: 100%; }
.pub .cover { height: 220px; }
.pub .body { padding: 16px 16px 40px; }
.pub .pill { display: inline-block; border: 1px solid #776e60; border-radius: 999px; padding: 4px 10px; font-size: 13px; margin: 0 6px 6px 0; color: #f6f1e7; }
.pub .k { color: #b5ad9f; font-size: 15px; }
.pub .h { margin-top: 18px; font-weight: 600; }
.pub .gone { background: #5c1a14; color: #ffd9d3; border-radius: 12px; padding: 10px 14px; font-weight: 600; margin-bottom: 12px; }
.own { display: block; width: 100%; text-align: left; margin-top: 6px; border: 1px dashed #ffb38a; border-radius: 12px; background: none; color: #ffb38a; font: inherit; font-weight: 600; padding: 10px 14px; min-height: 52px; cursor: pointer; }
.own span { display: block; font-weight: 400; font-size: 13px; color: #d9cfc0; }
.previewbar { position: absolute; top: 0; left: 0; right: 0; z-index: 6; background: var(--gold); color: #1d0a03; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; font-weight: 600; font-size: 15px; }
.previewbar .grow { flex: 1; }
.previewbar button { min-height: 44px; border: 0; border-radius: 12px; background: #1d0a03; color: #fff; font: inherit; font-weight: 600; padding: 0 16px; cursor: pointer; }

.take { text-align: center; padding-top: 40px; }
.burst { width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 16px; background: radial-gradient(circle at 35% 35%, #ffb38a, #f0703a 60%, #a8461a); display: flex; align-items: center; justify-content: center; }
.quietspot { border: 1px dashed var(--line-strong); border-radius: var(--r-card); padding: 14px 16px; margin-top: 28px; }
.themebtn { position: fixed; right: 12px; top: 12px; z-index: 50; min-height: 44px; min-width: 44px; border-radius: 22px; border: 1px solid var(--line-strong); background: var(--card); color: var(--fg); font: inherit; font-size: 14px; padding: 0 14px; cursor: pointer; }
@media (max-width: 500px) { .themebtn { display: none; } }
</style>
</head>
<body>
<button class="themebtn" id="themebtn" type="button" aria-label="Switch light or dark">Light / dark</button>

<div class="phone" id="phone">
  <!-- Every screen is drawn by render() below from one data set and one label list. -->
  <section class="scr" id="s-welcome" data-tabs="0"></section>
  <section class="scr" id="s-invitee" data-tabs="0"></section>
  <section class="scr" id="s-home" data-tabs="1" data-tab="home"></section>
  <section class="scr" id="s-events" data-tabs="1" data-tab="events"></section>
  <section class="scr" id="s-stats" data-tabs="1" data-tab="stats"></section>
  <section class="scr" id="s-you" data-tabs="1" data-tab="you"></section>
  <section class="scr" id="s-event" data-tabs="0"></section>
  <section class="scr" id="s-alldates" data-tabs="0"></section>
  <section class="scr" id="s-lineup" data-tabs="0"></section>
  <section class="scr" id="s-move" data-tabs="0"></section>
  <section class="scr" id="s-where" data-tabs="0"></section>
  <section class="scr" id="s-pay" data-tabs="0"></section>
  <section class="scr" id="s-ticket" data-tabs="0"></section>
  <section class="scr" id="s-photo" data-tabs="0"></section>
  <section class="scr" id="s-team" data-tabs="0"></section>
  <section class="scr" id="s-preview" data-tabs="0" style="padding-top:56px;background:#0f0d0b"></section>
  <section class="scr" id="s-step" data-tabs="0"></section>
  <div class="bottombar" id="bb"></div>

  <nav class="tabs" id="tabs" aria-label="Main">
    <button data-tab-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Home</button>
    <button data-tab-go="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Events</button>
    <button data-tab-go="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Stats</button>
