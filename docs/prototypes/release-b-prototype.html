<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release B Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/* D1 prototype v2: organiser events area. Monzo layout, Ember #f0703a, Outfit, graphite ground. Phone 390x844 and a 1280x800 computer frame. Public screens use today's public look (black, amber, Inter): content only. Example data only. */
:root{
  --ground:#202226; --card:#2a2d32; --card-2:#33373d; --hair:#3d4148; --text:#f1f2f4; --mute:#a3a9b3;
  --acc:#f0703a; --acc-ink:#1d0a03; --acc-soft:rgba(240,112,58,.14); --ok:#3ecf8e; --ok-soft:rgba(62,207,142,.14); --ok-text:#7be6b4;
  --bad:#ff7a6b; --bad-soft:rgba(255,122,107,.14); --bad-ink:#2a0703;
  --font:"Outfit",system-ui,sans-serif; color-scheme:dark;
}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#17181b;color:var(--text);font-family:var(--font);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
::selection{background:var(--acc);color:var(--acc-ink)}
input,textarea{caret-color:var(--acc)}
*{scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{flex:none;display:block}

.page{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:1100px){.page{grid-template-columns:260px minmax(0,1fr);align-items:start}}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em;flex:1 1 auto}
.toggle{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;gap:4px}
.toggle button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:none;color:var(--mute);font:600 15px var(--font);cursor:pointer}
.toggle button[aria-pressed=true]{background:var(--text);color:#17181b}
.ghost{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:none;color:var(--text);font:600 14px var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.jump{width:100%;min-height:44px;background:var(--card);color:var(--text);border:1px solid var(--hair);border-radius:12px;padding:0 12px;font:600 15px var(--font)}
.idx{display:none}
@media(min-width:1100px){.idx{display:flex;flex-direction:column;gap:1px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}.jumpwrap{display:none}}
.idx h2{font-size:13px;color:var(--mute);margin:12px 10px 3px;font-weight:600}
.idx button{text-align:left;min-height:32px;padding:5px 10px;border-radius:10px;border:0;background:none;color:var(--text);font:500 14px var(--font);cursor:pointer}
.idx button:hover{background:var(--card)}
.idx button[aria-current=true]{background:var(--acc-soft);color:var(--acc)}
.hint{color:var(--mute);font-size:13px;margin:0;line-height:1.45}
.stage{position:relative;width:100%}

.dev{position:relative;overflow:hidden;background:var(--ground);border:1px solid var(--hair);display:flex;flex-direction:column}
.dev.ph{width:100%;max-width:390px;height:844px;margin:0 auto;border-radius:34px}
.dev.dk{width:1280px;height:800px;border-radius:18px;transform-origin:0 0;position:absolute;left:0;top:0}
.ex{position:absolute;top:8px;right:16px;font-size:11px;color:var(--mute);z-index:3;pointer-events:none}
.scroll{flex:1;overflow:auto;min-height:0}

.nav{display:flex;align-items:center;gap:12px;padding:16px 16px 4px}
.back{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--text);cursor:pointer;flex:none;display:grid;place-items:center}
.dots{flex:1;display:flex;gap:5px}.dots i{height:6px;flex:1;border-radius:9px;background:var(--card-2)}.dots i.on{background:var(--acc)}
.title{font:800 28px/1.1 var(--font);margin:16px 18px 16px;letter-spacing:-.025em;text-wrap:balance}
.sub{margin:-8px 18px 16px;color:var(--mute);font-size:15px}
.grp{margin:0 14px 14px;background:var(--card);border-radius:20px;padding:6px;display:flex;flex-direction:column;gap:6px}
.lab{margin:18px 22px 8px;font-weight:700;font-size:15px;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab .lk{background:none;border:0;color:var(--acc);font:700 15px var(--font);min-height:44px;cursor:pointer;padding:0 2px}
.cap{margin:4px 22px 8px;font-weight:600;font-size:14px;color:var(--mute)}
.mini{font-weight:600;font-size:13px;color:var(--mute);padding:4px 8px 0}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-radius:15px;border:0;background:var(--card-2);color:var(--text);font:600 16px var(--font);text-align:left;cursor:pointer;width:100%}
button.opt:hover{background:#3a3e45}
.opt .g{flex:1;min-width:0}.opt small{display:block;color:var(--mute);font-weight:400;font-size:14px;margin-top:2px}
.opt .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--hair);flex:none}
.opt[aria-pressed=true]{background:var(--acc);color:var(--acc-ink)}
.opt[aria-pressed=true] small{color:var(--acc-ink);opacity:.8}
.opt[aria-pressed=true] .tick{border-color:var(--acc-ink);background:radial-gradient(circle,var(--acc-ink) 40%,transparent 44%)}
.opt .go{color:var(--mute)}
.opt.line{justify-content:center;background:none;border:1.5px solid var(--hair)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.seg.five{grid-template-columns:repeat(5,minmax(0,1fr))}.seg.five .opt{font-size:14px;padding:8px 2px}.seg .opt{min-height:46px;justify-content:center;text-align:center;padding:8px 4px;font-size:15px}
.inp{width:100%;min-height:58px;background:var(--card-2);border:0;border-radius:15px;color:var(--text);padding:0 16px;font:700 20px var(--font)}
.inp.sm{min-height:50px;font:600 16px var(--font);border-radius:13px;padding:0 12px}
.inp::placeholder{color:#8b929c}
textarea.inp{padding:14px 16px;min-height:120px;font:500 16px/1.45 var(--font);resize:vertical}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:50px;padding:0 12px;border-radius:13px;background:var(--card-2);font-size:15px}
.kv .v{color:var(--mute);text-align:right}
.kv input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:600 16px var(--font);text-align:right;min-height:44px}
.kv input::placeholder{color:#8b929c}
.sel{appearance:none;background:none;border:0;color:var(--acc);font:700 16px var(--font);text-align:right;min-height:44px;padding:0 2px;cursor:pointer;font-variant-numeric:tabular-nums;max-width:62%}
.sel option{color:#111}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:6px 6px 6px 12px;font-size:14px;font-weight:600;margin:3px}
.chip.fixed{padding:6px 12px}
.chip button{background:none;border:0;color:inherit;min-width:28px;min-height:28px;cursor:pointer;display:grid;place-items:center}
.chip.soft{background:var(--card-2);color:var(--text)}
.chip.soft em{font-style:normal;color:var(--mute);font-weight:500}
.chips{padding:4px 6px}
.tog{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;margin:3px;border-radius:999px;border:1.5px solid var(--hair);background:none;color:var(--text);font:600 14px var(--font);cursor:pointer}
.tog[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.sess-h{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 0}
.sess-h b{font-size:15px}.sess-h button{background:none;border:0;color:var(--mute);font:600 14px var(--font);min-height:44px;cursor:pointer}
.add{margin:0 14px 14px;width:calc(100% - 28px);min-height:54px;border-radius:18px;border:1.5px dashed var(--hair);background:none;color:var(--text);font:700 16px var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.grp .add{margin:0;width:100%}
.add[disabled]{color:#8b929c;cursor:not-allowed}
.foot{padding:4px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.primary{min-height:56px;border-radius:999px;border:0;background:var(--acc);color:var(--acc-ink);font:800 18px var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 22px;transition:transform .15s cubic-bezier(.2,.8,.2,1),background-color .15s}
.primary:hover{background:#f6824f}.primary:active{transform:scale(.98)}
.primary[disabled]{background:var(--card-2);color:#8b929c;cursor:not-allowed;transform:none}
.primary.danger{background:var(--bad);color:var(--bad-ink)}
.primary.sm{min-height:44px;font-size:15px;padding:0 16px}
.quiet{min-height:44px;border:0;background:none;color:var(--mute);font:600 15px var(--font);cursor:pointer}
.quiet.danger{color:var(--bad)}
.reason{text-align:center;font-size:14px;color:var(--mute)}
.reason button{background:none;border:0;color:var(--acc);font:600 14px var(--font);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 10px;cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card-2);color:var(--mute);white-space:nowrap}
.tag.live{background:var(--ok-soft);color:var(--ok-text)}.tag.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.own{background:var(--acc-soft);color:var(--acc)}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:var(--ok);color:#06240f;z-index:20;white-space:nowrap;animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.toast.bad{background:var(--bad);color:var(--bad-ink)}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.dock{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:4px;background:linear-gradient(transparent,var(--ground) 30%);padding-top:18px}
.dock .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheetback{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:10;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:92%;overflow:auto;background:var(--ground);border-radius:26px 26px 0 0;padding-top:8px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.sheet .title{font-size:24px;margin-top:6px}
.flyer{aspect-ratio:4/5;max-height:300px;width:100%;border-radius:15px;display:grid;place-items:end start;padding:14px;color:#fff;font:800 22px/1.1 var(--font);text-shadow:0 1px 8px rgba(0,0,0,.4)}
.flyer.wide{aspect-ratio:16/9}
.f0{background:radial-gradient(circle at 70% 25%,#ffcf7a,transparent 50%),linear-gradient(160deg,#a8452a,#1d1416 80%)}
.f1{background:radial-gradient(circle at 25% 30%,#ffb35c,transparent 55%),linear-gradient(160deg,#6b2d7f,#191c2e 75%)}
.f2{background:radial-gradient(circle at 80% 70%,#ff8a5c,transparent 50%),linear-gradient(200deg,#1f5a5a,#141a22 80%)}
.f3{background:radial-gradient(circle at 30% 70%,#f5d06b,transparent 50%),linear-gradient(160deg,#2d3f7f,#14162a 80%)}
.f4{background:radial-gradient(circle at 60% 30%,#ff9f8a,transparent 50%),linear-gradient(160deg,#5c2a3d,#18141a 80%)}
.f5{background:radial-gradient(circle at 40% 25%,#ffd36b,transparent 45%),linear-gradient(160deg,#b0302a,#2a0f20 60%,#120b14)}
.f6{background:linear-gradient(160deg,#4a4f57,#24272c)}
.noflyer{display:grid;place-items:center;color:var(--mute);font:600 15px var(--font);background:var(--card-2);border:1.5px dashed var(--hair);text-shadow:none}
.map{height:120px;border-radius:15px;position:relative;background:repeating-linear-gradient(0deg,transparent 0 23px,var(--hair) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,var(--hair) 23px 24px),var(--card-2)}
.map i{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-22px 0 0 -11px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--acc);box-shadow:0 2px 6px rgba(0,0,0,.35)}
[data-in="nvpc"]{text-transform:uppercase}
.tnum{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1;border-radius:13px;position:relative}
.tile button{position:absolute;top:2px;right:2px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.tile.addt{border:1.5px dashed var(--hair);background:none;color:var(--text);display:grid;place-items:center;font:700 14px var(--font);cursor:pointer}
.prog{height:8px;border-radius:9px;background:var(--card-2);overflow:hidden}.prog i{display:block;height:100%;width:60%;background:var(--acc);border-radius:9px;animation:load 1.2s linear}
@keyframes load{from{width:5%}to{width:100%}}
.skel{background:linear-gradient(90deg,var(--card) 0,var(--card-2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:15px}
@keyframes sh{to{background-position:-200% 0}}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px 8px 8px;border-radius:15px;border:0;background:var(--card-2);color:var(--text);text-align:left;cursor:pointer;width:100%;font:600 16px var(--font)}
.row:hover{background:#3a3e45}
.row[aria-current=true]{box-shadow:inset 0 0 0 2px var(--acc)}
.row .thumb{width:48px;height:48px;border-radius:12px;flex:none}
.row .g{flex:1;min-width:0}.row .g b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.row small{display:block;color:var(--mute);font-weight:400;font-size:14px;margin-top:2px}
.row small.need{color:var(--acc);font-weight:600}
.empty{margin:0 14px;background:var(--card);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.empty b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.empty p{margin:0;color:var(--mute);font-size:16px}
.state{margin:0 14px 14px;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.state.need{box-shadow:inset 0 0 0 1.5px var(--acc)}
.state .hd{display:flex;gap:12px;align-items:flex-start}
.state .hd .ic{color:var(--acc);margin-top:2px}
.state b{display:block;font-size:17px;font-weight:700}
.state small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.state .acts{display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:13px;background:var(--card-2);border:0;color:var(--text);font:600 15px var(--font);text-align:left;width:100%;cursor:pointer}
.check .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--hair)}
.check.done{cursor:default;color:var(--mute)}.check.done .dot{background:var(--ok);border-color:var(--ok);color:#06240f}
.check .fix{color:var(--acc);font-weight:700}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--hair);flex:none;display:grid;place-items:center}
.cb.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.past{opacity:.6}

.dkapp{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%;min-height:0}
.dk-side{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;background:#1c1e21}
.dk-side .hdr{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 12px}
.dk-side .hdr b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.dk-main{position:relative;display:flex;flex-direction:column;min-height:0}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4px;align-items:start;padding:0 14px}
.cols>div>.grp,.cols>div>.state,.cols>div>.add{margin-left:0;margin-right:0}
.cols .lab{margin-left:8px;margin-right:8px}
.cols .flyer{max-height:220px;aspect-ratio:16/9}
.dkhead{display:flex;align-items:flex-end;gap:16px;padding:26px 28px 14px}
.dkhead .title{margin:0;font-size:34px}
.dkhead .sub{margin:6px 0 0}
.ebar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:0 14px 14px;scrollbar-width:none}.ebar::-webkit-scrollbar{display:none}
.ebar .tog{margin:0;flex:none}.ebar .ebl{display:inline-flex;align-items:center;gap:6px;color:var(--acc);font-weight:700;font-size:14px;flex:none;padding-left:6px}
.dkhead+.ebar{padding:0 28px 10px}
.tbtn{all:unset;cursor:pointer;display:inline-block;min-height:44px;border-radius:8px}.tbtn .ic{display:inline-block;color:var(--acc);vertical-align:-2px;margin-left:8px}.tbtn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.dkflow{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);height:100%;min-height:0}
.dkflow>.l{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--hair)}
.dkflow>.r{overflow:auto;padding:28px 40px;background:#1c1e21}
.pv{max-width:380px;margin:0 auto;background:var(--card);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pv h4{margin:6px 8px 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.m{color:var(--mute)}
.pvh{max-width:380px;margin:0 auto 12px;color:var(--mute);font-size:15px;font-weight:600}
.blank{display:grid;place-items:center;height:100%;color:var(--mute);text-align:center;padding:40px}
.dk .sheet{left:50%;right:auto;top:50%;bottom:auto;width:520px;transform:translate(-50%,-50%);border-radius:26px;max-height:88%;animation:fade .2s}
.dk .dock{left:auto;right:28px;width:420px;background:none;padding-top:0}
.dk .toast{bottom:40px}

/* Public side: today's public look (black, amber, Inter). Content only. */
.pub{background:#000;color:#fff;font-family:"Inter",system-ui,sans-serif;flex:1;overflow:auto;min-height:0}
.pub .note{margin:12px;padding:8px 12px;border-radius:10px;background:#212121;color:#aaa;font-size:12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.pub .note button{background:none;border:1px solid #333;color:#fff;border-radius:999px;min-height:36px;padding:0 12px;font:600 13px Inter,sans-serif;cursor:pointer}
.pub h2{font:900 26px/1.1 Inter,sans-serif;letter-spacing:-.03em;margin:12px 12px 4px}
.pub .meta{color:#aaa;font-size:13px;margin:0 12px 10px}
.pub .card{background:#121212;border:1px solid #333;border-radius:12px;margin:0 12px 10px;padding:12px}
.pub .card h3{margin:0 0 8px;font:700 14px Inter,sans-serif;color:#fff}
.pub .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid #212121}
.pub .ln:first-of-type{border-top:0}
.pub .ln span:last-child{color:#aaa;text-align:right}
.pub .amb{color:#ff9900;font-weight:700}
.pub .cx{color:#ff7a6b}
.pub .s{text-decoration:line-through;color:#777}
.pub .btn{display:flex;justify-content:center;align-items:center;min-height:44px;border-radius:999px;background:#ff9900;color:#000;font:700 14px Inter,sans-serif;margin-top:8px}
.pub .flyer{margin:0 12px;width:auto;max-height:200px;aspect-ratio:16/9;border-radius:12px;font-family:Inter,sans-serif}
.pub .pill{display:inline-block;background:#212121;color:#ddd;border-radius:999px;padding:4px 10px;font-size:12px;margin:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sbar{display:flex;justify-content:space-between;padding:12px 26px 0;font:600 13px var(--font);color:var(--text)}
.ico{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.row .act{flex:none}
.row .ghostb{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--hair);background:none;color:var(--text);font:700 14px var(--font);display:inline-flex;align-items:center}
.row .openb{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--acc);color:var(--acc-ink);font:800 14px var(--font);display:inline-flex;align-items:center}
.meter{display:flex;flex-direction:column;gap:8px;padding:6px 4px 2px}

<div class="page">
 <aside class="idx" id="idx" aria-label="Screens"></aside>
 <main style="display:flex;flex-direction:column;gap:12px;min-width:0">
  <div class="bar">
   <h1>Release B prototype</h1>
   <label class="hint" for="who" style="display:inline-flex;align-items:center;gap:6px">Who am I?<select id="who" class="jump" style="width:auto;min-width:170px"></select></label>
   <div class="toggle" role="group" aria-label="Screen size"><button type="button" data-mode="ph" aria-pressed="true">Phone</button><button type="button" data-mode="dk" aria-pressed="false">Computer</button></div>
   <button type="button" class="ghost" id="again">Start again</button>
  </div>
  <div class="jumpwrap"><label class="hint" for="jump" style="display:block;margin-bottom:4px">Jump to a screen</label><select id="jump" class="jump"></select></div>
  <p class="hint">Example people and data only. Nothing is saved anywhere. Words are taken from the built pages.</p>
  <div class="stage" id="stage"><div id="frame" class="dev ph"></div></div>
 </main>
</div>
<script>
/* ===== CORE: state machine, rendering helpers, invariants. Example data only. =====
   CONTRACT for screen modules (areas.js, account.js, dancer.js):
   - SCREENS[id] = { render(P, params) -> {html, foot?, nav?:false}, back?: (P,params)=>label|null, dk?: 'split'|'col' }
       html = content inside the scrolling body; foot = HTML for the fixed footer (.foot). Use helpers below.
   - ACT[name] = (arg, el) => void   wired by data-a="name" data-v="arg" on any <button>. Re-render is automatic.
   - INP[name] = (value, el) => void wired by data-i="name" data-v="arg" on <input>/<textarea>/<select> (input event).
       Give every input a stable data-k="unique-key" so focus + caret survive re-render.
   - go(id, params) pushes; back() pops (asks "Discard changes?" when the screen's dirty() says so); home(id, params) replaces the stack.
   - SCREENS[id].dirty?(P,params) -> bool: unsaved edits. Leaving runs the Discard sheet.
   - openSheet(id, params) / closeSheet(): SHEETS[id] = { render(P, params) -> html (title + body + .foot) }.
   - toast(text, bad?) shows one toast after the next render.
   - JUMPS.push({group, label, who, run(P)}) : jump-list entries; run() sets the person's state and calls home()/go()/openSheet().
   - Mark every save form's Save button with data-save="formId" and register FORMS[formId] = {dirty:(P)=>bool}.
   - Mark status words with data-st="dancer|organiser|teacher|dj" (text must equal statusOf(P, role).words).
   - The primary-action rule: at most ONE .primary in the top layer (sheet if open, else screen). Disabled ones count.
   - Every disabled control that cannot work gets a short .reason under it.
*/
'use strict';
const SCREENS = {}, SHEETS = {}, ACT = {}, INP = {}, FORMS = {}, JUMPS = [];
const S = { who: 'maria', mode: 'ph', stack: [], sheet: null, toast: null, people: {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (id, n = 20, st = '') => `<svg class="ic" width="${n}" height="${n}"${st ? ` style="${st}"` : ''} aria-hidden="true"><use href="#i-${id}"/></svg>`;
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const P = () => S.people[S.who];
const cur = () => S.stack[S.stack.length - 1] || { id: 'areas', params: {} };

/* ---------- helpers for markup ---------- */
const H = {
  title: (t, sub) => `<div class="title">${esc(t)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}`,
  lab: (t, link) => `<div class="lab">${esc(t)}${link || ''}</div>`,
  grp: inner => `<div class="grp">${inner}</div>`,
  btn: (cls, label, a, v, opt = {}) => `<button type="button" class="${cls}" data-a="${a}"${v != null ? ` data-v="${esc(v)}"` : ''}${opt.dis ? ' disabled' : ''}${opt.attr || ''}>${opt.raw ? label : esc(label)}</button>`,
  primary: (label, a, v, opt = {}) => H.btn('primary' + (opt.cls ? ' ' + opt.cls : ''), label, a, v, opt) + (opt.dis && opt.reason ? `<div class="reason">${esc(opt.reason)}</div>` : ''),
  quiet: (label, a, v, opt = {}) => H.btn('quiet' + (opt.cls ? ' ' + opt.cls : ''), label, a, v, opt),
  /* row(icon, title, sub(html), right(html), a, v, opt) */
  row: (o) => `<${o.a ? 'button type="button"' : 'div'} class="row"${o.a ? ` data-a="${o.a}"${o.v != null ? ` data-v="${esc(o.v)}"` : ''}` : ''}${o.cur ? ' aria-current="true"' : ''}>${o.lead || ''}<span class="g"><b>${esc(o.t)}</b>${o.sub || ''}</span>${o.right != null ? o.right : (o.a ? ic('go', 20, 'color:var(--mute)') : '')}</${o.a ? 'button' : 'div'}>`,
  icoTile: (id, off) => `<span class="ico"${off ? ' style="background:var(--card);color:var(--mute)"' : ''}>${ic(id, 24)}</span>`,
  small: (t, cls) => `<small${cls ? ` class="${cls}"` : ''}>${esc(t)}</small>`,
  empty: (b, p, act) => `<div class="empty"><b>${esc(b)}</b><p>${esc(p)}</p>${act || ''}</div>`,
  foot: inner => inner,
};

/* ---------- shared fact: status of a role (ONE mapping, used by every screen) ---------- */
const ROLE_NAMES = { dancer: 'Dancer', organiser: 'Organiser', teacher: 'Teacher', dj: 'DJ' };
const ROLE_ICONS = { dancer: 'dancer', organiser: 'org', teacher: 'teach', dj: 'dj' };
const ROLE_ORDER = ['dancer', 'organiser', 'teacher', 'dj'];
const leftWords = n => n === 1 ? '1 answer left' : `${n} answers left`;
/* answersLeft(P, role): number of open answers; filled by areas.js (teacher/dj) and dancer.js (dancer). */
const LEFT = {
  organiser: p => p.org.left,
  dancer: p => DANCER_LEFT(p),
  teacher: p => ROLE_LEFT(p, 'teacher'),
  dj: p => ROLE_LEFT(p, 'dj'),
};
let DANCER_LEFT = p => 0; /* replaced by dancer.js */
let ROLE_LEFT = (p, r) => 0; /* replaced by areas.js */
function held(p, role) {
  if (role === 'dancer') return !!p.hasProfile;
  if (role === 'organiser') return !!p.org.held;
  return !!p.areas[role].shown;
}
function statusOf(p, role) {
  if (!held(p, role)) {
    if ((role === 'teacher' || role === 'dj') && p.areas[role].declined) return { kind: 'declined', words: 'You said no' };
    return { kind: 'not-held', words: 'Not added' };
  }
  const n = LEFT[role](p);
  if (n === 0) return { kind: 'complete', words: 'Complete' };
  return { kind: 'to-finish', words: leftWords(n) };
}
const stCls = k => k === 'complete' ? 'ok' : k === 'to-finish' ? 'need' : '';
const stSmall = (p, role) => { const s = statusOf(p, role); return `<small class="${stCls(s.kind)}" data-st="${role}">${esc(s.words)}</small>`; };

/* ---------- navigation ---------- */
function go(id, params = {}) { S.stack.push({ id, params }); S.sheet = null; }
function home(id, params = {}) { S.stack = [{ id, params }]; S.sheet = null; }
function screenDirty() { const c = cur(); const sc = SCREENS[c.id]; return !!(sc && sc.dirty && sc.dirty(P(), c.params)); }
function back(force) {
  if (!force && screenDirty()) { openSheet('discard', { then: 'back' }); return; }
  const c = cur(); const sc = SCREENS[c.id];
  if (sc && sc.onLeave) sc.onLeave(P(), c.params);
  if (S.stack.length > 1) S.stack.pop(); else { const b = sc && sc.backTo && sc.backTo(P(), c.params); home(b || 'areas'); }
  S.sheet = null;
}
function openSheet(id, params = {}) { S.sheet = { id, params }; }
function closeSheet() { S.sheet = null; }
function toast(t, bad) { S.toast = { t, bad: !!bad }; }
/* leave(): navigate away from a dirty screen through the Discard sheet. fn runs after Discard. */
let PENDING = null;
function leave(fn) { if (screenDirty()) { PENDING = fn; openSheet('discard', { then: 'fn' }); } else fn(); }

ACT.back = () => back();
ACT.closeSheet = () => closeSheet();
ACT.go = v => { const [id, q] = String(v).split('|'); leave(() => go(id, q ? JSON.parse(q) : {})); };
ACT.home = v => { const [id, q] = String(v).split('|'); leave(() => home(id, q ? JSON.parse(q) : {})); };
ACT.keepEditing = () => { PENDING = null; closeSheet(); };
ACT.discard = () => {
  const c = cur(); const sc = SCREENS[c.id]; const then = S.sheet && S.sheet.params.then;
  if (sc && sc.discard) sc.discard(P(), c.params);
  closeSheet();
  if (then === 'fn' && PENDING) { const f = PENDING; PENDING = null; f(); } else back(true);
};
SHEETS.discard = { render: () => H.title('Discard changes?') + `<div class="foot">${H.primary('Keep editing', 'keepEditing')}${H.quiet('Discard', 'discard', null, { cls: 'danger' })}</div>` };

/* ---------- people ---------- */
const PEOPLE = {}; /* PEOPLE[id] = {label, make: () => personState}; modules add fields via MAKERS */
const MAKERS = []; /* (id, p) => void : each module fills its part of a fresh person */
function makePerson(id) { const p = { id }; MAKERS.forEach(m => m(id, p)); return p; }
function resetAll() { S.people = {}; Object.keys(PEOPLE).forEach(k => S.people[k] = makePerson(k)); }
function landing(p) { return PEOPLE[p.id].landing(p); }

/* ---------- render ---------- */
const $ = s => document.querySelector(s);
function frameHTML() {
  const p = P(), c = cur(), sc = SCREENS[c.id] || SCREENS.areas;
  const r = sc.render(p, c.params || {}) || {};
  const backLabel = sc.back ? sc.back(p, c.params || {}) : null;
  const nav = r.nav === false ? '' : (backLabel != null ? `<div class="nav"><button type="button" class="back" data-a="back" aria-label="Back to ${esc(backLabel)}">${ic('back')}</button><span class="m" style="font-weight:600">${esc(backLabel)}</span>${r.navRight || ''}</div>` : (r.navRight ? `<div class="nav"><span style="flex:1"></span>${r.navRight}</div>` : ''));
  let body;
  if (S.mode === 'dk' && sc.dk === 'split' && SCREENS.__side) {
    body = `<div class="dkflow"><div class="l"><div class="scroll">${SCREENS.__side(p, c)}</div></div><div class="r" style="padding:0;display:flex;flex-direction:column;min-height:0"><div class="scroll" data-scroll>${nav}${r.html || ''}</div>${r.foot ? `<div class="foot">${r.foot}</div>` : ''}</div></div>`;
  } else if (S.mode === 'dk') {
    body = `<div class="dkcol"><div class="scroll" data-scroll><div class="dkin">${nav}${r.html || ''}${r.foot ? `<div class="foot dkfoot">${r.foot}</div>` : ''}</div></div>${r.tabs || ''}</div>`;
  } else {
    body = `<div class="scroll" data-scroll>${nav}${r.html || ''}</div>${r.foot ? `<div class="foot">${r.foot}</div>` : ''}${r.tabs || ''}`;
  }
  let sheet = '';
  if (S.sheet && SHEETS[S.sheet.id]) sheet = `<div class="sheetback" data-a="closeSheet" aria-hidden="true"></div><div class="sheet" role="dialog" aria-modal="true" data-top>${SHEETS[S.sheet.id].render(p, S.sheet.params || {})}</div>`;
  const t = S.toast ? `<div class="toast${S.toast.bad ? ' bad' : ''}" role="status">${esc(S.toast.t)}</div>` : '';
  return `<div class="layer"${S.sheet ? ' inert' : ' data-top'}>${body}</div>${sheet}${t}`;
}
function render() {
  const fr = $('#frame'); if (!fr) return;
  const ae = document.activeElement, k = ae && ae.dataset && ae.dataset.k;
  const ss = ae && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  const sc = fr.querySelector('[data-scroll]'); const top = sc ? sc.scrollTop : 0; const sameScreen = fr.dataset.at === cur().id;
  fr.className = 'dev ' + (S.mode === 'dk' ? 'dk' : 'ph');
  fr.innerHTML = frameHTML();
  fr.dataset.at = cur().id;
  if (sameScreen) { const ns = fr.querySelector('[data-scroll]'); if (ns) ns.scrollTop = top; }
  if (k) { const el = fr.querySelector(`[data-k="${CSS.escape(k)}"]`); if (el) { el.focus(); if (ss && 'setSelectionRange' in el) { try { el.setSelectionRange(ss[0], ss[1]); } catch (e) { } } } }
  S.toast = null;
  fit(); syncChrome();
}
function fit() {
  const fr = $('#frame'), st = $('#stage'); if (!fr || !st) return;
  if (S.mode === 'dk') { const w = st.clientWidth; const s = Math.min(1, w / 1280); fr.style.transform = `scale(${s})`; st.style.height = (800 * s) + 'px'; }
  else { fr.style.transform = ''; st.style.height = ''; }
}
function syncChrome() {
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  const w = $('#who'); if (w) w.value = S.who;
  const j = $('#jump'); if (j && j.value !== S.jumpAt) j.value = S.jumpAt || '';
  document.querySelectorAll('.idx button[data-j]').forEach(b => b.setAttribute('aria-current', String(b.dataset.j === S.jumpAt)));
}

/* ---------- events ---------- */
function onClick(e) {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const f = ACT[el.dataset.a]; if (!f) { console.error('no action ' + el.dataset.a); return; }
  S.jumpAt = null; f(el.dataset.v, el); render();
}
function onInput(e) {
  const el = e.target.closest('[data-i]'); if (!el) return;
  const f = INP[el.dataset.i]; if (!f) { console.error('no input ' + el.dataset.i); return; }
  f(el.type === 'checkbox' ? el.checked : el.value, el); render();
}
function onKey(e) {
  if (e.key === 'Enter') { const el = e.target.closest('[data-enter]'); if (el && ACT[el.dataset.enter]) { e.preventDefault(); ACT[el.dataset.enter](el.dataset.v, el); render(); } }
  if (e.key === 'Escape' && S.sheet) { closeSheet(); render(); }
}
function jump(i) {
  const j = JUMPS[+i]; if (!j) return;
  resetAll(); S.who = j.who; S.sheet = null; S.stack = []; PENDING = null;

const fk = v => { const [r, key] = String(v).split('.'); return [r, key, P().areas[r].draft || draftOf(P(), r)]; };
INP.fieldSet = (val, el) => { const [r, key, d] = fk(el.dataset.v); d[key] = val; delete d._err[key]; };
INP.listType = (val, el) => { const [r, key, d] = fk(el.dataset.v); d._pend[key] = val; };
ACT.fieldYN = v => { const [k, w] = v.split('|'); const [r, key, d] = fk(k); const b = w === 'Yes'; d[key] = d[key] === b ? null : b; };
ACT.listDel = v => { const [k, i] = v.split('|'); const [r, key, d] = fk(k); d[key].splice(+i, 1); };
ACT.listAdd = v => { const [r, key, d] = fk(v); const f = FLAT(r).find(x => x.key === key); const t = (d._pend[key] || '').trim(); if (!t || listNote(f, d[key], t)) return; d[key].push(t); d._pend[key] = ''; };
ACT.saveDetails = r => {
  const p = P(), a = p.areas[r]; if (!isDirty(p, r)) return;
  const n = normal(r, a.draft), e = validate(r, n);
  if (Object.keys(e).length) { a.draft._err = e; return; }
  a.values = n; a.shown = true; a.draft = clone(n); a.draft._pend = {}; a.draft._err = {};
  toast('Saved');
};

/* ---------- the ONE strength mapping (mirror of the server's _dancer_strength_v1) ---------- */
function daStrength(pr) {
  const has = { first_name: daFilled(pr.fn), city: daFilled(pr.city), role: daFilled(pr.role), photo: daFilled(pr.photo), started_year: typeof pr.year === 'number', styles: pr.styles.length > 0, bio_social: daFilled(pr.bio) && (daFilled(pr.ig) || daFilled(pr.fb) || daFilled(pr.web)) };
  const req = has.first_name && has.city && has.role && has.photo;
  let pct = 10;
  ['first_name', 'city', 'role', 'photo'].forEach(k => { if (has[k]) pct += 15; });
  if (req) ['started_year', 'styles', 'bio_social'].forEach(k => { if (has[k]) pct += 10; });
  const missing = Object.keys(has).filter(k => !has[k]);
  return { pct, next: missing[0] || null, missing, complete: req };
}
function daNext(pr) {
  const st = daStrength(pr), step = st.next;
  if (!step) return null;
  let label = DA_STEP_LABEL[step], focus = DA_STEP_FOCUS[step] || null;
  if (step === 'bio_social') {
    const bio = daFilled(pr.bio), link = daFilled(pr.ig) || daFilled(pr.fb) || daFilled(pr.web);
    if (link && !bio) label = 'Add a short bio';
    if (bio && !link) { label = 'Add your Instagram, Facebook or website'; focus = 'ig'; }
  }
  return { step, label, focus };
}
function daNextLine(pr) {
  const t = daNext(pr); if (!t) return 'Your profile is complete.';
  const st = daStrength(pr);
  if (!['first_name', 'city', 'role', 'photo'].includes(t.step)) return `${t.label} towards 100%.`;
  const left = st.missing.filter(m => ['first_name', 'city', 'role', 'photo'].includes(m)).length;
  return left <= 1 ? `${t.label} to reach 70%.` : `${t.label} towards 70%.`;
}
DANCER_LEFT = p => p.dancer ? DA_REQ.filter(k => !daFilled(p.dancer.prof[k])).length : 0;
DANCER_CARD = p => {
  const pr = p.dancer ? p.dancer.prof : null;
  if (!pr) return { city: '', role: '', photo: false, missing: DA_REQ.map(k => DA_REQ_WORD[k]) };
  return { city: pr.city || '', role: daRole(pr.role), photo: daFilled(pr.photo), missing: DA_REQ.filter(k => !daFilled(pr[k])).map(k => DA_REQ_WORD[k]) };
};
/* after any save: a profile with the four required answers is a held dancer profile */
function daSync(p) {
  const pr = daProf(p);
  if (DANCER_LEFT(p) === 0) p.hasProfile = true;
  if (pr.fn) { p.first = pr.fn; p.name = [pr.fn, pr.sn].filter(Boolean).join(' '); }
}
const daPublicName = pr => { const n = [pr.fn, pr.hide ? '' : pr.sn].filter(daFilled).join(' '); return n || pr.dn || ''; };
const daOtherRoles = p => !!((p.org && p.org.held) || (p.areas && ((p.areas.teacher && p.areas.teacher.shown) || (p.areas.dj && p.areas.dj.shown))));

function daHero(p) {
  const d = daD$(p);
  if (d.err.nights) return daCard(`<small>Your next night</small><b style="font-size:20px">We couldn\u2019t load your nights.</b>${H.primary('Browse events', 'dExt', 'your city calendar')}`);
  const up = d.nights.filter(n => n.date && daDiff(n.date) >= 0 && n.active && (n.status === 'going' || n.status === 'interested')).sort((a, b) => a.date < b.date ? -1 : 1);
  const n = up[0];
  if (!n) return daCard(`<small>Your next night</small><b style="font-size:20px">No upcoming night yet.</b>${H.primary('Browse events', 'dExt', daProf(p).city ? 'the ' + daProf(p).city + ' calendar' : 'the parties list')}`);
  const k = daDiff(n.date), when = k === 0 ? 'tonight' : k === 1 ? 'tomorrow' : `in ${k} days`;
  return daCard(`<small style="font-weight:700;color:var(--acc)">Your next night \u00b7 ${when}</small><b style="font-size:22px">${esc(n.name)}</b><small>${esc([daDay(n.date), n.city, n.time, n.status === 'going' ? 'Going' : 'Interested'].filter(Boolean).join(' \u00b7 '))}</small>${H.primary('See event', 'dExt', 'the event page')}`, 'need');
}
function daNudge(p) {
  const d = daD$(p), seen = {};
  const c = d.nights.filter(n => n.date && n.status === 'going' && n.active && !n.fest && daDiff(n.date) <= -1 && daDiff(n.date) >= -7)
    .sort((a, b) => a.date < b.date ? 1 : -1).filter(n => { if (seen[n.s]) return false; seen[n.s] = 1; return true; })
    .filter(n => !d.votes[n.s]);
  const n = c[0]; if (!n) return '';
  return H.grp(H.row({ lead: H.icoTile('check'), t: daDiff(n.date) === -1 ? 'Rate last night' : `Rate ${daDay(n.date)}`, sub: H.small(`${n.name}. How was the dancing level?`), a: 'home', v: 'appNights|' + JSON.stringify({ focus: n.s }) }));
}
function daNumbers(p) {
  const d = daD$(p), s = d.stats;
  if (d.err.numbers) return daCard(`<b>We could not load your numbers. Check your connection and try again.</b><div class="acts">${daLine('Try again', 'dRetry', 'numbers')}</div>`);
  const detail = s.total === 0 ? (daProf(p).photo ? 'Share your page to get your first visitor.' : 'Add a photo and share your page.') : `${daNum(s.month)} in the last 30 days \u00b7 ${daNum(s.total)} in all`;
  const strip = (s.been === 0 && s.rated === 0) ? '' : `<div class="da-strip" style="padding:0 0 2px"><div><b>${daNum(s.been)}</b><span>Nights been to</span></div><div><b>${daNum(s.rated)}</b><span>Levels rated</span></div></div>`;
  return H.grp(`<button type="button" class="row" data-a="go" data-v="appPage" style="align-items:flex-start"><span class="g"><b style="white-space:normal">People who looked at your page this week</b><span class="da-big">${daNum(s.week)}</span><small>${esc(detail)}</small></span>${ic('go', 20, 'color:var(--mute)')}</button>${strip}`);
}
function daPartner(p) {
  const d = daD$(p), done = d.partner === 'done';
  return daCard(`<div><b>Partner search: coming soon</b><small>${done ? 'We\u2019ll let you know the moment partner search opens.' : 'Find someone to practise and dance with.'}</small></div><div class="acts">${daLine(done ? 'We\u2019ll tell you' : 'Tell me when it\u2019s ready', 'dPartner', null, { dis: done })}</div>${d.partnerErr ? `<div class="err" role="alert">${esc(d.partnerErr)}</div>` : ''}`);

function daWeek(p) {
  const d = daD$(p), city = daProf(p).city;
  let inner;
  if (!city) inner = `<p class="da-p">Add your city to see what\u2019s on near you. <button type="button" class="da-link" data-a="dEdit" data-v="city">Add my city</button></p>`;

  else {
    const ev = (DA_WEEK[city] || []).filter(e => !e.cancelled && daDiff(e.date) >= 0 && daDiff(e.date) <= 7).sort((a, b) => (a.date + a.time) < (b.date + b.time) ? -1 : 1).slice(0, 3);
    inner = ev.length ? ev.map(e => H.row({ lead: daDateBlock(e.date), t: e.name, sub: H.small(`${e.loc} \u00b7 ${e.time}`), a: 'dExt', v: 'the event page' })).join('') : `<p class="da-m">Nothing listed in your city this week yet.</p>`;
  }
  return H.lab('What\u2019s on this week') + H.grp(inner + daExt('Browse events \u2197', city ? 'the ' + city + ' calendar' : 'the parties list'));
}
function daDateBlock(iso) {

const DA_PILL = { going: ['Going', 'Went'], interested: ['Interested', 'Was interested'], not_going: ['Not going', 'Not going'], registered: ['Registered', 'Registered'], attended: ['Attended', 'Attended'], cancelled: ['Cancelled', 'Cancelled'] };
function daVote(p, n, focus) {
  const d = daD$(p), s = n.s, voted = d.votes[s], open = !voted || d.change[s], pick = d.held[s] || voted;
  if (!open) return `<div class="kv"><span>You said: ${esc(voted)}</span><button type="button" class="da-link" data-a="dVoteChange" data-v="${s}">Change</button></div>`;
  return `<div class="field"><label id="lv-${s}">What level was it?</label><div class="seg" role="radiogroup" aria-labelledby="lv-${s}">${DA_LEVELS.map(l => `<button type="button" class="opt" role="radio" aria-checked="${l === pick}" aria-pressed="${l === pick}" data-a="dVote" data-v="${s}|${esc(l)}">${esc(l)}</button>`).join('')}</div>`
    + (d.held[s] ? `<p class="da-m">Finish your profile to rate. Your answer is saved and will be sent when you finish. <button type="button" class="da-link" data-a="go" data-v="appWelcome">Finish my profile</button></p>` : '')
    + (d.voteErr[s] ? `<div class="err" role="alert">Couldn't save your answer. Please try again.</div>` : '') + `</div>`;
}
