<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ambassador banner, Option C, banner below the queue</title><style>
:root{--bg:#000;--card:#121212;--card2:#1e1e1e;--fg:#fff;--muted:#ababab;--line:#333;--amber:#ffa500;--red:#f87171;--r:12px}
*{box-sizing:border-box}html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}a{color:var(--amber)}
.sw{background:#1a1a2e;border-bottom:1px solid var(--line);padding:6px 12px;font-size:12px}
.sw summary{cursor:pointer;color:var(--muted);padding:4px 0}
.sw .row{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0;align-items:center}.sw .row b{color:var(--muted);font-weight:400;width:64px}
.sw button{background:#2a2a40;border:1px solid #44445f;border-radius:6px;padding:4px 8px;font-size:12px;color:#fff;min-height:28px}
.sw button.on{background:var(--amber);color:#000;border-color:var(--amber)}
.site{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);font-weight:700}
.site span{color:var(--muted);font-weight:400;font-size:12px}
.hd{padding:12px 12px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.hd h1{font-size:17px;margin:0;flex:1;line-height:1.2}.hd small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.count{background:var(--amber);color:#000;font-weight:700;border-radius:999px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.age-bar{padding:8px 12px;font-size:12px;color:var(--muted)}.age-bar b{color:var(--amber)}
ul.q{list-style:none;margin:0;padding:0 12px}
ul.q li{border-bottom:1px solid var(--line)}
.row-b{all:unset;box-sizing:border-box;width:100%;min-height:56px;display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.nm{font-size:14px;font-weight:600;margin:0}
.chip{display:inline-flex;border-radius:999px;font-size:12px;padding:2px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.org{color:#c4b5fd;border-color:#6d5bd0}.chip.ser{color:#5eead4;border-color:#14b8a6}.chip.old{color:var(--amber);border-color:var(--amber);font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}.facts dt{color:var(--muted);font-size:12px}.facts dd{margin:0}
.btn{min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff}
.btn.ok{background:var(--amber);color:#000;border-color:var(--amber)}.btn.no{border-color:var(--red);color:var(--red);background:transparent}.btn.ghost{background:transparent}
.acts{display:flex;gap:8px}.acts .btn{flex:1}
.main{padding:12px;display:flex;flex-direction:column;gap:12px;flex:1}
.bar{position:sticky;bottom:0;background:#0b0b0bf2;border-top:1px solid var(--line);padding:8px 12px}
/* the existing full banner (ProfileCompletionChrome) */
.bwrap{padding:12px 12px 0}
.ban{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px}
.ban .top{display:flex;align-items:flex-start;gap:12px}.ban .ic{color:var(--amber);font-size:18px;width:20px}
.ban .tx{flex:1;min-width:0}.ban .t{font-size:14px;font-weight:600;margin:0}.ban .b{font-size:13px;color:var(--muted);margin:0}
.x{margin:-8px -8px 0 0;width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--muted);font-size:18px;flex:none}
.ban .cta{margin:8px 0 0 32px}
.pill{display:inline-flex;min-height:44px;align-items:center;justify-content:center;border-radius:999px;background:var(--amber);color:#000;font-weight:600;padding:0 16px;text-decoration:none}
/* option B slim strip */
.strip{display:flex;align-items:center;min-height:44px;border-bottom:1px solid var(--line);background:var(--card);padding-left:12px}
.strip a{flex:1;min-width:0;display:flex;align-items:center;min-height:44px;color:#fff;text-decoration:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip a b{color:var(--amber);margin-left:6px}
.strip .x{margin:0}
.note{margin:12px;padding:8px 10px;border:1px dashed #555;border-radius:8px;color:var(--muted);font-size:12px}
.sheet-note{font-size:12px;color:var(--muted)}
</style></head><body><div id="root"></div><script>
const K="c",NAME="Option C, banner below the queue",BLURB="Full banner stays, but sits under the list and is gone from the review screen, so the queue is first on screen.";
const FULL='<section class="ban" data-testid="profile-completion-banner" aria-label="Your dancer profile is missing"><div class="top"><span class="ic" aria-hidden="true">&#9787;</span><div class="tx"><p class="t">Your dancer profile is missing</p><p class="b">Your account does not have a dancer profile yet. Message us and we&rsquo;ll set one up for you.</p></div><button class="x" data-a="dismiss" aria-label="Hide this reminder on this page">&times;</button></div><div class="cta"><a class="pill" href="#" onclick="return false">Message us on WhatsApp</a></div></section>',SLIM='<div class="strip" data-testid="profile-banner-slim"><a href="#" onclick="return false" aria-label="Dancer profile missing. Message us on WhatsApp">Dancer profile missing.<b>Message us</b></a><button class="x" data-a="dismiss" aria-label="Hide this reminder">&times;</button></div>';
const ITEMS=[["Thursday Bachata at The Lantern","ser",9],["Harbourside Dance Collective","org",6],["Sunday Social Sensual","ser",5],["The Annual Bristol Bachata Sensual and Dominican Social Weekender Warm-Up Series with Guest Teachers","ser",4],["Bristol Bachata Beginners","org",3],["Tuesday Improvers Class","ser",3],["Moonlight Moderna Crew","org",2],["Friday Latin Night","ser",2]];
let S={state:"none",screen:"list",page:"amb"};
try{if(localStorage.getItem("mock-banner-dismissed-"+K)==="1"&&K==="b")S.state="dismissed"}catch(e){}
const chip=(t,a)=>'<span class="chip '+t+'">'+(t==="ser"?"Series":"Organiser")+'</span><span class="chip'+(a>=7?" old":"")+'">'+(a>=7?"&#9888; ":"")+"Waiting "+a+" days</span>";
function banner(where){ // where: top | bottom | review
  if(S.state==="has")return "";if(S.state==="dismissed"&&S.page==="amb")return "";
  if(S.page==="other")return where==="top"?'<div class="bwrap">'+FULL+'</div>':"";
  if(K==="a")return "";
  if(K==="b")return where==="top"?SLIM:"";
  if(K==="c")return where==="bottom"?'<div class="bwrap" style="padding-bottom:12px">'+FULL+'</div>':"";
  return ""}
function list(){return '<div class="age-bar">Oldest waiting <b>9 days</b> &middot; oldest first</div><ul class="q">'+ITEMS.map((i,n)=>'<li><button class="row-b" data-a="open"><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span class="nm" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+i[0]+'</span><span style="display:flex;flex-wrap:wrap;gap:4px">'+chip(i[1],i[2])+'</span></span><span aria-hidden="true" style="color:var(--muted);font-size:18px;min-width:24px;text-align:center">&rsaquo;</span></button></li>').join("")+'</ul>'}
function review(){return '<div class="main"><button class="btn ghost" data-a="back" style="align-self:flex-start">&lsaquo; Back to the list</button><h2 class="nm" style="font-size:17px">Thursday Bachata at The Lantern</h2><div style="display:flex;gap:4px;flex-wrap:wrap">'+chip("ser",9)+'</div><p class="meta" style="margin:0">Submitted 9 days ago &middot; Bristol</p><dl class="facts"><dt>Organiser</dt><dd>Lantern Social</dd><dt>Next dates</dt><dd>Thursday 29 October<br>Thursday 5 November<br>Thursday 12 November<br><span class="meta">+ 10 more (13 in all)</span></dd><dt>Venue</dt><dd>The Lantern Rooms</dd><dt>Price</dt><dd>&pound;8</dd><dt>Flyer</dt><dd>Uploaded</dd></dl><a href="#" class="meta" style="min-height:44px;display:inline-flex;align-items:center">Preview public page &rarr;</a></div>'}
function render(){
 const sw='<details class="sw" open><summary>Mockup states (not part of the design)</summary><div class="row"><b>Account</b>'+[["none","No dancer profile"],["has","Has dancer profile"],["dismissed","Banner dismissed"]].map(s=>'<button data-s="'+s[0]+'" class="'+(S.state===s[0]?"on":"")+'">'+s[1]+'</button>').join("")+'</div><div class="row"><b>Screen</b>'+[["list","Queue list"],["review","Review screen"]].map(s=>'<button data-sc="'+s[0]+'" class="'+(S.screen===s[0]?"on":"")+'">'+s[1]+'</button>').join("")+'</div><div class="row"><b>Page</b>'+[["amb","/ambassador"],["other","Another page"]].map(s=>'<button data-p="'+s[0]+'" class="'+(S.page===s[0]?"on":"")+'">'+s[1]+'</button>').join("")+'</div><div class="row meta" style="color:var(--muted)">'+BLURB+'</div></details>';
 let body;
 if(S.page==="other")body='<div class="main"><h2 class="nm" style="font-size:17px">Any other page (e.g. Tonight)</h2><p class="meta" style="margin:0">Unchanged by this option: the full banner shows here for an account with no dancer profile.</p></div>';
 else if(S.screen==="list")body='<header class="hd"><h1>Pending review<small>Bristol &middot; '+NAME+'</small></h1><span class="count" aria-label="8 waiting">8</span></header>'+banner("mid")+list()+banner("bottom");
 else body='<header class="hd"><h1>Pending review<small>Bristol &middot; '+NAME+'</small></h1></header>'+banner("review")+review();
 const bar=(S.page==="amb"&&S.screen==="review")?'<div class="bar"><div class="acts"><button class="btn no">Reject</button><button class="btn ok">Approve</button></div></div>':"";
 document.getElementById("root").innerHTML='<div class="app">'+sw+'<div class="site">Bachata Calendar<span>signed in</span></div>'+banner("top")+body+bar+'</div>'}
document.addEventListener("click",e=>{
 const g=a=>e.target.closest("["+a+"]");
 if(g("data-s")){S.state=g("data-s").dataset.s;return render()}
 if(g("data-sc")){S.screen=g("data-sc").dataset.sc;return render()}
 if(g("data-p")){S.page=g("data-p").dataset.p;return render()}
 const b=g("data-a");if(!b)return;const a=b.dataset.a;
 if(a==="open")S.screen="review";if(a==="back")S.screen="list";
 if(a==="dismiss"){S.state="dismissed";if(K==="b")try{localStorage.setItem("mock-banner-dismissed-b","1")}catch(x){}}
 render()});
render();</script></body></html>
