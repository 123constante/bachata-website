<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Organiser Events A</title>
<!-- Organiser EVENTS tab, Option A: THE PICKED DESIGN (owner, 2026-11-12), fix round 1 applied.
     Base: organiser-option-a.html (owner pick): same tokens, fonts, role strip, Switch button, tab bar
     Home / Events / Tickets / Team. Light theme. Self-contained. Open #<shape> (list in SHAPES below), add &shot for
     a bare 390x844 frame. Option B (not picked) is frozen at its first-round state and is no longer rebuilt from this file. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f1ee; --fg:#1d1f24; --muted:#5d6068; --card:#ffffff; --line:#dedad4; --ink-soft:#ebe8e3; --bar:#1f5c7a;
  --danger:#b3261e; --on-danger:#ffffff; --ok:#1b6b3a; --draft:#8a5a00;
  --c-org:#1f5c7a; --c-teacher:#8a5a00; --c-dj:#5b3fa0; --c-dancer:#b02a5b;
  --f-display:'Bricolage Grotesque','Segoe UI',sans-serif; --f-body:'DM Sans','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);padding:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
button[disabled]{cursor:not-allowed}
.wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font:700 20px var(--f-display);margin:0}
.ctl{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--ink-soft);padding:3px;border-radius:10px}
.seg button{flex:1 1 30%;text-align:center;padding:9px 4px;border-radius:8px;font-size:13px;font-weight:600;min-height:44px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.frame{width:min(390px,100%);height:844px;flex:none;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.scroll>:first-child{margin-top:16px}
.cap{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.cap b{color:var(--fg)}
.r-org{--rc:var(--c-org)}.r-teacher{--rc:var(--c-teacher)}.r-dj{--rc:var(--c-dj)}.r-dancer{--rc:var(--c-dancer)}
.badge{width:var(--s,36px);height:var(--s,36px);border-radius:10px;background:var(--rc);color:#fff;display:inline-grid;place-items:center;font:700 13px var(--f-display);flex:none}
.idbar{display:flex;align-items:center;gap:8px;width:100%;background:var(--rc);color:#fff;padding:12px 16px;min-height:64px;flex:none}
.idbar .badge{background:rgba(0,0,0,.22)}
.idmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:44px;color:#fff}
.idtxt{display:flex;flex-direction:column;min-width:0;flex:1}
.idtxt small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idtxt b{font:700 17px/1.25 var(--f-display);overflow-wrap:anywhere}
.sw{font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.2);padding:0 12px;min-height:44px;min-width:44px;border-radius:999px;white-space:nowrap;flex:none}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);flex:none}
.tabs button{flex:1;text-align:center;padding:12px 2px 14px;font-size:13px;font-weight:600;color:var(--muted);border-top:3px solid transparent;margin-top:-1px;min-height:48px}
.tabs button[aria-current=true]{color:var(--fg);border-top-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.row[disabled] .t b{color:var(--muted)}
.row[disabled]>span[aria-hidden]{display:none}
.t{display:flex;flex-direction:column;flex:1;min-width:0}
.t b{font-size:15px;overflow-wrap:anywhere}.t span{font-size:13px;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);white-space:nowrap;flex:none}
.tag.live{color:var(--ok);border-color:var(--ok)}
.tag.draft{color:var(--draft);border-color:var(--draft)}
.tag.cx{color:var(--danger);border-color:var(--danger)}
h2{font:700 22px var(--f-display);margin:0;overflow-wrap:anywhere}
h3{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.btn{display:block;background:var(--fg);color:var(--bg);font-weight:600;border-radius:12px;padding:14px 16px;text-align:center;min-height:48px;width:100%}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.act{background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;border-radius:999px;padding:0 14px;min-height:44px;white-space:nowrap;flex:none;text-align:center}
.act.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn[disabled],.act[disabled]{background:var(--ink-soft);color:var(--muted);border:1px solid var(--line)}
.why{font-size:13px;color:var(--muted);margin:0}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;background:var(--ink-soft);border:1px solid var(--line)}
.banner.err{background:#fbeceb;border-color:#e7b9b5}
.skel{background:var(--ink-soft);border-radius:8px;height:14px}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);width:100%;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet .x{align-self:flex-end;font-weight:600;font-size:14px;padding:8px 4px;min-height:44px;min-width:44px;text-align:center}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;z-index:9}
body.shot{padding:0}
body.shot .wrap{max-width:none;gap:0}
body.shot .ctl,body.shot h1,body.shot .cap.foot{display:none}
body.shot .frame{width:390px;height:844px;border:0;border-radius:0}
body.full .frame{height:auto}
body.full .scroll{overflow:visible}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* events tab, shared */
.head{display:flex;align-items:center;gap:10px}
.head h2{flex:1}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px;font-size:15px}
.search::placeholder{color:var(--muted);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;font-weight:600}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ev{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;min-height:64px}
.ev+.ev{border-top:1px solid var(--line)}
.dt{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.dt small{font-size:12px;color:var(--muted);font-weight:600}
.dt b{font:700 20px var(--f-display)}
.ev.cxr .t b{text-decoration:line-through;text-decoration-thickness:1px}
.chk{width:44px;height:44px;flex:none;display:grid;place-items:center}
.chk i{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700;background:var(--card)}
.chk[aria-checked=true] i{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.bulkbar{flex:none;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.bulkbar .qa{display:flex;gap:8px}
.bulkbar .qa .act{flex:1}
.optrow{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.optrow+.optrow{border-top:1px solid var(--line)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--ink-soft);border:1px solid var(--line);position:relative;flex:none}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:var(--card);border:1px solid var(--line)}
.choice{display:flex;flex-direction:column;gap:2px;padding:14px;min-height:64px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.choice[aria-pressed=true]{border:2px solid var(--fg)}
.choice b{font-size:15px}.choice span{font-size:13px;color:var(--muted)}
.more{font-size:13px;color:var(--muted);text-align:center}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
/* ==LAYOUT CSS== */
/* the ONE pinned line: 44px button inside a 48px sticky strip, never more */
.needs{position:sticky;top:0;z-index:2;background:var(--bg);height:48px;padding:2px 0;margin:0 -16px !important;padding-left:16px;padding-right:16px;flex:none}
.needline{display:flex;align-items:center;gap:10px;width:100%;height:44px;border:2px solid var(--fg);border-radius:12px;background:var(--card);padding:0 12px;font-weight:600;font-size:14px}
.needline .dot{width:22px;height:22px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:12px;flex:none}
.needline .nl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{display:flex;align-items:baseline;gap:8px}
.grp h3{flex:1}
.grp span{font-size:13px;color:var(--muted)}
.ser .dt b{font-size:17px}
.ser .chev{font-size:13px;font-weight:600;color:var(--muted);flex:none}
.serin{border-top:1px solid var(--line);background:var(--bg);padding-left:12px}
.toggle{flex:none;display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.toggle .switch[aria-hidden]{pointer-events:none}
.toggle[aria-checked=true] .switch{background:var(--fg);border-color:var(--fg)}
.toggle[aria-checked=true] .switch::after{left:23px;border-color:var(--fg)}
/* ==/LAYOUT CSS== */
/* shared additions (fix round 1) */
.choice{flex-direction:row;align-items:flex-start;gap:12px}
.choice .ct{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:var(--card);flex:none;margin-top:1px;display:grid;place-items:center}
.choice[aria-checked=true]{border:2px solid var(--fg)}
.choice[aria-checked=true] .rd{border-color:var(--fg)}
.choice[aria-checked=true] .rd::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--fg)}
.sent{font-size:13px;font-weight:600;color:var(--ok);white-space:nowrap;flex:none;padding:0 4px}
.row.del b{color:var(--danger)}
.btn.dangeralt{background:var(--card);color:var(--danger);border:1px solid var(--danger)}
.banner.ok{background:#e8f2ec;border-color:#a9cdb7}
.skip .t span{color:var(--muted)}
.viewnote{font-size:13px;color:var(--muted);font-weight:600;flex:none;max-width:120px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">Option A</h1>
  <div class="ctl">
    <span class="lbl">Shape</span>
    <div class="seg" id="shseg"></div>
    <span class="lbl">Seat</span>
    <div class="seg" id="seseg"></div>
  </div>
  <div class="frame" id="frame"></div>
  <p class="cap foot" id="foot"></p>
</div>
<script>
// Every name, date and number here is an example, shaped by the prod survey in organiser-events.md.
// TODAY is Thu 12 Nov 2026 (London).
const TODAY='2026-11-12';
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dOf=iso=>new Date(iso+'T12:00:00Z');
const addD=(iso,n)=>{const d=dOf(iso);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((dOf(b)-dOf(a))/864e5);
const dw=iso=>DOW[dOf(iso).getUTCDay()],dd=iso=>dOf(iso).getUTCDate(),dm=iso=>MON[dOf(iso).getUTCMonth()];
const longD=iso=>`${dw(iso)} ${dd(iso)} ${dm(iso)}`;
const fmt=n=>n.toLocaleString('en-GB');
const plural=(n,a,b)=>fmt(n)+' '+(n===1?a:(b||a+'s'));
const andList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
let NID=0;
// st: live | draft | cx | past. rec: series key (a repeating series) or null (one-off).
// A draft carries miss: what it still needs before it can go live. A cancelled night carries why + on (when people were told).
const CXW={why:'Venue problem',on:'2026-11-09'};
const N=(s,d,t,st,o={})=>({id:'n'+(++NID),s,d,t,st:st==='live'&&d<TODAY?'past':st,go:0,photo:true,...(st==='cx'?CXW:{}),...o});
function weekly(key,s,start,count,t,o={},skip={}){
  const out=[];for(let i=0;i<count;i++){const d=addD(start,7*i);out.push(N(s,d,t,skip[i]||'live',{rec:key,idx:i+1,of:count,...(o[i]||{})}))}return out;
}
const SERIES={fri:{n:'Friday Social',rule:'every Friday'},sun:{n:'Sunday Sensual Social',rule:'every Sunday'},wed:{n:'Wednesday Class and Social',rule:'every Wednesday'},thu:{n:'Thursday Bachata Lab',rule:'every Thursday'}};
// Fresh copies every time a shape opens, so a prototype cancel or delete never leaks into another shape.
function shapeData(){
  NID=0;
  const three=[N('Friday Social','2026-11-13','8pm','live',{go:12}),N('Sunday Workshop','2026-11-15','3pm','live',{go:3}),N('Winter Gala','2026-12-05','9pm','live',{photo:false})];
  const mixed=[N('Friday Social','2026-10-30','8pm','live',{go:9}),N('Friday Social','2026-11-06','8pm','live',{go:14}),N('Sunday Workshop','2026-11-08','3pm','live',{go:4}),
    N('Friday Social','2026-11-13','8pm','live',{go:12}),N('Sunday Workshop','2026-11-15','3pm','live',{go:3,photo:false}),N('Saturday Social','2026-11-21','9pm','cx',{go:5}),
    N('New Year&rsquo;s Eve Social','2026-12-31','9pm','draft',{photo:false,miss:['a place']})];
  const rec=[...weekly('fri','Friday Social','2026-11-13',13,'8pm',{0:{go:12},1:{go:5},2:{t:'9pm',changed:'Starts 9pm this week'},6:{go:2}},{5:'cx'}),N('Sunday Workshop','2026-11-15','3pm','live',{go:3})];
  const allcx=[N('Friday Social','2026-11-06','8pm','live',{go:6}),N('Friday Social','2026-11-13','8pm','cx',{go:12}),N('Friday Social','2026-11-20','8pm','cx',{go:4}),N('Winter Gala','2026-12-05','9pm','cx')];
  const huge=[...weekly('sun','Sunday Sensual Social','2026-11-15',56,'7pm',{0:{go:1204},1:{go:880}},{9:'cx'}),...weekly('fri','Friday Social','2026-11-13',52,'8pm',{0:{go:415}},{20:'cx'}),
    ...weekly('wed','Wednesday Class and Social','2026-11-18',52,'7pm',{0:{go:61}},{30:'cx',31:'cx'}),...weekly('thu','Thursday Bachata Lab','2026-11-12',52,'7:30pm'),
    N('London Bachata Weekender, three rooms and a live band on the Saturday','2027-03-12','6pm','live',{go:310}),N('Summer Boat Party','2027-07-04','6pm','draft',{photo:false,miss:['a place']}),N('Halloween Social','2027-10-31','9pm','draft',{photo:false,miss:['a place','a photo']})];
  for(let i=1;i<=93;i++)huge.push(N('Sunday Sensual Social',addD('2026-11-08',-7*(i-1)),'7pm','past',{rec:'sun'}));
  // ids restart per shape: n1 is each shape's first night
  for(const L of [three,mixed,rec,allcx,huge])L.forEach((x,i)=>{x.id='n'+(i+1)});
  return {three,mixed,rec,allcx,huge};
}
const BIG='The Sunday Sensual Bachata Social and Workshop Weekender Collective';
const SHAPES={
 empty:{lab:'No events',page:'Ritmo Bristol'},
 three:{lab:'3 upcoming',data:'three'},
 huge:{lab:'100+ grouped',page:BIG,data:'huge'},
 series:{lab:'Series open',page:BIG,data:'huge',st:{open:['fri|2026-11']}},
 hugeflat:{lab:'100+ ungrouped',page:BIG,data:'huge',st:{group:false}},
 allcx:{lab:'All cancelled',data:'allcx'},
 mixed:{lab:'Mixed',data:'mixed'},
 needs:{lab:'Needs you list',data:'mixed',sheet:'needs'},
 draft:{lab:'Draft night',data:'mixed',sheet:'night',of:'n7'},
 told:{lab:'Tell us sent',data:'mixed',sheet:'night',of:'n4',st:{told:['Guest list']}},
 deldraft:{lab:'Delete draft',data:'mixed',sheet:'del',of:'n7'},
 cxnight:{lab:'Cancelled night',data:'mixed',sheet:'night',of:'n6'},
 pastnight:{lab:'Past night',data:'mixed',sheet:'night',of:'n2'},
 recurring:{lab:'Edit scope',data:'rec',sheet:'scope',of:'n2',st:{scope:'all'}},
 cancelrec:{lab:'Cancel repeating',data:'rec',sheet:'cancel',of:'n2',st:{cscope:'after'}},
 bulk:{lab:'Bulk select',data:'rec',sel:['n1','n2','n4']},
 bulkcancel:{lab:'Bulk cancel',data:'mixed',sel:['n3','n4','n5','n6','n7'],sheet:'cancel',of:'bulk',st:{pastOpen:true}},
 cancel:{lab:'Cancel',data:'three',sheet:'cancel',of:'n1'},
 aftercancel:{lab:'After cancel',data:'three',pre:()=>doCancel(['n1'],'Venue problem')},
 contributor:{lab:'Contributor',data:'mixed',seat:'contributor'},
 contribneeds:{lab:'Contributor list',data:'mixed',seat:'contributor',sheet:'needs'},
 loading:{lab:'Loading'},
 error:{lab:'Error'}
};
const SEATS={owner:'Owner',manager:'Manager',contributor:'Contributor'};
const OWNER='Maria';
const S={shape:'three',seat:'owner',ns:[],sheet:null,of:null,sel:null,q:'',f:'all',limit:15,pastOpen:false,scope:null,cscope:null,reason:null,tab:'events',group:null,open:[],told:[],done:null};
const $=q=>document.querySelector(q);
const cur=()=>SHAPES[S.shape];
const viewOnly=()=>S.seat==='contributor';
const VIEW_WHY=`You are a contributor, so you can see every event but not change them. Ask ${OWNER} (owner) or a manager.`;
// THE one story for a cancelled night. Cancel sheet, row, night sheet, Needs you and the after-cancel banner all use it.
const CX_STORY=n=>`${n===1?'It stays':'Each night stays'} on the calendar marked <b>Cancelled</b>, so nobody turns up.`;
const byId=id=>S.ns.find(x=>x.id===id);
const upcoming=ns=>ns.filter(x=>x.st!=='past').sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
const pastOf=ns=>ns.filter(x=>x.st==='past').sort((a,b)=>a.d<b.d?1:-1);
const STATUS={live:['live','Live'],draft:['draft','Draft'],cx:['cx','Cancelled'],past:['','Past']};
const tag=x=>`<span class="tag ${STATUS[x.st][0]}">${STATUS[x.st][1]}</span>`;
const away=x=>{const n=dayDiff(TODAY,x.d);return n===0?'Today':n===1?'Tomorrow':n>0&&n<14?`In ${n} days`:''};
const missOf=x=>andList(x.miss||[]);
function subLine(x){
  const p=[x.t];
  if(x.rec)p.push(`${SERIES[x.rec].rule}, ${x.idx} of ${x.of}`);
  if(x.changed)p.push(x.changed);
  if(x.st==='cx')p.push(x.go?`${plural(x.go,'person','people')} told`:'no one to tell');
  else if(x.st==='draft'&&x.miss)p.push(`needs ${missOf(x)}`);
  else if(x.go)p.push(`${fmt(x.go)} going`);
  return p.join(' &middot; ');
}
// THE one row: date block or checkbox, name, sub line, status tag.
function evRow(x){
  const sel=S.sel;
  const lead=sel?`<span class="chk" role="checkbox" aria-checked="${sel.includes(x.id)}" aria-label="Select ${x.s}, ${longD(x.d)}"><i>${sel.includes(x.id)?'&check;':''}</i></span>`:`<span class="dt" aria-hidden="true"><small>${dw(x.d)}</small><b>${dd(x.d)}</b></span>`;
  return `<button class="ev ${x.st==='cx'?'cxr':''}" data-act="${sel?'pick':'night'}" data-k="${x.id}" aria-label="${x.s}, ${longD(x.d)}, ${STATUS[x.st][1]}">${lead}<span class="t"><b>${x.s}</b><span>${sel?longD(x.d)+' &middot; ':''}${subLine(x)}</span></span>${tag(x)}</button>`;
}
// THE "Needs you" list. Only real, actionable things; each has one button that exists. Draft copy names what is missing.
function needsOf(ns){
  const out=[],up=upcoming(ns);
  const drafts=up.filter(x=>x.st==='draft');
  if(drafts.length===1)out.push({k:'draft',t:`${drafts[0].s} is still a draft`,d:`It needs ${missOf(drafts[0])} before it can go live. Only your team sees it.`,b:'Finish',of:drafts[0].id});

  else if(a==='clearq'){S.q='';S.f='all'}
  else if(a==='more')S.limit+=30;
  else if(a==='past')S.pastOpen=!S.pastOpen;
  else if(a==='needs'){S.sheet='needs'}
  else if(a==='group'){S.group=!groupOn();S.limit=15}
  else if(a==='ser'){S.open=S.open.includes(k)?S.open.filter(i=>i!==k):[...S.open,k]}
  else if(a==='done'){S.done=null}
  else if(a==='need'){if(k){S.sheet='night';S.of=k}}
  else if(a==='new'){toast('Opens New event (the existing create flow)');return}
  else if(a==='tell'){S.told=[...S.told,k]}
  else if(a==='retry')setShape('three');
  else if(a==='tab'){if(k!=='events'){toast(k==='tickets'?'Opens the Tickets tab (separate design)':'Prototype: only Events is drawn');return}}
  else if(a==='stub'){toast(k+': not drawn in this prototype');return}
  render();
});
// ==LAYOUT==
// OPTION A (picked): date-grouped list, ONE pinned "N things need you" line, repeating events folded when big.
const LAYOUT={title:'Option A (picked): one list by date',
 foot:'<b>Option A, one list by date.</b> Every night of every event sits in one list, grouped by when it happens. One pinned line says how many things need you and opens the full list. From about 30 upcoming nights, repeating events fold into one row per month (&ldquo;Nov: 3 of 52&rdquo;); a switch turns that off. Past nights fold away at the bottom. Every name and number is an example.'};
const GROUP_FROM=30;
const groupOn=()=>S.group!==null?S.group:upcoming(S.ns).length>=GROUP_FROM;
function groupOf(x,months){
  const y=dOf(x.d).getUTCFullYear(),mon=MONL[dOf(x.d).getUTCMonth()]+(y!==2026?' '+y:'');
  if(months)return mon;
  const n=dayDiff(TODAY,x.d),wd=(dOf(TODAY).getUTCDay()+6)%7,toSun=6-wd;
  if(n<=toSun)return 'This week';
  if(n<=toSun+7)return 'Next week';
  return mon;
}
// The ONE pinned line: 48px at most. Tap opens the full list in a sheet.
function needsLine(ns){
  const n=needsOf(ns).length;
  if(!n)return '';
  const txt=viewOnly()?`${plural(n,'thing')} ${OWNER} needs to finish`:`${plural(n,'thing')} ${n===1?'needs':'need'} you`;
  return `<section class="needs" aria-label="Needs you"><button class="needline" data-act="needs" aria-haspopup="dialog"><span class="dot" aria-hidden="true">${n}</span><span class="nl">${txt}</span><span aria-hidden="true">See &rsaquo;</span></button></section>`;
}
// One row per repeating event per month: "Friday Social, every Friday, Nov: 3 of 52". Opens to show those dates.
function serRow(it){
  const x0=it.ns[0],se=SERIES[it.rec],cx=it.ns.filter(y=>y.st==='cx').length,open=S.open.includes(it.k),nx=it.ns.find(y=>y.st==='live');
  return `<button class="ev ser" data-act="ser" data-k="${it.k}" aria-expanded="${open}" aria-label="${se.n}, ${plural(it.ns.length,'date')} in ${MONL[dOf(x0.d).getUTCMonth()]}"><span class="dt" aria-hidden="true"><small>${dw(x0.d)}</small><b>${dd(x0.d)}</b></span><span class="t"><b>${se.n}</b><span>${se.rule} &middot; ${dm(x0.d)}: ${it.ns.length} of ${x0.of}${cx?` &middot; ${cx} cancelled`:''}${nx&&nx.go?` &middot; <span style="white-space:nowrap">${fmt(nx.go)} going ${dw(nx.d)} ${dd(nx.d)}</span>`:''}</span></span><span class="chev">${open?'Hide &#9652;':'Dates &#9662;'}</span></button>${open?`<div class="serin">${it.ns.map(evRow).join('')}</div>`:''}`;
}
function eventsBody(ns){
  const inSel=!!S.sel,v=viewOnly();
  const counts=Object.fromEntries(FILTERS.map(f=>[f[0],f[0]==='all'?ns.length:ns.filter(x=>x.st===f[0]).length]));
  const big=ns.length>=8;
  const r=filtered(ns),up=upcoming(r),past=pastOf(r),allUp=upcoming(ns);
  const hasRec=allUp.some(x=>x.rec)&&allUp.length>=8;
  const plain=S.f==='all'&&!S.q.trim()&&!inSel;
  const fold=hasRec&&groupOn()&&plain;
  const head=`<div class="head"><h2>Events</h2>${inSel?'':`${!v&&ns.length>1?'<button class="act alt" data-act="select">Select</button>':''}${newBtn()}`}</div>`;
  let list='';
  if(!up.length&&!past.length)list=noMatch();
  else{
    // items: a night, or (folded) one repeating event in one month
    const items=[],seen={};
    for(const x of (S.f==='past'?[]:up)){
      if(fold&&x.rec){const k=x.rec+'|'+x.d.slice(0,7);if(seen[k]){seen[k].ns.push(x);continue}seen[k]={k,rec:x.rec,ns:[x],d:x.d};items.push(seen[k])}
      else items.push({x,d:x.d});
    }
    const shown=items.slice(0,S.limit);
    let g='',open=false,nShown=0;
    for(const it of shown){
      const x=it.x||it.ns[0],gn=groupOf(x,fold);
      if(gn!==g){if(open)list+='</div>';const c=up.filter(y=>groupOf(y,fold)===gn).length;list+=`<div class="grp"><h3>${gn}</h3><span>${plural(c,'night')}</span></div><div class="card">`;g=gn;open=true}
      list+=it.x?evRow(it.x):serRow(it);nShown+=it.x?1:it.ns.length;
    }
    if(open)list+='</div>';
    if(S.f!=='past')list+=moreBtn(nShown,up.length,`${Math.min(30,items.length-shown.length)} more ${fold?'rows':'nights'}`);
    if(past.length){
      const po=S.pastOpen||S.f==='past';
      list+=`<button class="btn alt" data-act="past" aria-expanded="${po}">${po?'Hide':'Show'} past nights (${fmt(past.length)})</button>`;
      if(po)list+=`<div class="card">${past.slice(0,S.f==='past'?S.limit:10).map(evRow).join('')}</div>${S.f==='past'?moreBtn(Math.min(S.limit,past.length),past.length,'30'):past.length>10?'<p class="more">Filter by Past to see all of them.</p>':''}`;
    }
  }
  const tools=big?`${searchBox(ns)}<div class="chips" role="group" aria-label="Show">${FILTERS.filter(f=>f[0]==='all'||counts[f[0]]).map(f=>`<button class="chip" data-act="filter" data-k="${f[0]}" aria-pressed="${S.f===f[0]}">${f[1]} ${fmt(counts[f[0]])}</button>`).join('')}</div>`:'';
  const toggle=hasRec&&!inSel?`<button class="toggle" role="switch" data-act="group" aria-checked="${groupOn()}"><span class="t"><b>Group repeating events</b><span>${!plain&&groupOn()?'Off while you search or filter, so every night shows.':groupOn()?'One row per event per month. Tap a row for its dates.':'Every date shows on its own row.'}</span></span><span class="switch" aria-hidden="true"></span></button>`:'';
  const recs=[...new Set(allUp.filter(x=>x.rec&&x.st==='live').map(x=>x.rec))];
  const serPick=inSel&&recs.length?`<div class="chips" role="group" aria-label="Select a whole series">${recs.map(rk=>{const ids=allUp.filter(x=>x.rec===rk&&x.st==='live').map(x=>x.id),on=ids.every(i=>S.sel.includes(i));return `<button class="chip" data-act="selser" data-k="${rk}" aria-pressed="${on}">${on?'&check; ':''}All of ${SERIES[rk].n} (${fmt(ids.length)})</button>`}).join('')}</div>`:'';
  const hint=inSel?`<p class="why">Tap nights to select them, or pick a whole series. The bar at the bottom shows what you can do with them.</p>`:'';
  const done=S.done?`<div class="banner ok" role="status" style="display:flex;gap:10px;align-items:flex-start"><span style="flex:1">${S.done}</span><button class="act alt" data-act="done">OK</button></div>`:'';
  return `${needsLine(ns)}${head}${done}${viewLine()}${hint}${serPick}${tools}${toggle}${list}`;
}
// ==/LAYOUT==
(function init(){
  const h=new URLSearchParams(location.hash.slice(1));
  setShape('three');
  for(const k of h.keys())if(SHAPES[k])setShape(k);
  if(h.get('seat')&&SEATS[h.get('seat')])S.seat=h.get('seat');
  if(h.has('shot'))document.body.classList.add('shot');
  if(h.has('full'))document.body.classList.add('full');
  render();
})();
</script>
</body>
