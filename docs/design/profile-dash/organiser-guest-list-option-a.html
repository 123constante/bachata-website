<!-- GENERATED by tools/guest-build.mjs from tools/guest-src/ (edit there). Organiser Guest list tab option A (admin #1535 follow-up).
     Tokens, fonts, strip and tabs from organiser-events-option-a.html. Open #<shape> (entry entrysheet off empty normal huge full closed door past cancelled contributor loading error teamonly dancer dancerin); add &shot for a bare 390x844
     frame; &sheet=add|settings|link|qr, &sheet=person&of=N, &sheet=remove&of=N; &view=names|door|settings (B); &v=team (privacy variant). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f1ee; --fg:#1d1f24; --muted:#5d6068; --card:#ffffff; --line:#dedad4; --ink-soft:#ebe8e3; --bar:#1f5c7a;

  --f-display:'Bricolage Grotesque','Segoe UI',sans-serif; --f-body:'DM Sans','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);padding:16px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
button[disabled]{cursor:not-allowed}
.wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.ctl{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--ink-soft);padding:3px;border-radius:10px}
.seg button{flex:1 1 30%;text-align:center;padding:9px 4px;border-radius:8px;font-size:13px;font-weight:600;min-height:44px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.frame{width:min(390px,100%);height:844px;flex:none;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
.cap{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.cap b{color:var(--fg)}
.r-org{--rc:var(--c-org)}.r-teacher{--rc:var(--c-teacher)}.r-dj{--rc:var(--c-dj)}.r-dancer{--rc:var(--c-dancer)}
.badge{width:var(--s,36px);height:var(--s,36px);border-radius:10px;background:var(--rc);color:#fff;display:inline-grid;place-items:center;font:700 13px var(--f-display);flex:none}
.idbar{display:flex;align-items:center;gap:8px;width:100%;background:var(--rc);color:#fff;padding:12px 16px;min-height:64px;flex:none}
.idbar .badge{background:rgba(0,0,0,.22)}
.idmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:44px;color:#fff}

.sw{font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.2);padding:0 12px;min-height:44px;min-width:44px;border-radius:999px;white-space:nowrap;flex:none}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);flex:none}
.tabs button{flex:1;text-align:center;padding:12px 2px 14px;font-size:13px;font-weight:600;color:var(--muted);border-top:3px solid transparent;margin-top:-1px;min-height:48px}
.tabs button[aria-current=true]{color:var(--fg);border-top-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.t{display:flex;flex-direction:column;flex:1;min-width:0}
.t b{font-size:15px;overflow-wrap:anywhere}.t span{font-size:13px;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted);white-space:nowrap;flex:none}
.tag.cx{color:var(--danger);border-color:var(--danger)}
h2{font:700 22px var(--f-display);margin:0;overflow-wrap:anywhere}
h3{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.btn{display:block;background:var(--fg);color:var(--bg);font-weight:600;border-radius:12px;padding:14px 16px;text-align:center;min-height:48px;width:100%}
.btn.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.act{background:var(--fg);color:var(--bg);font-weight:600;font-size:13px;border-radius:999px;padding:0 14px;min-height:44px;white-space:nowrap;flex:none}
.act.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn[disabled],.act[disabled],.qa button[disabled]{background:var(--ink-soft);color:var(--muted);border:1px solid var(--line)}
.why{font-size:13px;color:var(--muted);margin:0}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45;background:var(--ink-soft);border:1px solid var(--line)}
.banner.err{background:#fbeceb;border-color:#e7b9b5}
.qa{display:flex;gap:8px}
.qa button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600;font-size:13px;text-align:center;padding:0 6px}
.skel{background:var(--ink-soft);border-radius:8px;height:14px}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);width:100%;max-height:86%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet .x{align-self:flex-end;font-weight:600;font-size:14px;padding:8px 4px;min-height:48px;min-width:44px;text-align:center}
.capbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;z-index:9}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.shot{padding:0}
body.shot .wrap{max-width:none;gap:0}
body.shot .ctl,body.shot h1,body.shot .cap.foot{display:none}
body.shot .frame{width:390px;height:844px;border:0;border-radius:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
body.full .frame{height:auto}
body.full .scroll{overflow:visible}
.why.hd{font-size:14px;color:var(--muted)}
/* Guest-list additions (same tokens as organiser-events-option-a.html). */
.back{font-weight:600;font-size:14px;min-height:44px;min-width:44px;display:flex;align-items:center;gap:6px;align-self:flex-start}
.nhead{display:flex;flex-direction:column;gap:2px}
.pad{padding:14px;display:flex;flex-direction:column;gap:8px}
.optrow{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.optrow+.optrow,.optrow+.row,.row+.optrow{border-top:1px solid var(--line)}
.swc{width:52px;height:44px;flex:none;position:relative;display:grid;place-items:center}
.swc i{width:48px;height:28px;border-radius:999px;background:#8a8d94;position:relative;transition:background .15s}
.swc i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.swc[aria-checked=true] i{background:var(--ok)}.swc[aria-checked=true] i::after{left:23px}
.swc[disabled] i{opacity:.5}
.stats{display:flex;gap:8px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.stats b{font:700 20px var(--f-display)}.stats span{font-size:12px;color:var(--muted)}
.gl{display:flex;align-items:center;gap:8px;padding:0 10px 0 0;min-height:56px}
.gl+.gl,.gl+.row{border-top:1px solid var(--line)}
.nm{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:8px 0 8px 14px;min-height:56px}
.gl.isin .t b::before{content:'\2713  ';color:var(--ok)}
.act.in{background:#e3f1e8;color:var(--ok);border:1px solid var(--ok)}
.tag.wk{color:var(--c-dj);border-color:var(--c-dj)}
.tag.live{color:var(--ok);border-color:var(--ok)}.tag.draft{color:#8a5a00;border-color:#8a5a00}
.row.mid{justify-content:center;font-weight:600}
.row.del b{color:var(--danger)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.banner.warn{background:#fdf3e1;border-color:#e8cf9d}
.banner.ok{background:#e3f1e8;border-color:#a9d3b8}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px;font:inherit;font-size:16px;color:var(--fg);flex:none}
.search::placeholder,.addline input::placeholder,.field input::placeholder{color:var(--muted);opacity:1}
.head{display:flex;align-items:center;gap:10px}.head h2{flex:1}
.ev{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;min-height:64px}
.ev+.ev{border-top:1px solid var(--line)}
.dt{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.dt small{font-size:12px;color:var(--muted);font-weight:600}.dt b{font:700 20px var(--f-display)}
.glc{font-size:12px;font-weight:600;color:var(--c-dj)}
.variant{font-size:12px;font-weight:700;color:var(--danger);border:2px dashed var(--danger);border-radius:10px;padding:6px 10px;background:#fff}
.pubnote{border-top:1px solid var(--line);padding-top:10px}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:600}
.field input,.addline input{font:inherit;font-size:16px;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);color:var(--fg);width:100%;min-width:0}
.addline{display:flex;gap:8px;align-items:center}
.radio{display:flex;flex-direction:column}
.radio button{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;min-height:56px;width:100%}
.radio button+button{border-top:1px solid var(--line)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px}
.radio [aria-checked=true] .dot{border:6px solid var(--fg)}
.mono{font-family:ui-monospace,monospace;font-size:13px;overflow-wrap:anywhere}
.cam{height:220px;border-radius:14px;background:#1d1f24;color:#fff;display:grid;place-items:center;font-weight:600;text-align:center;padding:16px;flex:none}
.seg.sub{flex-wrap:nowrap;flex:none}.seg.sub button{flex:1 1 0}
.door{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:none}
.door div:first-child{font-size:15px}.door div:first-child b{font:700 28px var(--f-display)}
.door span{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--ink-soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pub{display:flex;flex-direction:column;gap:10px}
.pub p{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--bg)}
.pill.me{border-color:var(--ok);color:var(--ok);font-weight:700}.pill.more{color:var(--muted)}
.notice b{color:var(--fg)}
.card{flex:none}
</style>

<body>
<div class="wrap">
  <h1>Option A: one page per night</h1>
  <div class="ctl"><span class="lbl">Shape</span><div class="seg" id="shseg"></div></div>
  <div class="frame" id="frame"></div>
  <p class="cap foot" id="foot"></p>
</div>
<script>
// OPTION A: one page per night. Switch, counts, actions, the list (with Check in on the night) and the
// settings all on one scroll, in that order.
const TITLE='Option A: one page per night';
const FOOT='<b>Option A, one page per night.</b> Open a night on Events, tap Open the guest list, and everything for that night is on one scroll: the on/off switch, the counts, Add / Share link / Scan, the names (each with Check in on the night), then the settings for this night. Nothing is hidden behind a second level of tabs. The <b>team-only</b> shape (or <code>&amp;v=team</code>) is the privacy alternative, clearly marked; the owner chose public names. Every name is a made-up example.';
function counts(){const n=live().length,s=sh();return `<div class="stats"><div><b>${n}</b><span>names</span></div><div><b>${s.door||s.past?inCount():places()-n<0?0:places()-n}</b><span>${s.door||s.past?'in':'places left'}</span></div><div><b>${s.door||s.past?n-inCount():NIGHT.close}</b><span>${s.door||s.past?'not yet':'closes'}</span></div></div>`}
function actions(){
 const s=sh(),w=lockWhy();
 if(w)return '';
 return `<div class="qa"><button data-act="sheet" data-k="add">Add a name</button>${s.door?'<button data-act="sheet" data-k="qr">Scan QR</button>':s.full||s.closed?'<button data-act="sheet" data-k="settings">Settings</button>':'<button data-act="sheet" data-k="link">Share link</button>'}</div>`;
}
function glBody(s){
 let h=backBar()+viewOnly()+teamVariantBadge()+`<div class="card">${switchRow()}</div>`;
 if(!s.on)return h+emptyCard();
 h+=stateBanner()+(statusLine()?`<p class="cap">${statusLine()}</p>`:'')+(s.cx?'':counts())+actions();
 if(!live().length)h+=emptyCard();
 else{
  const m=matches(),cut=50*(S.more+1),dw=doorWhy();
  h+=search()+`${s.door||s.past?`<h3>Names &middot; tap Check in as people arrive</h3>`:'<h3>Names</h3>'}${(s.door||s.past)&&dw&&canEdit()?`<p class="why">${dw}</p>`:''}<div class="card">${m.slice(0,cut).map(([x,i])=>nameRow(x,i,{check:s.door||s.past})).join('')}${moreRow(m.length,Math.min(cut,m.length))}</div>`;
  if(!m.length)h+=noMatch();
  h+=`<button class="btn alt" data-act="toast" data-k="Downloads names.csv: name, how added, checked in">Download names</button>`;
 }
 h+=`<h3>Settings for this night</h3>${settingsRows()}<p class="why pubnote">${PUBLIC_LINE()}</p>`;
 return h;
}

document.getElementById('foot').innerHTML=FOOT;
// Shared Guest-list core: ONE copy of every fact both options show (switch, places, closing, public rule,
// check-in, remove, contributor reason, dancer view). a.js / b.js only lay it out.
// Every person, page and link is an obviously fake example (Sample, Example, Placeholder ...).
const NIGHT={s:'Sample Social Night',d:'Fri 21 Nov',t:'21:00',close:'22:00',places:60,rec:'every Friday'};
const FIRST=['Ana','Ben','Cleo','Dan','Eva','Finn','Gia','Hugo','Iris','Jon','Kira','Leo','Mae','Nico','Orla','Pia','Quin','Rosa','Theo','Uma','Vic','Wren','Xan','Yara','Zed'];
const LAST=['Sample','Example','Placeholder','Demo','Testcase','Mockup'];
// by: self = added themselves, team = added by the team, week = on every night of the series
function mk(n,inN,o={}){
 const out=[];
 for(let i=0;i<n;i++){
  const by=i<(o.week??2)?'week':i%4===1?'team':'self';
  out.push({n:i===5?'Maria-Fernanda Placeholder-Longname':`${FIRST[i%25]} ${LAST[Math.floor(i/25)%6]}`,by,inn:i<inN,at:by==='week'?'':`${14+(i%8)}:${String((i*7)%60).padStart(2,'0')}`,who:i%8===1?'Ben Sample':'you'});
 }
 return out;
}
const SHAPES={
 entry:{lab:'Night card',view:'entry'},
 entrysheet:{lab:'Night sheet',view:'entry',sheet:'night'},
 off:{lab:'Off',on:0,names:[]},
 empty:{lab:'On, empty',on:1,names:[]},
 normal:{lab:'23 names',on:1,names:mk(23,0)},
 huge:{lab:'140 names',on:1,names:mk(140,0),places:150},
 full:{lab:'Full',on:1,names:mk(60,0),full:1},
 closed:{lab:'Closed',on:1,names:mk(31,0),closed:1},
 door:{lab:'At the door',on:1,names:mk(63,41),door:1},
 past:{lab:'Past night',on:1,names:mk(18,14),past:1},
 cancelled:{lab:'Cancelled',on:1,names:mk(12,0),cx:1},
 contributor:{lab:'Contributor',on:1,names:mk(23,6),door:1,seat:'contributor'},
 loading:{lab:'Loading'},
 error:{lab:'Error'},
 teamonly:{lab:'Variant: team-only',on:1,names:mk(23,0),team:1},
 dancer:{lab:'Dancer view',view:'dancer',names:mk(23,0)},
 dancerin:{lab:'Dancer, on list',view:'dancer',names:mk(23,0),me:1}
};
const S={shape:'normal',sheet:null,of:null,q:'',view:null,more:0,v:null,undo:null};
const $=q=>document.querySelector(q);
const sh=()=>SHAPES[S.shape];
const canEdit=()=>sh().seat!=='contributor';
const teamOnly=()=>sh().team||S.v==='team';
const plural=(n,a,b)=>`${n} ${n===1?a:(b||a+'s')}`;
const places=()=>sh().places||NIGHT.places;
const live=()=>sh().names.filter(x=>!x.gone);
const inCount=()=>live().filter(x=>x.inn).length;
// One reason string per locked control (shown under it; never a silent grey button).
const VIEW_WHY='Contributors can look at the list but cannot change it. Ask an owner (Sam Sample) to make you a manager.';
const lockWhy=()=>{const s=sh();return !canEdit()?VIEW_WHY:s.cx?'This night was cancelled, so the list is kept but cannot change.':s.past?'This night has passed. The list is kept as a record of who came.':''};
const doorWhy=()=>{const s=sh();return !canEdit()?VIEW_WHY:s.cx?'Nobody can check in to a cancelled night.':s.past?'Check-in closed when the night ended.':''};
// Public rule (owner 2026-11-12): names are PUBLIC on the event page. Variant: team only.
const PUBLIC_LINE=()=>teamOnly()
 ?'<b>Variant: names are for your team only.</b> Dancers see the count and their own name, never anyone else&rsquo;s.'
 :'<b>Names on this list are public</b> on your event page. Dancers are told before they add themselves, and can remove themselves.';
const byLine=x=>x.by==='week'?'Every week &middot; added by you':x.by==='team'?`Added by ${x.who==='you'?'you':x.who} at ${x.at}`:`Added themselves at ${x.at}`;
function statusLine(){
 const s=sh(),n=live().length;
 if(s.cx||s.past||s.full||s.closed)return '';
 if(!s.on)return 'Off for this night. Dancers do not see a guest list.';
 if(s.cx)return `Night cancelled. ${plural(n,'name')} kept. Nobody on the list was emailed: tell them yourself.`;
 if(s.past)return `Night over. ${inCount()} of ${n} came.`;
 if(s.door)return `Tonight. Sign-up closed at ${NIGHT.close}.`;
 if(s.closed)return `Sign-up closed at ${NIGHT.close}. You can still add names.`;
 if(s.full)return `Full: ${n} of ${places()} places. Dancers see &ldquo;The guest list is full&rdquo;. You can still add names.`;
 return `Dancers can add themselves until ${NIGHT.close} on the night &middot; ${plural(places()-n,'place')} left of ${places()}`;
}
// ---- shared pieces ----
function backBar(){return `<button class="back" data-act="toast" data-k="Back to Events (drawn in the Events design)"><span aria-hidden="true">&lsaquo;</span> Events</button><div class="nhead"><h2>Guest list</h2><p class="cap"><b>${NIGHT.s}</b> &middot; ${NIGHT.d}, ${NIGHT.t}</p></div>`}
function switchRow(){
 const s=sh(),why=!canEdit()?VIEW_WHY:s.cx||s.past?lockWhy():'';
 return `<div class="optrow"><span class="t"><b>Guest list for this night</b><span>${why||(s.on?'On. Only this night: other Fridays keep their own setting.':'Off. Turn it on to let dancers add their names.')}</span></span><button class="swc" role="switch" aria-checked="${!!s.on}" aria-label="Guest list for this night" data-act="${why?'':'onoff'}"${why?' disabled':''}><i></i></button></div>`;
}
function search(){return live().length>20?`<input id="q" class="search" type="search" aria-label="Find a name" placeholder="Find a name in ${live().length}" value="${S.q}" data-act="q">`:''}
function matches(){const q=S.q.toLowerCase();return sh().names.map((x,i)=>[x,i]).filter(([x])=>!x.gone&&(!q||x.n.toLowerCase().includes(q)))}
function checkBtn(x,i){
 const w=doorWhy();
 if(x.inn)return `<button class="act in" data-act="${w?'':'check'}" data-k="${i}" aria-label="${x.n} is in. Undo check-in"${w?' disabled':''}>In &check;</button>`;
 return `<button class="act alt" data-act="${w?'':'check'}" data-k="${i}" aria-label="Check in ${x.n}"${w?' disabled':''}>Check in</button>`;
}
function nameRow(x,i,o={}){
 const tag=x.by==='week'?'<span class="tag wk">Every week</span>':'';
 const main=`<span class="t"><b>${x.n}</b><span>${byLine(x)}</span></span>`;
 const open=canEdit()&&!sh().cx&&!sh().past;
 const left=open?`<button class="nm" data-act="person" data-k="${i}" aria-label="${x.n}. Options">${main}${tag}</button>`:`<div class="nm">${main}${tag}</div>`;
 return `<div class="gl ${x.inn?'isin':''}">${left}${o.check?checkBtn(x,i):''}</div>`;
}
function noMatch(){return `<div class="card pad"><b>No name matches &ldquo;${S.q}&rdquo;</b><p class="why">Check the spelling, or add them if they are not on the list.</p><button class="btn alt" data-act="clearq">Clear search</button></div>`}
function moreRow(total,shown){return shown<total?`<button class="row mid" data-act="more">Show ${Math.min(50,total-shown)} more (${shown} of ${total} shown)</button>`:''}
function emptyCard(){
 const s=sh();
 if(!s.on)return `<div class="card pad"><b>No guest list on this night</b><p class="why">Turn the switch on and dancers can add their names on your event page. You can add names yourself too.</p>${canEdit()?'<button class="btn" data-act="onoff">Turn on for this night</button>':''}</div>`;
 return `<div class="card pad"><b>Nobody on the list yet</b><p class="why">Dancers see &ldquo;Be the first on the list&rdquo;. Share your sign-up link, or add the first names yourself.</p>${canEdit()?'<div class="qa"><button data-act="sheet" data-k="add">Add a name</button><button data-act="sheet" data-k="link">Share sign-up link</button></div>':''}</div>`;
}
function stateBanner(){
 const s=sh();
 if(s.cx)return `<div class="banner"><b>This night was cancelled.</b> The ${plural(live().length,'name')} stay here. Nobody on the guest list was emailed (we only have first names), so tell them yourself.</div>`;
 if(s.past)return `<div class="banner">This night has passed. Dancers no longer see the list. It stays here as a record.</div>`;
 if(s.full)return `<div class="banner warn"><b>The list is full.</b> Sign-up stopped at ${places()} names. Raise the places in Settings, or add names yourself.</div>`;
 if(s.closed)return `<div class="banner">Sign-up closed at ${NIGHT.close}. Dancers see &ldquo;Guest list is closed&rdquo;. You can still add names.</div>`;
 return '';
}
function viewOnly(){return canEdit()?'':`<div class="banner">${VIEW_WHY}</div>`}
function teamVariantBadge(){return teamOnly()?'<div class="variant" role="note">VARIANT, not the owner&rsquo;s choice: names for the team only</div>':''}
function loadingBody(){return backBar()+`<div class="card pad" aria-busy="true"><div class="skel" style="width:60%"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:40%"></div></div><button class="btn" disabled>Add a name</button><p class="why">Loading the names for this night. Add wakes up as soon as they load, usually in a second.</p>`}
function errorBody(){return backBar()+`<div class="banner err"><b>We could not load this guest list.</b> Nothing was changed: nobody was added, removed or checked in. Check your signal and try again.</div><button class="btn" data-act="retry">Try again</button>`}
// ---- sheets ----
function addSheet(){
 return `<button class="x" data-act="close">Close</button><h2>Add a name</h2><div class="field"><label for="nm">Name</label><input id="nm" placeholder="e.g. Ana Sample" maxlength="80"></div>
 <div class="radio card" role="radiogroup" aria-label="Which nights"><button role="radio" aria-checked="true"><span class="dot"></span><span class="t"><b>This night only</b><span>${NIGHT.d}</span></span></button><button role="radio" aria-checked="false"><span class="dot"></span><span class="t"><b>Every week</b><span>On every ${NIGHT.rec.replace('every ','')} until you remove them</span></span></button></div>
 <p class="why">${teamOnly()?'Only your team sees this name.':'This name will be visible on your public event page.'} Names you add do not count against the places.</p><button class="btn" data-act="added">Add to the list</button>`;
}
function personSheet(){
 const x=sh().names[S.of];
 const wk=x.by==='week';
 return `<button class="x" data-act="close">Close</button><h2>${x.n}</h2><p class="cap">${byLine(x)}${x.inn?' &middot; checked in':''}</p>
 <div class="card">${sh().door||x.inn?`<button class="row" data-act="check" data-k="${S.of}"><span class="t"><b>${x.inn?'Undo check-in':'Check in'}</b><span>${x.inn?'Marks them as not arrived':'Marks them as arrived'}</span></span></button>`:''}
 <button class="row del" data-act="sheet" data-k="remove" data-of="${S.of}"><span class="t"><b>Remove from the list</b><span>${wk?'This night only, or every week. You choose next.':'You can undo for a few seconds.'}</span></span></button></div>`;
}
function removeSheet(){
 const x=sh().names[S.of],wk=x.by==='week',self=x.by==='self';
 return `<button class="x" data-act="close">Close</button><h2>Remove ${x.n}?</h2>
 <p class="cap">${teamOnly()?'':'Their name leaves your public page at once. '}${self?'We do not message them; they will see they are no longer on the list if they look.':'They were added by your team.'}</p>
 ${wk?`<div class="radio card" role="radiogroup" aria-label="Remove from"><button role="radio" aria-checked="true"><span class="dot"></span><span class="t"><b>This night only</b><span>${NIGHT.d}. They stay on every other week.</span></span></button><button role="radio" aria-checked="false"><span class="dot"></span><span class="t"><b>Every week</b><span>From this night on</span></span></button></div>`:''}
 <button class="btn danger" data-act="removed" data-k="${S.of}">Remove ${x.n.split(' ')[0]}</button><button class="btn alt" data-act="close">Keep ${x.n.split(' ')[0]}</button>`;
}
function settingsRows(){
 const w=lockWhy(),dis=w?' disabled':'',chev='<span aria-hidden="true">&rsaquo;</span>';
 const r=(b,sub,act)=>`<button class="row" data-act="${w?'':act}"${dis}><span class="t"><b>${b}</b><span>${sub}</span></span>${chev}</button>`;
 return `<div class="card">${r('Places',`${places()} (dancers stop at ${places()}; you can still add)`,'toast')}
 ${r('Sign-up closes',`${NIGHT.close} on the night`,'toast')}
 ${r('Price on the list','&pound;8 instead of &pound;12, party only. Set in Edit','toast')}
 ${r('Arrive before','23:00 for the list price. Set in Edit','toast')}
 ${r('Note for dancers','&ldquo;Show your name at the door.&rdquo; Set in Edit','toast')}
 ${r('Self sign-up link','A link you can post; it opens the sign-up for this night','link')}
 ${r('QR check-in','Each dancer gets a QR code; scan it at the door','qr')}</div>${w?`<p class="why">${w}</p>`:''}`;
}
function settingsSheet(){return `<button class="x" data-act="close">Close</button><h2>Guest list settings</h2><p class="cap">For ${NIGHT.d} only.</p><div class="card">${switchRow()}</div>${settingsRows()}`}
function linkSheet(){return `<button class="x" data-act="close">Close</button><h2>Self sign-up link</h2><p class="cap">Post it in your group chat or bio. It opens the guest list for <b>${NIGHT.d}</b>. Dancers sign in, then add themselves.</p>
 <div class="capbox mono">bachata.example.com/g/sample-social-21nov</div><div class="qa"><button data-act="toast" data-k="Link copied">Copy link</button><button data-act="toast" data-k="Share sheet opens">Share</button></div>
 <p class="why">The link stops working when sign-up closes (${NIGHT.close}) or the list is full.</p>`}
function qrSheet(){return `<button class="x" data-act="close">Close</button><h2>Scan a QR code</h2><div class="cam" role="img" aria-label="Camera view">Point the camera at the dancer&rsquo;s code</div>
 <p class="cap">Each dancer on the list has a code on their ticket screen. Scanning checks them in; a code for another night says so.</p>
 <div class="banner ok" role="status"><b>Ana Sample is in.</b> ${inCount()} of ${live().length} in.</div><p class="why">No camera? Close this and tap Check in next to the name.</p>`}
function nightSheet(){
 const s=SHAPES.normal;
 return `<button class="x" data-act="close">Close</button><div class="head"><h2>${NIGHT.s}</h2><span class="tag live">Live</span></div><p class="cap"><b>${NIGHT.d}, ${NIGHT.t}</b> &middot; 48 going</p>
 <div class="card"><button class="row" data-act="toast" data-k="Edit (drawn in the Events design)"><span class="t"><b>Edit</b><span>Change this night only, or every date from here on</span></span><span aria-hidden="true">&rsaquo;</span></button></div>
 <h3>On the night</h3><div class="card"><div class="optrow"><span class="t"><b>Guest list</b><span>On &middot; ${s.names.length} names &middot; closes ${NIGHT.close}</span></span><button class="swc" role="switch" aria-checked="true" aria-label="Guest list for this night" data-act="toast" data-k="Switch: see the Off shape"><i></i></button></div>
 <button class="row" data-act="shape" data-k="normal"><span class="t"><b>Open the guest list</b><span>Add, remove and check people in</span></span><span aria-hidden="true">&rsaquo;</span></button>
 <div class="optrow"><span class="t"><b>Raffle</b><span>Coming soon. It will switch on per night, here.</span></span><button class="act alt" data-act="toast" data-k="Noted">Tell us</button></div></div>
 <p class="why">The switch is for this night only. Other Fridays keep their own setting.</p>`;
}
function entryBody(){
 const ev=(dw,dn,n,sub,gl,tag)=>`<button class="ev" data-act="sheet" data-k="night"><span class="dt" aria-hidden="true"><small>${dw}</small><b>${dn}</b></span><span class="t"><b>${n}</b><span>${sub}</span>${gl?`<span class="glc">Guest list &middot; ${gl}</span>`:''}</span><span class="tag ${tag}">${tag==='live'?'Live':'Draft'}</span></button>`;
 return `<h2>Events</h2><p class="cap">Tap a night to open it. Nights with a guest list show its count.</p><h3>This week</h3><div class="card">${ev('Fri','21',NIGHT.s,'21:00 &middot; 48 going','23 names, closes 22:00','live')}${ev('Sat','22','Sample Saturday Class','19:30 &middot; 12 going','','live')}</div>
 <h3>Next week</h3><div class="card">${ev('Fri','28',NIGHT.s,'21:00 &middot; 9 going','Off for this night','live')}${ev('Sun','30','Example Sunday Social','Needs a venue','','draft')}</div>`;
}
// The public event page block (dancer side). Signed in; one entry per account; remove-me.
function dancerBody(){
 const s=sh(),t=teamOnly(),n=s.names.length+(s.me?1:0);
 const pills=t?'':`<div class="pills">${s.me?'<span class="pill me">You (Sol)</span>':''}${s.names.slice(0,14).map(x=>`<span class="pill">${x.n.split(' ')[0]}</span>`).join('')}<span class="pill more">+${s.names.length-14} more</span></div>`;
 const act=s.me
  ?`<div class="banner ok" role="status"><b>You are on the list</b> as Sol. Show your name at the door.</div><button class="btn alt" data-act="toast" data-k="Removed. Your name left the list.">Remove me from the list</button><p class="why">One entry per account. Removing frees your place for someone else.</p>`
  :`<button class="btn" data-act="shape" data-k="dancerin">Add my name</button><p class="why notice">${t?'Only the organiser&rsquo;s team will see your name.':'<b>Your name will be visible on this list.</b>'} One entry per account; you can remove yourself any time.</p>`;
 return `<div class="pub"><p class="lbl">Public event page &middot; signed in as Sol Example</p><h2>${NIGHT.s}</h2><p class="cap">${NIGHT.d}, ${NIGHT.t}</p>
 <section class="card pad">${teamVariantBadge()}<h3 style="margin:0">Guest list</h3><p><b>${plural(n,'dancer')} on the list</b> &middot; closes ${NIGHT.close}</p><p class="cap">&pound;8 instead of &pound;12 if you arrive before 23:00.</p>${pills}${act}</section></div>`;
}
// ---- frame ----
function idbar(){const seat=canEdit()?'Owner':'Contributor';return `<div class="idbar r-org"><button class="idmain" data-act="toast" data-k="Switch: drawn on Home" aria-label="Organiser, ${seat}, Sample Socials London. Switch page"><span class="badge r-org" style="--s:40px">ORG</span><span class="idtxt"><small>Organiser &middot; ${seat}</small><b>Sample Socials London</b></span></button><button class="sw" data-act="toast" data-k="Switch: drawn on Home" aria-label="Switch page">Switch &#9662;</button></div>`}
function tabs(){return `<nav class="tabs" aria-label="Organiser area">${[['home','Home'],['events','Events'],['tickets','Tickets'],['team','Team']].map(t=>`<button data-act="tab" data-k="${t[0]}" aria-current="${t[0]==='events'}">${t[1]}</button>`).join('')}</nav>`}
var tt;
function toast(m){clearTimeout(tt);let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');$('#frame').appendChild(el)}el.innerHTML=m;tt=setTimeout(()=>el.remove(),2200)}
const SHEETS={add:addSheet,person:personSheet,remove:removeSheet,settings:settingsSheet,link:linkSheet,qr:qrSheet,night:nightSheet};
function render(){
 $('#shseg').innerHTML=Object.keys(SHAPES).map(k=>`<button data-act="shape" data-k="${k}" aria-pressed="${S.shape===k}">${SHAPES[k].lab}</button>`).join('');
 const s=sh();
 let h;
 if(s.view==='dancer')h=`<main class="scroll" id="scroll">${dancerBody()}</main>`;
 else{
  const body=S.shape==='loading'?loadingBody():S.shape==='error'?errorBody():s.view==='entry'?entryBody():glBody(s);
  h=idbar()+`<main class="scroll" id="scroll">${body}</main>`+tabs();
 }
 if(S.sheet)h+=`<div class="sheetbg" data-act="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${S.sheet}">${SHEETS[S.sheet]()}</div></div>`;
 $('#frame').innerHTML=h;
 if(S.undo)toast(S.undo),S.undo=null;
}
function setShape(k){S.shape=k;const s=SHAPES[k];S.sheet=s.sheet||null;S.of=null;S.q='';S.more=0;S.view=s.door?'door':'names'}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
 const a=t.dataset.act,k=t.dataset.k;
 if(a==='bg'){if(e.target===t){S.sheet=null;render()}return}
 if(a==='shape')setShape(k);
 else if(a==='person'){S.sheet='person';S.of=+k}
 else if(a==='sheet'){S.sheet=k;if(t.dataset.of)S.of=+t.dataset.of}
 else if(a==='close')S.sheet=null;
 else if(a==='view')S.view=k;
 else if(a==='more')S.more++;
 else if(a==='check'){const x=sh().names[+k];x.inn=!x.inn;S.sheet=null}
 else if(a==='removed'){const x=sh().names[+k];x.gone=1;S.sheet=null;S.undo=`${x.n} removed. <u>Undo</u>`}
 else if(a==='added'){S.sheet=null;S.undo='Added to the list'}
 else if(a==='onoff'){sh().on=!sh().on}
 else if(a==='retry')setShape('normal');
 else if(a==='tab'){toast('Prototype: the guest list lives inside a night on Events');return}
 else if(a==='toast'){toast(k||'Prototype: opens Edit');return}
 else if(a==='clearq')S.q='';
 else if(a==='q')return;
 render();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(p,p)}}});
(function init(){
 const h=new URLSearchParams(location.hash.slice(1));
 for(const k of h.keys())if(SHAPES[k])setShape(k);
 if(h.get('sheet')){S.sheet=h.get('sheet');if(h.get('of'))S.of=+h.get('of')}
 if(h.get('view'))S.view=h.get('view');
 if(h.get('v'))S.v=h.get('v');
 if(h.get('q'))S.q=h.get('q');
 if(h.has('shot'))document.body.classList.add('shot');
 render();
})();
</script>
</body>
</html>
